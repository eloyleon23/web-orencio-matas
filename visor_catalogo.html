<header class="visor-header">
    <a id="btn-volver" href="productos.html"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    <span class="visor-titulo" id="visor-titulo">Cargando catálogo…</span>
    <a id="btn-descargar-visor" href="#" target="_blank" rel="noopener"><i class="fa-solid fa-download"></i> Descargar</a>
</header>

<div class="visor-frame-wrap" id="visor-frame-wrap" style="display:none">
    <iframe id="visor-iframe" src=""></iframe>
</div>

<div class="visor-estado" id="visor-cargando">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Cargando catálogo…</p>
</div>

<div class="visor-estado" id="visor-error" style="display:none">
    <i class="fa-solid fa-clock"></i>
    <p>El catálogo está siendo preparado.<br>Mientras tanto puedes contactar con nosotros.</p>
</div>

<script>
(function () {
    const AREAS = {
        drogueria:  { pdf: 'catalogo_drogueria.pdf',  titulo: 'Catálogo de Droguería Profesional' },
        perfumeria: { pdf: 'catalogo_perfumeria.pdf', titulo: 'Catálogo de Perfumería y Cosmética' },
        pinturas:   { pdf: 'catalogo_pinturas.pdf',   titulo: 'Catálogo de Pinturas, Barnices y Material Profesional' },
        talleres:   { pdf: 'catalogo_talleres.pdf',   titulo: 'Catálogo Talleres Orencio Matas' },
    };

    const params = new URLSearchParams(window.location.search);
    const area = params.get('area');
    const cfg = AREAS[area];

    if (!cfg) {
        mostrarError();
        return;
    }

    document.getElementById('visor-titulo').textContent = cfg.titulo;

    // "Volver" debe regresar a la vista de muestra del área (de donde
    // vino el usuario), no saltarse ese paso yendo directo a
    // productos.html — así el usuario decide él mismo si quiere seguir
    // retrocediendo desde ahí.
    document.getElementById('btn-volver').href = `catalogo_${area}.html`;

    // Los PDFs ya no se sirven desde el repositorio (data/catalogos/) ni
    // desde GitHub Releases (que fuerza descarga con
    // 'Content-Disposition: attachment' en la propia URL firmada, sin
    // poder quitarlo desde el cliente) — se consultan directamente en
    // Drive, vía el mismo Web App de Apps Script que ya usa el
    // buscador. Sin depender de ningún despliegue, ni en GitHub Pages
    // ni en IONOS: en cuanto Apps Script sincroniza un PDF nuevo tras
    // cada generación, está disponible aquí al instante.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwqJOASK7XTqZ_XH2wt512Es5DlItsjIQn24JYGuuNMcuolzvi5P8L-m0N5Sf0oHzQ7/exec';

    fetch(`${APPS_SCRIPT_URL}?accion=obtener_catalogos`, { cache: 'no-store' })
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(datos => {
            const info = datos[area];
            if (!info || !info.id) { mostrarError(); return; }

            // Drive sirve PDFs con vista previa embebible nativa
            // (/preview) — se ve inline en el iframe sin forzar descarga,
            // igual que antes con el archivo servido desde el propio
            // sitio. La descarga real usa la URL directa de descarga.
            const urlVista = `https://drive.google.com/file/d/${info.id}/preview`;
            const urlDescarga = `https://drive.google.com/uc?export=download&id=${info.id}`;

            const btnDescargar = document.getElementById('btn-descargar-visor');
            btnDescargar.href = urlDescarga;

            document.getElementById('visor-iframe').src = urlVista;
            document.getElementById('visor-cargando').style.display = 'none';
            document.getElementById('visor-frame-wrap').style.display = '';
            document.getElementById('visor-iframe').addEventListener('error', mostrarError);
        })
        .catch(mostrarError);

    function mostrarError() {
        document.getElementById('visor-cargando').style.display = 'none';
        document.getElementById('visor-error').style.display = '';
    }
})();
</script>
