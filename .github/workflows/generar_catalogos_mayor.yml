name: Generar Catálogos PDF al por mayor

# Variante independiente de "Generar Catálogos PDF" (generar_catalogos.yml):
# genera los mismos 4 catálogos por área pero con el precio AL POR MAYOR
# y el aviso "PRECIO AL POR MAYOR" en todas las páginas (ver
# scripts/generar_catalogos_mayor.py). Los PDFs resultantes se guardan en
# la misma ubicación que los normales (data/catalogos/) pero con nombre
# distinto (sufijo "_mayor"), sin sustituir ni mezclarse nunca con ellos —
# pensado para enlazarse más adelante desde el futuro perfil de cliente
# profesional de la web.

on:
  repository_dispatch:
    types: [generar_catalogos_mayor]
  workflow_dispatch:
    inputs:
      limite_productos:
        description: 'Modo prueba: máximo de productos por área (vacío = catálogo completo real)'
        required: false
        default: ''

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install reportlab pillow requests cairosvg pymupdf

      - name: Generar PDFs al por mayor
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          LIMITE_PRODUCTOS_CATALOGO: ${{ github.event.inputs.limite_productos }}
        run: python scripts/generar_catalogos_mayor.py

      - name: Copiar catálogos a data/ (servidos vía GitHub Pages, sin forzar descarga)
        run: |
          mkdir -p data/catalogos
          cp catalogos_output/manifiesto_mayor.json data/
          cp catalogos_output/*.pdf data/catalogos/

      - name: Commit catálogos y manifiesto en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reintento robusto ante el remoto movido — mismo patrón que
          # generar_catalogos.yml / generar_productos_json.yml: "pull
          # --rebase" entraba en CONFLICTO REAL en cuanto main se movía
          # mientras corría este workflow, porque los PDF y el
          # manifiesto son binarios/generados por completo en cada
          # ejecución (git no puede fusionar la versión vieja del commit
          # local con la nueva de main). En cada intento se vuelve a
          # comitear los archivos YA GENERADOS en este mismo run sobre
          # la base más reciente de main.
          for intento in 1 2 3; do
            git add data/manifiesto_mayor.json data/catalogos/*_mayor.pdf
            if git diff --staged --quiet; then
              echo "Nada que subir (contenido ya al día)."
              exit 0
            fi
            git commit -m "Auto: actualizar catálogos al por mayor $(date +'%Y-%m-%d %H:%M')"
            if git push; then
              echo "Push correcto (intento $intento)."
              exit 0
            fi
            echo "Push rechazado (intento $intento/3) — el remoto se movió mientras tanto."

            mkdir -p /tmp/catalogos_mayor_regenerados
            cp data/manifiesto_mayor.json /tmp/catalogos_mayor_regenerados/
            cp data/catalogos/*_mayor.pdf /tmp/catalogos_mayor_regenerados/
            git reset --hard HEAD~1   # deshacer SOLO el commit local que no se pudo subir
            git fetch origin main
            git reset --hard origin/main   # partir de la base más reciente real
            mkdir -p data/catalogos
            cp /tmp/catalogos_mayor_regenerados/manifiesto_mayor.json data/
            cp /tmp/catalogos_mayor_regenerados/*_mayor.pdf data/catalogos/
          done
          echo "No se pudo hacer push tras 3 intentos." >&2
          exit 1

      - name: Publicar como Release (para el botón de descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: catalogos-mayor-latest
          name: Catálogos Orencio Matas — al por mayor
          body: "Catálogos al por mayor generados automáticamente desde Google Sheets"
          files: |
            catalogos_output/*.pdf
            catalogos_output/manifiesto_mayor.json
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sincronizar catálogos en Drive vía Apps Script
        # Mismo mecanismo que el catálogo normal, pero con su propio
        # manifiesto y sus propios archivos en Drive — no bloquea el
        # resto del workflow si falla.
        run: python3 scripts_ci/sincronizar_catalogos_mayor_drive.py

      - name: Disparar despliegue de Pages
        # Igual que en generar_catalogos.yml: el commit de arriba se hace
        # con el GITHUB_TOKEN por defecto, que no dispara el "on: push"
        # de otros workflows — se dispara aquí explícitamente por API.
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
