name: Desplegar en IONOS (SFTP)

# Publica una versión PARCIAL del sitio en el hosting IONOS (dominio
# actual www.orenciomatas.es), sustituyendo a la web antigua — sin el
# buscador ni el acceso a los catálogos todavía, hasta que estén listos
# y los productos validados. Ver scripts_ci/preparar_build_ionos.py para
# el detalle exacto de qué se publica y qué se excluye/transforma.
#
# Manual a propósito (workflow_dispatch) — esto NO se dispara solo en
# cada push a main, es una publicación deliberada que se lanza cuando se
# decide. Cuando llegue el momento de publicar el sitio completo (con
# buscador y catálogos), lo más sencillo será simplemente dejar de usar
# este workflow y apuntar el dominio a GitHub Pages, o adaptar
# preparar_build_ionos.py para que ya no excluya nada.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar contenido público parcial (sin buscador ni catálogos)
        run: python3 scripts_ci/preparar_build_ionos.py --origen . --salida ionos_build

      - name: Subir a IONOS por SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USER }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          protocol: sftp
          local-dir: ./ionos_build/
          server-dir: ${{ secrets.IONOS_SFTP_DIR }}
          # No borrar en destino lo que no venga en este build — más
          # seguro mientras se está probando el despliegue por primera
          # vez, evita borrar algo del hosting antiguo por error si el
          # directorio de destino no fuera exactamente el esperado.
          dangerous-clean-slate: false
