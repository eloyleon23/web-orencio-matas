name: Generar Catálogos PDF

on:
  repository_dispatch:
    types: [generar_catalogos]
  workflow_dispatch:
    inputs:
      limite_productos:
        description: 'Modo prueba: máximo de productos por área (vacío = catálogo completo real)'
        required: false
        default: ''

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install reportlab pillow requests cairosvg pymupdf

      - name: Generar PDFs
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          LIMITE_PRODUCTOS_CATALOGO: ${{ github.event.inputs.limite_productos }}
        run: python scripts/generar_catalogos.py

      - name: Copiar catálogos a data/ (servidos vía GitHub Pages, sin forzar descarga)
        run: |
          mkdir -p data/catalogos
          cp catalogos_output/manifiesto.json data/
          cp catalogos_output/*.pdf data/catalogos/

      - name: Commit catálogos y manifiesto en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifiesto.json data/catalogos/*.pdf
          git diff --staged --quiet || git commit -m "Auto: actualizar catálogos $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push

      - name: Publicar como Release (para el botón de descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: catalogos-latest
          name: Catálogos Orencio Matas
          body: "Catálogos generados automáticamente desde Google Sheets"
          files: |
            catalogos_output/*.pdf
            catalogos_output/manifiesto.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disparar despliegue de Pages
        # El commit de arriba se hace con el GITHUB_TOKEN por defecto —
        # por diseño de GitHub (para evitar bucles infinitos), un push
        # hecho así NO dispara el "on: push" de otros workflows, así que
        # deploy-pages.yml nunca se enteraba de que había catálogos
        # nuevos. Se dispara aquí explícitamente por API en su lugar.
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
