name: Generar Catálogos PDF

on:
  repository_dispatch:
    types: [generar_catalogos]
  workflow_dispatch:
    inputs:
      limite_productos:
        description: 'Modo prueba: máximo de productos por área (vacío = catálogo completo real)'
        required: false
        default: ''

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install reportlab pillow requests cairosvg pymupdf

      - name: Generar PDFs
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          LIMITE_PRODUCTOS_CATALOGO: ${{ github.event.inputs.limite_productos }}
        run: python scripts/generar_catalogos.py

      - name: Copiar catálogos a data/ (servidos vía GitHub Pages, sin forzar descarga)
        run: |
          mkdir -p data/catalogos
          cp catalogos_output/manifiesto.json data/
          cp catalogos_output/*.pdf data/catalogos/

      - name: Commit catálogos y manifiesto en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reintento robusto ante el remoto movido: en vez de "pull
          # --rebase" (que entra en CONFLICTO REAL en cuanto main se ha
          # movido mientras corría este workflow — los PDF y el
          # manifiesto son binarios/generados por completo en cada
          # ejecución, así que git no tiene forma de fusionar la versión
          # vieja del commit local con la nueva de main), en cada intento
          # se vuelve a comitear los archivos YA GENERADOS en este mismo
          # run sobre la base más reciente de main. Mismo patrón ya usado
          # en generar_productos_json.yml.
          for intento in 1 2 3; do
            git add data/manifiesto.json data/catalogos/*.pdf
            if git diff --staged --quiet; then
              echo "Nada que subir (contenido ya al día)."
              exit 0
            fi
            git commit -m "Auto: actualizar catálogos $(date +'%Y-%m-%d %H:%M')"
            if git push; then
              echo "Push correcto (intento $intento)."
              exit 0
            fi
            echo "Push rechazado (intento $intento/3) — el remoto se movió mientras tanto."

            mkdir -p /tmp/catalogos_regenerados
            cp data/manifiesto.json /tmp/catalogos_regenerados/
            cp data/catalogos/*.pdf /tmp/catalogos_regenerados/
            git reset --hard HEAD~1   # deshacer SOLO el commit local que no se pudo subir
            git fetch origin main
            git reset --hard origin/main   # partir de la base más reciente real
            mkdir -p data/catalogos
            cp /tmp/catalogos_regenerados/manifiesto.json data/
            cp /tmp/catalogos_regenerados/*.pdf data/catalogos/
          done
          echo "No se pudo hacer push tras 3 intentos." >&2
          exit 1

      - name: Publicar como Release (para el botón de descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: catalogos-latest
          name: Catálogos Orencio Matas
          body: "Catálogos generados automáticamente desde Google Sheets"
          files: |
            catalogos_output/*.pdf
            catalogos_output/manifiesto.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sincronizar catálogos en Drive vía Apps Script
        # La web ya no necesita depender de ningún despliegue (ni en
        # GitHub Pages ni en IONOS) para tener acceso a los catálogos
        # nuevos — Apps Script descarga los PDFs recién publicados
        # arriba y los guarda en Drive, en archivos de nombre fijo. No
        # bloquea el resto del workflow si falla.
        run: python3 scripts_ci/sincronizar_catalogos_drive.py

      - name: Disparar despliegue de Pages
        # El commit de arriba se hace con el GITHUB_TOKEN por defecto —
        # por diseño de GitHub (para evitar bucles infinitos), un push
        # hecho así NO dispara el "on: push" de otros workflows, así que
        # deploy-pages.yml nunca se enteraba de que había catálogos
        # nuevos. Se dispara aquí explícitamente por API en su lugar.
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d '{"ref":"main"}'
