name: Desplegar release en IONOS (SFTP)

# Sube a IONOS el contenido YA preparado en la rama "release" (ver
# workflow "Preparar release para IONOS") — este workflow no transforma
# ni excluye nada por sí mismo, solo publica tal cual lo que haya en esa
# rama en cada momento. Pensado para poder re-publicar la misma release
# (por ejemplo si hay que restaurar algo) sin necesidad de volver a
# generarla desde main.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Instalar lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Subir a IONOS por SFTP con lftp
        env:
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_DIR: ${{ secrets.IONOS_SFTP_DIR }}
        run: |
          lftp -u "$IONOS_SFTP_USER","$IONOS_SFTP_PASSWORD" -p "$IONOS_SFTP_PORT" "sftp://$IONOS_SFTP_HOST" \
            -e "set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; set cmd:fail-exit yes; mirror -R -v . \"$IONOS_SFTP_DIR\"; put -O \"$IONOS_SFTP_DIR\" .htaccess; bye"
