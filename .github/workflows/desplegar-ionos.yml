name: Desplegar release en IONOS (SFTP)

# Sube a IONOS el contenido YA preparado en la rama "release" (ver
# workflow "Preparar release para IONOS") — este workflow no transforma
# ni excluye nada por sí mismo, solo publica tal cual lo que haya en esa
# rama en cada momento. Pensado para poder re-publicar la misma release
# (por ejemplo si hay que restaurar algo) sin necesidad de volver a
# generarla desde main.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Subir a IONOS por SFTP
        # SamKirkland/FTP-Deploy-Action (usado antes) resultó NO admitir
        # el protocolo SFTP en absoluto pese al nombre genérico —
        # confirmado con el error real: "protocol: invalid parameter -
        # you provided 'sftp'. Try 'ftp', 'ftps', or 'ftps-legacy'
        # instead." Sustituido por una acción que sí habla SFTP/SSH de
        # verdad, con autenticación por contraseña (no clave SSH).
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_SFTP_USER }}
          server: ${{ secrets.IONOS_SFTP_HOST }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          ssh_private_key: ''
          local_path: './*'
          remote_path: ${{ secrets.IONOS_SFTP_DIR }}
          # Muchos hostings compartidos (como suele ser el caso en
          # IONOS) solo dan acceso SFTP puro, sin una sesión de shell
          # SSH completa detrás — esta opción evita que la acción
          # intente comandos que necesitarían esa shell.
          sftp_only: true
