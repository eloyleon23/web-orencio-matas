name: Actualizar Catálogo Zaphiro

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Detectar URL catálogo Zaphiro
        run: python scripts/actualizar_zaphiro.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zaphiro_config.json
          git diff --staged --quiet || git commit -m "Auto: actualizar URL catálogo Zaphiro $(date +'%Y-%m')"
          git push
