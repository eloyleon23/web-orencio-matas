name: Actualizar Catálogo Zaphiro

on:
  repository_dispatch:
    types: [actualizar_zaphiro]
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar config Zaphiro
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/actualizar_zaphiro.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zaphiro_config.json
          git diff --staged --quiet || git commit -m "Auto: actualizar config Zaphiro $(date +'%Y-%m')"
          git push
