name: Generar productos.json

on:
  workflow_dispatch:
  repository_dispatch:
    types: [generar_productos_json]
  schedule:
    # Ejecutar cada hora (suficiente para mantener datos actualizados)
    - cron: '0 * * * *'

# Evita que dos ejecuciones solapadas (ej. un disparo manual justo
# cuando salta el programado) intenten hacer push a la vez — sin esto,
# la segunda en terminar se encontraba con "! [rejected] main -> main
# (fetch first)" porque la rama ya se había movido con el commit de la
# primera. Con esto, la segunda simplemente ESPERA a que la primera
# termine (no se cancela, ambas son regeneraciones legítimas) antes de
# arrancar — evitando el conflicto de raíz en vez de solo reintentar
# tras el fallo.
concurrency:
  group: generar-productos-json
  cancel-in-progress: false

jobs:
  generar_json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generar productos.json
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python scripts/generar_productos_json.py

      - name: Sincronizar caché de Drive vía Apps Script
        # El buscador ya no depende de que este commit llegue a
        # desplegarse en GitHub Pages (ver notas en scripts/
        # apps_script_trigger.js sobre por qué se cambió) — lee
        # directamente de una caché en Drive que mantiene Apps Script.
        # Este paso envía el contenido recién regenerado para que esa
        # caché quede al día también tras cada regeneración completa
        # (cron horario o sincronización del CRM), no solo con las
        # actualizaciones puntuales de imagen. No depende del resultado
        # del commit de abajo — corre siempre que la generación en sí
        # haya ido bien.
        run: python3 scripts_ci/sincronizar_cache_drive.py

      - name: Commit and push cambios
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Reintento robusto ante el remoto movido: en vez de "pull
          # --rebase" (que puede entrar en CONFLICTO REAL si otra
          # ejecución paralela también cambió la misma línea de
          # productos_version.json — el timestamp — con un valor
          # distinto; git no puede fusionar automáticamente dos valores
          # distintos en la misma línea, y el rebase se detiene ahí, con
          # error, pese al reintento), en cada intento se vuelve a
          # comitear los archivos YA REGENERADOS en este mismo run
          # sobre la base más reciente de main.
          for intento in 1 2 3; do
            git add data/productos.json data/productos_version.json
            if git diff --staged --quiet; then
              echo "Nada que subir (contenido ya al día)."
              exit 0
            fi
            git commit -m "Auto: actualizar productos.json desde Google Sheets"
            if git push; then
              echo "Push correcto (intento $intento)."
              exit 0
            fi
            echo "Push rechazado (intento $intento/3) — el remoto se movió mientras tanto."

            # git reset --hard también borraría los archivos recién
            # regenerados de este run (los deja tal cual estén en
            # origin/main) — se guardan aparte para no perderlos, y se
            # restauran después de partir de la base fresca.
            cp data/productos.json /tmp/productos.json.regenerado
            cp data/productos_version.json /tmp/productos_version.json.regenerado
            git reset --hard HEAD~1   # deshacer SOLO el commit local que no se pudo subir
            git fetch origin main
            git reset --hard origin/main   # partir de la base más reciente real
            cp /tmp/productos.json.regenerado data/productos.json
            cp /tmp/productos_version.json.regenerado data/productos_version.json
          done
          echo "No se pudo hacer push tras 3 intentos." >&2
          exit 1
