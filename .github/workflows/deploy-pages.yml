name: Desplegar en GitHub Pages

# Sustituye al despliegue "legacy" (Settings → Pages → Source →
# "Deploy from a branch"), que solo permite UN despliegue a la vez y
# FALLA en vez de encolarse cuando llegan varios pushes seguidos (ej.
# al validar/subir varias imágenes seguidas desde el Asistente, cada
# acción hace su propio commit a productos.json). Este workflow usa las
# acciones oficiales de Pages, que si gestionan bien la cola.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Como mucho un despliegue en curso a la vez, pero los que lleguen
# mientras tanto se ENCOLAN (no se cancelan ni fallan) — se procesan en
# orden en cuanto el actual termina.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir todo el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
