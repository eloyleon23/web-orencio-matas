<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Panel OM"><link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/eloyleon23/web-orencio-matas/main/assets/logos/apple-touch-icon.png?v=2"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://raw.githubusercontent.com/eloyleon23/web-orencio-matas/main/assets/logos/apple-touch-icon.png?v=2"><link rel="icon" href="https://raw.githubusercontent.com/eloyleon23/web-orencio-matas/main/assets/logos/favicon-32x32.png?v=2"><title>Panel Orencio Matas</title><style>* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:#f1f2f4; color:#1a1a1a; padding-bottom:40px; }header { background:#1a1a1a; color:#fff; padding:16px 16px 14px; position:sticky; top:0; z-index:10; }header h1 { margin:0; font-size:17px; font-weight:700; }header p { margin:4px 0 0; font-size:12px; color:#9ca3af; }main { padding:12px; max-width:600px; margin:0 auto; }.gate { padding:40px 20px; text-align:center; }.gate input { font-size:20px; text-align:center; letter-spacing:4px; padding:12px; width:180px; border:2px solid #d1d5db; border-radius:10px; margin:16px 0; }.gate button, .btn-accion, .btn-form { font-size:15px; font-weight:600; border:none; border-radius:10px; padding:13px 16px; cursor:pointer; }.gate button { background:#d91b1b; color:#fff; padding:13px 32px; }.gate .err { color:#dc2626; font-size:13px; min-height:18px; }details.grupo { background:#fff; border-radius:12px; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }details.grupo summary { padding:13px 16px; font-weight:700; font-size:14px; list-style:none; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }details.grupo summary::-webkit-details-marker { display:none; }details.grupo summary::after { content:"›"; font-size:20px; transform:rotate(90deg); transition:transform .15s; color:#9ca3af; }details.grupo[open] summary::after { transform:rotate(-90deg); }.lista-botones { padding:4px 10px 12px; display:flex; flex-direction:column; gap:8px; }.btn-accion { width:100%; text-align:left; background:#f8fafc; border:1px solid #e5e7eb; color:#1a1a1a; display:flex; justify-content:space-between; align-items:center; }.btn-accion:active { background:#eef2f7; }.btn-accion:disabled { opacity:.5; }.spinner { display:none; width:16px; height:16px; border:2px solid #d1d5db; border-top-color:#d91b1b; border-radius:50%; animation:girar .7s linear infinite; }.btn-accion.cargando .spinner { display:inline-block; }@keyframes girar { to { transform:rotate(360deg); } }.seccion-titulo { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#6b7280; margin:18px 4px 8px; }.caja { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }.caja input, .caja select { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; margin-bottom:8px; background:#fff; }.caja label { font-size:11px; font-weight:600; color:#374151; display:block; margin-bottom:3px; }.fila2 { display:flex; gap:8px; } .fila2 > div { flex:1; }.btn-form { background:#1a1a1a; color:#fff; width:100%; margin-top:4px; }.btn-form.secundario { background:#e5e7eb; color:#1a1a1a; }.herramienta-rapida { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }.herramienta-rapida button { flex:1 1 45%; background:#f8fafc; border:1px solid #e5e7eb; border-radius:8px; padding:10px 6px; font-size:12px; font-weight:600; }#log { margin-top:20px; }.log-item { background:#fff; border-left:4px solid #9ca3af; border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; box-shadow:0 1px 3px rgba(0,0,0,.06); }.log-item.ok { border-left-color:#16a34a; }.log-item.error { border-left-color:#dc2626; }.log-item .hora { font-size:11px; color:#9ca3af; }#formulario-producto { display:none; }.hint { font-size:11px; color:#6b7280; margin:-4px 0 8px; }</style></head><body><header><h1>📦 Panel Orencio Matas</h1><p>Gestión rápida desde el móvil</p></header><main><div id="pantalla-pin" class="gate"><p>Introduce el PIN para continuar</p><input type="password" inputmode="numeric" id="input-pin" autocomplete="off" maxlength="12"><div><label style="font-size:13px;"><input type="checkbox" id="recordar-pin" checked> Recordar en este dispositivo</label></div><p class="err" id="pin-error"></p><button onclick="comprobarPin()">Entrar</button></div><div id="contenido-panel" style="display:none;"><div class="seccion-titulo">Herramientas rápidas por referencia</div><div class="caja"><label>Referencia del producto</label><input type="text" id="ref-rapida" placeholder="Ej: 8410104022" autocomplete="off"><div class="herramienta-rapida"><button onclick="herramientaRapida('validar_imagen')">✅ Validar imagen</button><button onclick="herramientaRapida('marcar_sin_imagen')">🚫 Marcar sin imagen</button><button onclick="herramientaRapida('dar_baja_producto')">⛔ Dar de baja</button><button onclick="herramientaRapida('reactivar_producto')">♻️ Reactivar</button></div></div><div class="seccion-titulo">Añadir / editar producto</div><div class="caja"><label>Referencia</label><input type="text" id="prod-referencia" placeholder="Ej: DRO001" autocomplete="off"><button class="btn-form secundario" onclick="buscarProductoPanel()">🔍 Buscar</button><p class="hint" id="prod-estado"></p></div><div class="caja" id="formulario-producto"><div class="fila2"><div><label>Nombre</label><input id="f-nombre"></div><div><label>Marca</label><input id="f-marca"></div></div><div class="fila2"><div><label>Área</label><select id="f-area"><option value="">--</option><option value="drogueria">Droguería</option><option value="perfumeria">Perfumería</option><option value="pinturas">Pinturas</option><option value="talleres">Talleres</option></select></div><div><label>Tipología</label><input id="f-tipologia"></div></div><div class="fila2"><div><label>Sin IVA (€)</label><input id="f-precio-sin" type="number" step="0.01"></div><div><label>IVA</label><select id="f-iva"><option value="">--</option><option value="4">4%</option><option value="10">10%</option><option value="21">21%</option></select></div></div><div><label>Con IVA (€, se calcula solo)</label><input id="f-precio-con" type="number" step="0.01"></div><div class="fila2"><div><label>Mostrar precio</label><select id="f-mostrar-precio"><option value="no">No</option><option value="si">Sí</option></select></div><div><label>Incluir catálogo</label><select id="f-incluir"><option value="si">Sí</option><option value="no">No</option></select></div></div><div class="fila2"><div><label>Oferta</label><select id="f-oferta"><option value="no">No</option><option value="si">Sí</option></select></div><div><label>Espacios</label><select id="f-espacios"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></div></div><label>Imagen (Drive ID) — vacío = NO_TIENE_FOTO</label><input id="f-imagen" placeholder="Se busca automáticamente si es un producto nuevo"><button class="btn-form" id="btn-guardar-producto" onclick="guardarProductoPanel()">Guardar producto</button></div><div class="seccion-titulo">Acciones del menú</div><div id="grupos-acciones"></div><div id="log"></div></div></main><script>var URL_BASE = "https://script.google.com/macros/s/AKfycbwqJOASK7XTqZ_XH2wt512Es5DlItsjIQn24JYGuuNMcuolzvi5P8L-m0N5Sf0oHzQ7/exec"; /* Mismo Web App que usa buscador.html */var PIN = "";var FILA_EXISTENTE = null;function guardarPinLocal(pin, recordar) {  if (recordar) { try { localStorage.setItem("panelPinOM", pin); } catch(e) {} }}window.onload = function() {  var pinGuardado = null;  try { pinGuardado = localStorage.getItem("panelPinOM"); } catch(e) {}  if (pinGuardado) { PIN = pinGuardado; validarPinYArrancar(); }  document.getElementById("f-precio-sin").addEventListener("input", calcularPrecioPanel);  document.getElementById("f-iva").addEventListener("change", calcularPrecioPanel);};function comprobarPin() {  PIN = document.getElementById("input-pin").value;  var recordar = document.getElementById("recordar-pin").checked;  guardarPinLocal(PIN, recordar);  validarPinYArrancar();}function validarPinYArrancar() {  fetch(URL_BASE, { method:"POST", body: JSON.stringify({ accion:"panel_validar_pin", pin: PIN }) })    .then(function(r){ return r.json(); })    .then(function(d){      if (d.success) {        document.getElementById("pantalla-pin").style.display = "none";        document.getElementById("contenido-panel").style.display = "block";        cargarConfiguracion();      } else {        document.getElementById("pin-error").textContent = "PIN incorrecto.";        try { localStorage.removeItem("panelPinOM"); } catch(e) {}      }    })    .catch(function(){ document.getElementById("pin-error").textContent = "Error de conexión."; });}function cargarConfiguracion() {  fetch(URL_BASE + "?accion=panel_config")    .then(function(r){ return r.json(); })    .then(function(d){ renderizarGrupos(d.funciones || []); });}function renderizarGrupos(funciones) {  var grupos = {};  funciones.forEach(function(f){ (grupos[f.grupo] = grupos[f.grupo] || []).push(f); });  var html = "";  Object.keys(grupos).forEach(function(nombreGrupo, idx){    html += "<details class=\"grupo\"" + (idx === 0 ? " open" : "") + "><summary>" + nombreGrupo + "</summary><div class=\"lista-botones\">";    grupos[nombreGrupo].forEach(function(f){      html += "<button class=\"btn-accion\" id=\"btn-" + f.clave + "\" onclick=\"ejecutarFuncion('" + f.clave + "', " + (f.confirmar ? "true" : "false") + ")\">" +        "<span>" + f.etiqueta + "</span><span class=\"spinner\"></span></button>";    });    html += "</div></details>";  });  document.getElementById("grupos-acciones").innerHTML = html;}function ejecutarFuncion(clave, confirmar) {  if (confirmar && !window.confirm("¿Seguro que quieres ejecutar esta acción? Puede tardar y afectar a muchos productos.")) return;  var payload = { accion:"panel_ejecutar", clave: clave, pin: PIN };  if (clave === "dar_baja_fecha_alta" || clave === "reactivar_fecha_alta") {    var fechaInicio = window.prompt("Fecha de inicio (dd/mm/aaaa):");    var fechaFin = window.prompt("Fecha de fin (dd/mm/aaaa):");    if (!fechaInicio && !fechaFin) { alert("Debes indicar al menos una fecha."); return; }    if (fechaInicio) payload.fechaInicio = fechaInicio.trim();    if (fechaFin) payload.fechaFin = fechaFin.trim();  }  var btn = document.getElementById("btn-" + clave);  btn.disabled = true; btn.classList.add("cargando");  fetch(URL_BASE, { method:"POST", body: JSON.stringify(payload) })    .then(function(r){ return r.json(); })    .then(function(d){ registrarLog(clave, d); })    .catch(function(){ registrarLog(clave, { success:false, error:"Error de conexión" }); })    .finally(function(){ btn.disabled = false; btn.classList.remove("cargando"); });}function resumirResultado(resultado) {  if (!resultado || typeof resultado !== "object") return "Ejecutado correctamente.";  var partes = [];  var etiquetas = { nuevos:"nuevos", actualizados:"actualizados", saltados:"saltados", errores:"errores",    total:"total", totalCambios:"cambios", clasificados:"clasificados", deshabilitados:"deshabilitados",    movidas:"movidas", bajas:"bajas", procesados:"procesados", totalAplicadas:"aplicadas" };  Object.keys(etiquetas).forEach(function(k){ if (resultado[k] !== undefined) partes.push(resultado[k] + " " + etiquetas[k]); });  return partes.length ? partes.join(" · ") : "Ejecutado correctamente.";}function registrarLog(clave, d) {  var log = document.getElementById("log");  var item = document.createElement("div");  var hora = new Date().toLocaleTimeString("es-ES");  if (d.success) {    item.className = "log-item ok";    item.innerHTML = "<div class=\"hora\">" + hora + " · " + clave + "</div>" + resumirResultado(d.resultado);  } else {    item.className = "log-item error";    item.innerHTML = "<div class=\"hora\">" + hora + " · " + clave + "</div>⚠️ " + (d.error || "Error desconocido");  }  log.insertBefore(item, log.firstChild);}function herramientaRapida(accion) {  var ref = document.getElementById("ref-rapida").value.trim();  if (!ref) { alert("Escribe una referencia primero."); return; }  fetch(URL_BASE, { method:"POST", body: JSON.stringify({ accion: accion, referencia: ref, pin: PIN }) })    .then(function(r){ return r.json(); })    .then(function(d){ registrarLog(accion + " (" + ref + ")", d); })    .catch(function(){ registrarLog(accion, { success:false, error:"Error de conexión" }); });}function calcularPrecioPanel() {  var base = parseFloat(document.getElementById("f-precio-sin").value) || 0;  var iva = parseFloat(document.getElementById("f-iva").value) || 0;  if (base > 0 && iva > 0) document.getElementById("f-precio-con").value = (base * (1 + iva/100)).toFixed(2);}function buscarProductoPanel() {  var ref = document.getElementById("prod-referencia").value.trim();  if (!ref) return;  document.getElementById("prod-estado").textContent = "Buscando...";  fetch(URL_BASE, { method:"POST", body: JSON.stringify({ accion:"panel_buscar_producto", referencia: ref, pin: PIN }) })    .then(function(r){ return r.json(); })    .then(function(d){      if (!d.success) { document.getElementById("prod-estado").textContent = "Error: " + d.error; return; }      var producto = d.resultado.producto, imagen = d.resultado.imagen;      document.getElementById("formulario-producto").style.display = "block";      if (producto) {        FILA_EXISTENTE = producto._fila;        document.getElementById("prod-estado").textContent = "✏️ Editando producto existente (fila " + producto._fila + ")";        document.getElementById("f-nombre").value = producto.nombre || "";        document.getElementById("f-marca").value = producto.marca || "";        document.getElementById("f-area").value = producto.area || "";        document.getElementById("f-tipologia").value = producto.tipologia || "";        document.getElementById("f-precio-sin").value = (producto.precio_sin_iva || "").replace(",", ".");        document.getElementById("f-precio-con").value = (producto.precio_con_iva || "").replace(",", ".");        document.getElementById("f-iva").value = producto.iva || "";        document.getElementById("f-mostrar-precio").value = producto.mostrar_precio || "no";        document.getElementById("f-incluir").value = producto.incluir_en_catalogo || "si";        document.getElementById("f-oferta").value = producto.oferta || "no";        document.getElementById("f-espacios").value = producto.espacios_a_ocupar || "1";        document.getElementById("f-imagen").value = producto.imagen_drive_id || "";      } else {        FILA_EXISTENTE = null;        document.getElementById("prod-estado").textContent = imagen.encontrada          ? "🆕 Nuevo producto — imagen encontrada en Drive automáticamente"          : "🆕 Nuevo producto — sin imagen encontrada en Drive";        ["f-nombre","f-marca","f-area","f-tipologia","f-precio-sin","f-precio-con","f-iva"].forEach(function(id){ document.getElementById(id).value = ""; });        document.getElementById("f-mostrar-precio").value = "no";        document.getElementById("f-incluir").value = "si";        document.getElementById("f-oferta").value = "no";        document.getElementById("f-espacios").value = "1";        document.getElementById("f-imagen").value = imagen.encontrada ? imagen.id : "";      }    })    .catch(function(){ document.getElementById("prod-estado").textContent = "Error de conexión."; });}function guardarProductoPanel() {  var ref = document.getElementById("prod-referencia").value.trim();  var nombre = document.getElementById("f-nombre").value.trim();  var marca = document.getElementById("f-marca").value.trim();  var area = document.getElementById("f-area").value;  if (!ref || !nombre || !marca || !area) { alert("Referencia, nombre, marca y área son obligatorios."); return; }  var imgVal = document.getElementById("f-imagen").value.trim() || "NO_TIENE_FOTO";  var datos = {    referencia: ref, nombre: nombre, marca: marca, area: area,    tipologia: document.getElementById("f-tipologia").value.trim(),    precio_sin_iva: document.getElementById("f-precio-sin").value,    iva: document.getElementById("f-iva").value,    precio_con_iva: document.getElementById("f-precio-con").value,    mostrar_precio: document.getElementById("f-mostrar-precio").value,    incluir_en_catalogo: document.getElementById("f-incluir").value,    oferta: document.getElementById("f-oferta").value,    espacios_a_ocupar: document.getElementById("f-espacios").value,    imagen_drive_id: imgVal,  };  var btn = document.getElementById("btn-guardar-producto");  btn.disabled = true; btn.textContent = "Guardando...";  fetch(URL_BASE, { method:"POST", body: JSON.stringify({ accion:"panel_guardar_producto", datosProducto: datos, filaExistente: FILA_EXISTENTE, pin: PIN }) })    .then(function(r){ return r.json(); })    .then(function(d){      registrarLog("guardar_producto (" + ref + ")", d);      if (d.success) { document.getElementById("prod-estado").textContent = "✓ Guardado correctamente."; }    })    .catch(function(){ registrarLog("guardar_producto", { success:false, error:"Error de conexión" }); })    .finally(function(){ btn.disabled = false; btn.textContent = "Guardar producto"; });}</script></body></html>
