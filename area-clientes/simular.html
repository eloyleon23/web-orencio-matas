<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulación de acceso — Área de Clientes · Orencio Matas</title>
<link rel="icon" type="image/x-icon" href="../assets/logos/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logos/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/logos/favicon-16x16.png">
<link rel="stylesheet" href="assets/estilos.css">
<style>body { padding-top: 34px; }</style>
</head>
<body>
<div class="banda-simulacion">
    MODO SIMULACIÓN — solo visualización, no se puede actuar en nombre del cliente
</div>
<nav class="navbar-om">
    <div class="navbar-om__marca">
        <img src="assets/logo-orencio.png" alt="Orencio Matas" class="navbar-om__logo">
        <span class="navbar-om__etiqueta">Simulación</span>
    </div>
    <span class="insignia-rol">cliente</span>
</nav>
<div class="envoltorio-centrado">
<div class="tarjeta tarjeta--ancha">
    <h1 id="titulo">Comprobando el acceso…</h1>
    <p class="ayuda" id="ayuda"></p>

    <button class="boton-secundario" id="botonSalir" style="display:none;">Salir de la simulación</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
(async function () {
    const parametros = new URLSearchParams(window.location.search);
    const tokenHash = parametros.get('token');
    const titulo = document.getElementById('titulo');
    const ayuda = document.getElementById('ayuda');

    if (!tokenHash) {
        titulo.textContent = 'Enlace de simulación no válido.';
        return;
    }

    // Cliente CON almacenamiento propio (ver supabase-client.js) — no
    // toca en ningún momento la sesión de quien está simulando.
    const clienteSim = window.obtenerClienteSupabase_(true);
    const { data, error } = await clienteSim.auth.verifyOtp({ token_hash: tokenHash, type: 'magiclink' });

    if (error || !data.session) {
        titulo.textContent = 'El enlace de simulación ha caducado o ya se usó.';
        ayuda.textContent = 'Pide que te generen uno nuevo desde el listado de clientes.';
        return;
    }

    // Sesión de simulación ya establecida (almacenamiento propio) —
    // de aquí en adelante, lo que ve el cliente de verdad: su
    // catálogo. catalogo.html, con ?simulacion=1, usa esta misma
    // sesión (no vuelve a pedir nada) y pinta su propia banda roja.
    titulo.textContent = 'Entrando…';
    window.location.href = 'catalogo.html?simulacion=1';
})();
</script>
</body>
</html>
