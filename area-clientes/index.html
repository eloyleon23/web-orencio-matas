<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — Área de Clientes · Orencio Matas</title>
<link rel="icon" type="image/x-icon" href="../assets/logos/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logos/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/logos/favicon-16x16.png">
<link rel="stylesheet" href="assets/estilos.css">
</head>
<body>
<div class="login-pagina">
    <div class="login-marca">
        <div class="login-marca__etiqueta">Área de Clientes</div>
        <h1 class="login-marca__titulo">Tu catálogo,<br>tus condiciones,<br>un solo sitio.</h1>
        <p class="login-marca__texto">
            Accede a tu catálogo personalizado, sigue tus pedidos y gestiona
            tu cuenta con Orencio Matas desde cualquier dispositivo.
        </p>
    </div>
    <div class="login-formulario">
    <div class="tarjeta">
        <img src="assets/logo-orencio.png" alt="Orencio Matas" class="navbar-om__logo">
        <h1>Iniciar sesión</h1>
        <p class="ayuda">Accede con el email y la contraseña de tu cuenta.</p>

        <form id="formLogin">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button type="submit" class="boton-principal" id="botonEntrar">Entrar</button>
        </form>

        <div class="aviso aviso--error" id="avisoError"></div>

        <a class="enlace-discreto" href="solicitar-acceso.html">¿No tienes acceso todavía? Solicítalo aquí</a>
    </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
(function () {
    const form = document.getElementById('formLogin');
    const aviso = document.getElementById('avisoError');
    const boton = document.getElementById('botonEntrar');

    function mostrarError_(mensaje) {
        aviso.textContent = mensaje;
        aviso.classList.add('activo');
    }

    // Si ya hay sesión activa, no tiene sentido mostrar el login.
    (async function comprobarSesionExistente_() {
        const cliente = window.obtenerClienteSupabase_();
        const { data } = await cliente.auth.getSession();
        if (data.session) window.location.href = 'app.html';
    })();

    form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        aviso.classList.remove('activo');
        boton.disabled = true;
        boton.innerHTML = '<span class="cargando-spinner"></span>Entrando…';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const cliente = window.obtenerClienteSupabase_();
        const { data, error } = await cliente.auth.signInWithPassword({ email, password });

        if (error) {
            mostrarError_('Email o contraseña incorrectos.');
            boton.disabled = false;
            boton.textContent = 'Entrar';
            return;
        }

        // Baja lógica: si es una cuenta de cliente y está desactivada,
        // fuera inmediatamente — nunca se borra nada, solo se bloquea
        // el acceso.
        const { data: fichaCliente } = await cliente.from('clientes').select('activo').eq('id', data.user.id).maybeSingle();
        if (fichaCliente && fichaCliente.activo === false) {
            await cliente.auth.signOut();
            mostrarError_('Tu acceso está desactivado. Contacta con tu comercial.');
            boton.disabled = false;
            boton.textContent = 'Entrar';
            return;
        }

        // Mismo criterio para comercial/almacén/administrador —
        // profiles.activo (panel de Usuarios, solo administrador).
        const { data: perfilActivo } = await cliente.from('profiles').select('activo').eq('id', data.user.id).maybeSingle();
        if (perfilActivo && perfilActivo.activo === false) {
            await cliente.auth.signOut();
            mostrarError_('Tu acceso está desactivado. Contacta con el administrador.');
            boton.disabled = false;
            boton.textContent = 'Entrar';
            return;
        }

        window.location.href = 'app.html';
    });
})();
</script>
</body>
</html>
