<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos — Panel de gestión · Orencio Matas</title>
<link rel="icon" type="image/x-icon" href="../../assets/logos/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/logos/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/logos/favicon-16x16.png">
<link rel="stylesheet" href="../assets/estilos.css">
<style>
    .insignia-estado-pedido {
        font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px;
        text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; display: inline-block;
    }
    .insignia-estado-pedido--recibida { color: var(--blue); background: rgba(25, 118, 210, 0.12); }
    .insignia-estado-pedido--en_preparacion { color: #b7791f; background: rgba(183, 121, 31, 0.14); }
    .insignia-estado-pedido--lista_para_enviar { color: #6b46c1; background: rgba(107, 70, 193, 0.14); }
    .insignia-estado-pedido--en_reparto { color: #0f766e; background: rgba(15, 118, 110, 0.14); }
    .insignia-estado-pedido--entregada { color: var(--ok); background: var(--ok-soft); }

    .modal-pedido-gestion-overlay {
        display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
        align-items: center; justify-content: center; z-index: 200; padding: 16px;
    }
    .modal-pedido-gestion-overlay.activo { display: flex; }
    .modal-pedido-gestion {
        background: var(--white); border-radius: var(--radius); max-width: 920px; width: 100%;
        max-height: 90vh; overflow-y: auto; padding: 26px 30px; box-shadow: var(--sombra);
    }
    .modal-pedido-gestion__cabecera { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
    .modal-pedido-gestion__cliente { font-weight: 700; font-size: 1.15rem; }
    .modal-pedido-gestion__meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; }
    .modal-pedido-gestion__meta span { margin-right: 14px; display: inline-block; }
    .modal-pedido-gestion__notas-generales {
        font-size: 0.85rem; color: var(--dark); background: var(--light); border-radius: 8px;
        padding: 8px 10px; margin-bottom: 14px;
    }
    .linea-gestion {
        border-bottom: 1px dashed var(--border); padding: 10px 0; font-size: 0.88rem;
    }
    .linea-gestion:last-child { border-bottom: none; }
    .linea-gestion__fila { display: flex; justify-content: space-between; gap: 10px; }
    .linea-gestion__notas { font-size: 0.78rem; color: var(--blue); margin-top: 2px; }
    .linea-gestion__diff { font-size: 0.78rem; color: var(--danger); margin-top: 2px; font-weight: 600; }
    .linea-gestion__rectificar {
        display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap;
    }
    .linea-gestion__rectificar input[type="number"] { width: 90px; margin: 0; }
    .linea-gestion__rectificar input[type="text"] { flex: 1; min-width: 160px; margin: 0; }
    .modal-pedido-gestion__resumen {
        display: flex; justify-content: space-between; font-weight: 700; margin-top: 10px; padding-top: 10px;
        border-top: 1px solid var(--border);
    }
    .modal-pedido-gestion__acciones { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .modal-pedido-gestion__acciones button, .modal-pedido-gestion__acciones a {
        width: auto; padding: 10px 18px; font-size: 0.88rem; min-height: 38px;
        box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;
        text-decoration: none; margin: 0;
    }
    .modal-pedido-gestion__cerrar { position: sticky; top: 0; }
    .modal-pedido-gestion__aviso-ayuda {
        font-size: 0.82rem; color: var(--muted); background: var(--light); border-radius: 8px;
        padding: 8px 10px; margin-top: 10px;
    }
    .filtro-cliente-chip {
        display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem;
        background: rgba(25, 118, 210, 0.1); color: var(--blue); border-radius: 999px;
        padding: 5px 12px; margin-bottom: 10px;
    }
    .filtro-cliente-chip button { width: auto; margin: 0; padding: 0 4px; background: none; border: none; color: inherit; font-weight: 700; cursor: pointer; }

    .bloque-seguimiento {
        margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .bloque-seguimiento__titulo { font-weight: 700; font-size: 0.88rem; margin-bottom: 8px; }
    .bloque-seguimiento__fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
    .bloque-seguimiento__campo { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
    .bloque-seguimiento__campo label { font-size: 0.76rem; color: var(--muted); }
    .bloque-seguimiento__campo input, .bloque-seguimiento__campo select { margin: 0; }
    .bloque-seguimiento__solo-lectura { font-size: 0.85rem; }
    .bloque-seguimiento__solo-lectura strong { font-weight: 700; }

    .modal-pedido-gestion { position: relative; }
    .modal-pedido-gestion__cerrar-x {
        position: sticky; top: 0; float: right; margin: -10px -14px 0 10px;
        width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--light);
        color: var(--muted); font-size: 1.1rem; cursor: pointer; z-index: 1;
    }
    .modal-pedido-gestion__cerrar-x:hover { background: var(--danger-soft); color: var(--danger); }

    .linea-gestion__acciones-gestion { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .linea-gestion__acciones-gestion button { width: auto; margin: 0; padding: 5px 10px; font-size: 0.76rem; }
    .linea-gestion__sustituir-contenedor { margin-top: 8px; }

    .buscador-producto { position: relative; }
    .buscador-producto__input { margin: 0; }
    .buscador-producto__resultados {
        position: relative; max-height: 220px; overflow-y: auto; border: 1px solid var(--border);
        border-radius: 8px; margin-top: 4px; background: var(--white);
    }
    .buscador-producto__resultados:empty { display: none; border: none; margin: 0; }
    .buscador-producto__item { padding: 7px 10px; font-size: 0.82rem; cursor: pointer; border-bottom: 1px solid var(--border); }
    .buscador-producto__item:last-child { border-bottom: none; }
    .buscador-producto__item:hover { background: var(--light); }
    .buscador-producto__vacio { padding: 8px 10px; font-size: 0.8rem; color: var(--muted); }

    .bloque-anadir-producto {
        margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    }
    .bloque-anadir-producto__titulo { font-weight: 700; font-size: 0.88rem; margin-bottom: 8px; }
    .bloque-anadir-producto__seleccionado {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.85rem;
        background: var(--light); border-radius: 8px; padding: 8px 10px; margin-top: 8px;
    }
    .bloque-anadir-producto__seleccionado input[type="number"] { width: 90px; margin: 0; }
    .bloque-anadir-producto__seleccionado button { width: auto; margin: 0; }
</style>
</head>
<body>
<nav class="navbar-om">
    <div class="navbar-om__marca">
        <img src="../assets/logo-orencio.png" alt="Orencio Matas" class="navbar-om__logo">
        <span class="navbar-om__etiqueta">Panel de gestión</span>
    </div>
    <div class="navbar-om__usuario">
        <span class="insignia-rol" id="insigniaRol">…</span>
        <button class="boton-secundario" id="botonSalir" style="width:auto; margin:0; padding:8px 14px;">Cerrar sesión</button>
    </div>
</nav>
<div class="layout-panel">
    <aside class="panel-lateral" id="panelLateral">
        <div class="panel-lateral__titulo">Gestión</div>
        <a href="clientes.html" id="enlaceClientes">Clientes</a>
        <a href="alta-cliente.html" id="enlaceAlta">Dar de alta</a>
        <a href="importar-clientes.html" id="enlaceImportar">Importar (CSV/XLSX)</a>
        <a href="pedidos.html" class="activo">Pedidos</a>
        <a href="estadisticas.html">Estadísticas</a>
    </aside>
    <main class="panel-contenido">
        <div class="panel-tarjeta">
            <h1>Pedidos</h1>
            <p class="ayuda" id="ayuda">Cargando…</p>
            <div id="chipFiltroCliente" style="display:none;"></div>

            <div id="bloqueTabla" style="display:none;">
                <div class="tabla-herramientas">
                    <input type="search" id="filtroPedidos" placeholder="Buscar por cliente, empresa, referencia…" autocomplete="off">
                    <select id="filtroEstado" style="width:auto;">
                        <option value="">Todos los estados</option>
                        <option value="recibida">Recibida</option>
                        <option value="en_preparacion">En preparación</option>
                        <option value="lista_para_enviar">Lista para enviar</option>
                        <option value="en_reparto">En reparto</option>
                        <option value="entregada">Entregada</option>
                    </select>
                </div>

                <div id="tablaPedidos" class="tabla-scroll tabla-adaptativa">
                <table>
                    <thead><tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Comercial</th>
                        <th>Enviado</th>
                        <th>Días</th>
                        <th>Productos</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Albarán</th>
                        <th>Factura</th>
                        <th>Equipo (por fase)</th>
                        <th>Última edición</th>
                        <th></th>
                    </tr></thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
                </div>
            </div>

            <div class="aviso aviso--error" id="avisoError"></div>
        </div>
    </main>
</div>

<div class="modal-pedido-gestion-overlay" id="modalOverlay">
    <div class="modal-pedido-gestion" id="modalContenido"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="../assets/supabase-client.js"></script>
<script src="../assets/pedido-pdf.js"></script>
<script>
(async function () {
    const resultado = await window.exigirRolAreaClientes_(
        ['comercial', 'almacen', 'oficina'], '../index.html', '../app.html'
    );
    if (!resultado) return;
    const rol = resultado.perfil.rol;
    document.getElementById('insigniaRol').textContent = rol;

    // Almacén no gestiona clientes/altas — solo pedidos.
    if (rol === 'almacen') {
        ['enlaceClientes', 'enlaceAlta', 'enlaceImportar'].forEach(function (id) {
            document.getElementById(id).remove();
        });
    }

    const cliente = window.obtenerClienteSupabase_();
    const ayuda = document.getElementById('ayuda');
    const avisoError = document.getElementById('avisoError');

    document.getElementById('botonSalir').addEventListener('click', async function () {
        await cliente.auth.signOut();
        window.location.href = '../index.html';
    });

    const ESTADOS_LABEL_ = {
        recibida: 'Recibida', en_preparacion: 'En preparación', lista_para_enviar: 'Lista para enviar',
        en_reparto: 'En reparto', entregada: 'Entregada',
    };
    // Qué transición puede hacer cada rol desde cada estado — refleja
    // exactamente transicion_pedido_permitida_() en
    // supabase/area_clientes_schema_fase5.sql. Esto solo es para
    // decidir qué botón mostrar; quien de verdad lo impone siempre es
    // el trigger en la base de datos (si este mapa y el de la BBDD
    // alguna vez se desincronizan, manda la BBDD y el usuario vería un
    // error al intentar la transición, nunca un cambio sin permiso).
    const TRANSICION_POR_ROL_ = {
        comercial: { recibida: 'en_preparacion' },
        almacen: { en_preparacion: 'lista_para_enviar' },
        oficina: { lista_para_enviar: 'en_reparto', en_reparto: 'entregada' },
    };

    function formatearEuros_(n) { return n.toFixed(2).replace('.', ',') + ' €'; }
    function formatearFecha_(valor) {
        if (!valor) return '—';
        const f = new Date(valor);
        return f.toLocaleDateString('es-ES') + ' ' + f.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }
    function escapar_(s) { return String(s || '').replace(/</g, '&lt;'); }

    // ── Buscador de producto (para sustituir o añadir productos a un
    // pedido) — catálogo estático, el mismo que usa catalogo.html como
    // reserva sin personalizar; de sobra para esta herramienta interna.
    let catalogoProductosPromesa_ = null;
    function cargarCatalogoProductos_() {
        if (!catalogoProductosPromesa_) {
            catalogoProductosPromesa_ = fetch('../../data/productos.json')
                .then(function (r) { return r.json(); })
                .then(function (data) { return (data && data.productos) || []; })
                .catch(function () { return []; });
        }
        return catalogoProductosPromesa_;
    }
    function parsearPrecio_(s) {
        if (!s) return null;
        const n = Number(String(s).replace(',', '.'));
        return isNaN(n) ? null : n;
    }
    function buscarProductosCatalogo_(productos, texto) {
        const t = texto.trim().toLowerCase();
        if (t.length < 2) return [];
        return productos.filter(function (p) {
            return (p.ref && p.ref.toLowerCase().includes(t)) || (p.nombre && p.nombre.toLowerCase().includes(t));
        }).slice(0, 15);
    }
    // Pinta el buscador dentro de "contenedor" y llama a onSeleccionar_(p)
    // con el producto del catálogo elegido.
    async function pintarBuscadorProducto_(contenedor, onSeleccionar_) {
        const productos = await cargarCatalogoProductos_();
        contenedor.innerHTML =
            '<div class="buscador-producto">' +
                '<input type="text" class="buscador-producto__input" placeholder="Buscar por referencia o nombre…" autocomplete="off">' +
                '<div class="buscador-producto__resultados"></div>' +
            '</div>';
        const input = contenedor.querySelector('.buscador-producto__input');
        const resultadosDiv = contenedor.querySelector('.buscador-producto__resultados');
        input.focus();
        let temporizador = null;
        input.addEventListener('input', function () {
            clearTimeout(temporizador);
            temporizador = setTimeout(function () {
                const coincidencias = buscarProductosCatalogo_(productos, input.value);
                resultadosDiv.innerHTML = coincidencias.map(function (p, i) {
                    const precio = parsearPrecio_(p.precio_con);
                    return '<div class="buscador-producto__item" data-indice="' + i + '">' +
                        '<strong>' + escapar_(p.nombre) + '</strong><br>' +
                        '<span style="color:var(--muted);">Ref. ' + escapar_(p.ref) + (precio !== null ? ' — ' + formatearEuros_(precio) : '') + '</span>' +
                    '</div>';
                }).join('') || (input.value.trim().length >= 2 ? '<div class="buscador-producto__vacio">Sin coincidencias.</div>' : '');
                resultadosDiv.querySelectorAll('.buscador-producto__item').forEach(function (item) {
                    item.addEventListener('click', function () { onSeleccionar_(coincidencias[Number(item.dataset.indice)]); });
                });
            }, 150);
        });
    }

    // Filtro opcional por cliente concreto (llegado desde "Ver pedidos"
    // en gestion/clientes.html) — ?cliente=<id>.
    const parametrosUrl = new URLSearchParams(window.location.search);
    const clienteIdFiltro = parametrosUrl.get('cliente');

    const { data: pedidosBrutos, error } = await cliente
        .from('propuestas_pedido')
        .select(
            'id, cliente_id, estado, notas, creado_en, enviado_en, entregado_en, transportista, numero_seguimiento, albaran, factura, ' +
            'clientes(empresa, crm_id, profiles!clientes_id_fkey(nombre, apellidos, email), comercial:profiles!clientes_comercial_id_fkey(nombre, apellidos)), ' +
            'editor:profiles!propuestas_pedido_actualizado_por_fkey(nombre, apellidos), ' +
            'confirmador:profiles!propuestas_pedido_confirmado_por_fkey(nombre, apellidos), ' +
            'preparador:profiles!propuestas_pedido_preparado_por_fkey(nombre, apellidos), ' +
            'cerrador:profiles!propuestas_pedido_cerrado_por_fkey(nombre, apellidos), ' +
            'entregador:profiles!propuestas_pedido_entregado_por_fkey(nombre, apellidos), ' +
            'propuesta_pedido_lineas(id, ref, nombre, cantidad, precio_unitario, modo_compra, cantidad_envases, envase_cantidad, envase_unidad, envase_tipo, notas, cantidad_confirmada, motivo_rectificacion)'
        )
        .neq('estado', 'borrador')
        .order('enviado_en', { ascending: false });

    if (error) {
        ayuda.textContent = '';
        avisoError.textContent = 'No se ha podido cargar el listado: ' + error.message;
        avisoError.classList.add('activo');
        return;
    }

    if (!pedidosBrutos || pedidosBrutos.length === 0) {
        ayuda.textContent = 'Todavía no hay ningún pedido recibido.';
        return;
    }

    function desenvolver_(x) { return Array.isArray(x) ? x[0] : x; }

    // Días entre el envío y hoy (pedido todavía en curso) o entre el
    // envío y la entrega (pedido ya cerrado) — para ver de un vistazo
    // qué pedidos llevan demasiado tiempo sin moverse.
    function diasEntre_(desde, hasta) {
        if (!desde) return null;
        const msPorDia = 24 * 60 * 60 * 1000;
        return Math.max(0, Math.round((new Date(hasta).getTime() - new Date(desde).getTime()) / msPorDia));
    }

    function recomputarTotal_(p) {
        p.totalImporte = p.lineas.reduce(function (acc, l) {
            return acc + (l.precio_unitario !== null ? Number(l.cantidad) * Number(l.precio_unitario) : 0);
        }, 0);
    }
    function marcarEditadoPorMi_(p) {
        p.editorNombre = resultado.perfil.nombre ? [resultado.perfil.nombre, resultado.perfil.apellidos].filter(Boolean).join(' ') : p.editorNombre;
    }

    const pedidos_ = pedidosBrutos.map(function (p) {
        const clienteInfo = desenvolver_(p.clientes) || {};
        const perfilCliente = desenvolver_(clienteInfo.profiles) || {};
        const perfilComercial = desenvolver_(clienteInfo.comercial) || {};
        const perfilEditor = desenvolver_(p.editor) || {};
        const perfilConfirmador = desenvolver_(p.confirmador) || {};
        const perfilPreparador = desenvolver_(p.preparador) || {};
        const perfilCerrador = desenvolver_(p.cerrador) || {};
        const perfilEntregador = desenvolver_(p.entregador) || {};
        const lineas = p.propuesta_pedido_lineas || [];
        const totalImporte = lineas.reduce(function (acc, l) {
            return acc + (l.precio_unitario !== null ? Number(l.cantidad) * Number(l.precio_unitario) : 0);
        }, 0);
        const fechaInicio = p.enviado_en || p.creado_en;
        return {
            id: p.id, clienteId: p.cliente_id, estado: p.estado, notas: p.notas, creado_en: p.creado_en,
            enviado_en: p.enviado_en, entregado_en: p.entregado_en,
            transportista: p.transportista || 'Reparto propio', numero_seguimiento: p.numero_seguimiento || '',
            albaran: p.albaran || '', factura: p.factura || '',
            lineas: lineas, totalImporte: totalImporte,
            clienteNombre: [perfilCliente.nombre, perfilCliente.apellidos].filter(Boolean).join(' ') || '(sin nombre)',
            clienteEmail: perfilCliente.email || '',
            clienteEmpresa: clienteInfo.empresa || '',
            clienteCrm: clienteInfo.crm_id || '',
            comercialNombre: [perfilComercial.nombre, perfilComercial.apellidos].filter(Boolean).join(' ') || '—',
            editorNombre: [perfilEditor.nombre, perfilEditor.apellidos].filter(Boolean).join(' ') || '—',
            confirmadoPorNombre: [perfilConfirmador.nombre, perfilConfirmador.apellidos].filter(Boolean).join(' ') || '—',
            preparadoPorNombre: [perfilPreparador.nombre, perfilPreparador.apellidos].filter(Boolean).join(' ') || '—',
            cerradoPorNombre: [perfilCerrador.nombre, perfilCerrador.apellidos].filter(Boolean).join(' ') || '—',
            entregadoPorNombre: [perfilEntregador.nombre, perfilEntregador.apellidos].filter(Boolean).join(' ') || '—',
            dias: diasEntre_(fechaInicio, p.entregado_en || new Date()),
            textoBusqueda: [perfilCliente.nombre, perfilCliente.apellidos, perfilCliente.email, clienteInfo.empresa, perfilComercial.nombre, perfilComercial.apellidos]
                .concat(lineas.map(function (l) { return l.ref + ' ' + l.nombre; }))
                .join(' ').toLowerCase(),
        };
    });

    let filtroTexto_ = '';
    let filtroEstado_ = '';
    let filtroClienteId_ = clienteIdFiltro || '';
    const cuerpo = document.getElementById('cuerpoTabla');
    const filtroInput = document.getElementById('filtroPedidos');
    const estadoSelect = document.getElementById('filtroEstado');
    const chipFiltroCliente = document.getElementById('chipFiltroCliente');

    function pintarChipCliente_() {
        if (!filtroClienteId_) { chipFiltroCliente.style.display = 'none'; return; }
        const algunPedido = pedidos_.find(function (p) { return p.clienteId === filtroClienteId_; });
        const nombre = algunPedido ? (algunPedido.clienteEmpresa || algunPedido.clienteNombre) : 'este cliente';
        chipFiltroCliente.style.display = 'block';
        chipFiltroCliente.innerHTML =
            '<span class="filtro-cliente-chip">Mostrando solo pedidos de: <strong>' + escapar_(nombre) + '</strong>' +
            '<button type="button" id="botonQuitarFiltroCliente" title="Quitar filtro">✕</button></span>';
        document.getElementById('botonQuitarFiltroCliente').addEventListener('click', function () {
            filtroClienteId_ = '';
            history.replaceState(null, '', 'pedidos.html');
            pintarChipCliente_();
            repintar_();
        });
    }

    function listaFiltrada_() {
        return pedidos_.filter(function (p) {
            if (filtroClienteId_ && p.clienteId !== filtroClienteId_) return false;
            if (filtroEstado_ && p.estado !== filtroEstado_) return false;
            if (filtroTexto_ && !p.textoBusqueda.includes(filtroTexto_)) return false;
            return true;
        });
    }

    function textoDias_(p) {
        if (p.dias === null) return '—';
        return p.estado === 'entregada' ? p.dias + ' d. (entregado)' : p.dias + ' d. en curso';
    }

    function pintarFila_(p) {
        const fila = document.createElement('tr');
        fila.innerHTML =
            '<td title="' + p.id + '" style="font-family:monospace; font-size:0.78rem;">' + p.id.slice(0, 8) + '</td>' +
            '<td>' + escapar_(p.clienteNombre) + (p.clienteEmpresa ? ' <span style="color:var(--muted);">(' + escapar_(p.clienteEmpresa) + ')</span>' : '') + '</td>' +
            '<td>' + escapar_(p.comercialNombre) + '</td>' +
            '<td>' + formatearFecha_(p.enviado_en || p.creado_en) + '</td>' +
            '<td>' + textoDias_(p) + '</td>' +
            '<td>' + p.lineas.length + '</td>' +
            '<td>' + formatearEuros_(p.totalImporte) + '</td>' +
            '<td><span class="insignia-estado-pedido insignia-estado-pedido--' + p.estado + '">' + ESTADOS_LABEL_[p.estado] + '</span></td>' +
            '<td>' + (p.albaran ? escapar_(p.albaran) : '—') + '</td>' +
            '<td>' + (p.factura ? escapar_(p.factura) : '—') + '</td>' +
            '<td style="font-size:0.78rem; line-height:1.5;">' +
                'Confirmado: ' + escapar_(p.confirmadoPorNombre) + '<br>' +
                'Preparado: ' + escapar_(p.preparadoPorNombre) + '<br>' +
                'Cerrado: ' + escapar_(p.cerradoPorNombre) + '<br>' +
                'Entregado: ' + escapar_(p.entregadoPorNombre) +
            '</td>' +
            '<td>' + escapar_(p.editorNombre) + '</td>' +
            '<td><button type="button" class="boton-fila" data-id="' + p.id + '">Ver detalle</button></td>';
        fila.querySelector('button').addEventListener('click', function () { abrirModal_(p.id); });
        return fila;
    }

    function repintar_() {
        const filtrada = listaFiltrada_();
        cuerpo.innerHTML = '';
        filtrada.forEach(function (p) { cuerpo.appendChild(pintarFila_(p)); });
        ayuda.textContent = filtrada.length + ' pedido(s)' + (filtrada.length !== pedidos_.length ? ' (de ' + pedidos_.length + ' en total)' : '') + '.';
    }

    document.getElementById('bloqueTabla').style.display = 'block';
    pintarChipCliente_();
    repintar_();

    let temporizadorFiltro_ = null;
    filtroInput.addEventListener('input', function () {
        clearTimeout(temporizadorFiltro_);
        temporizadorFiltro_ = setTimeout(function () {
            filtroTexto_ = filtroInput.value.trim().toLowerCase();
            repintar_();
        }, 150);
    });
    estadoSelect.addEventListener('change', function () {
        filtroEstado_ = estadoSelect.value;
        repintar_();
    });

    // ── Modal de detalle / gestión ──────────────────────────────────
    const overlay = document.getElementById('modalOverlay');
    const contenido = document.getElementById('modalContenido');

    overlay.addEventListener('click', function (ev) { if (ev.target === overlay) cerrarModal_(); });
    function cerrarModal_() { overlay.classList.remove('activo'); }

    function textoCantidad_(l) {
        if (window.textoCantidadLinea_) return window.textoCantidadLinea_(l);
        return l.cantidad + ' ud.';
    }

    function abrirModal_(idPedido) {
        const p = pedidos_.find(function (x) { return x.id === idPedido; });
        if (!p) return;
        pintarModal_(p);
        overlay.classList.add('activo');
    }

    const ESTADOS_CON_SEGUIMIENTO_ = ['lista_para_enviar', 'en_reparto', 'entregada'];

    const ESTADOS_EDITABLES_LINEAS_ = ['recibida', 'en_preparacion'];

    function pintarModal_(p) {
        const puedeRectificar = rol === 'almacen' && p.estado === 'en_preparacion';
        const siguienteEstado = (TRANSICION_POR_ROL_[rol] || {})[p.estado];
        const mostrarSeguimiento = ESTADOS_CON_SEGUIMIENTO_.includes(p.estado);
        const puedeEditarSeguimiento = mostrarSeguimiento && rol === 'oficina';
        // Comercial/almacén/oficina pueden sustituir, quitar o
        // añadir productos mientras el pedido todavía se pueda tocar
        // (recibida o en preparación) — por si lo que pidió el cliente
        // ya no hay, o hace falta añadir algo a mano. Ver
        // supabase/area_clientes_schema_fase5e_editar_lineas.sql.
        const puedeEditarLineas = ESTADOS_EDITABLES_LINEAS_.includes(p.estado);

        const lineasHtml = p.lineas.map(function (l) {
            const haySubtotal = l.precio_unitario !== null && l.precio_unitario !== undefined;
            const subtotal = haySubtotal ? Number(l.precio_unitario) * Number(l.cantidad) : null;
            const rectificada = l.cantidad_confirmada !== null && l.cantidad_confirmada !== undefined && Number(l.cantidad_confirmada) !== Number(l.cantidad);
            return (
                '<div class="linea-gestion" data-linea-id="' + l.id + '">' +
                    '<div class="linea-gestion__fila">' +
                        '<span>' + textoCantidad_(l) + ' × ' + escapar_(l.nombre) + ' <span style="color:var(--muted);">(Ref. ' + escapar_(l.ref) + ')</span></span>' +
                        '<span>' + (subtotal !== null ? formatearEuros_(subtotal) : '—') + '</span>' +
                    '</div>' +
                    (l.notas ? '<div class="linea-gestion__notas">↳ nota del cliente: ' + escapar_(l.notas) + '</div>' : '') +
                    (rectificada ? '<div class="linea-gestion__diff">⚠ Se rectificó a ' + l.cantidad_confirmada + ' (pedido: ' + l.cantidad + ')' + (l.motivo_rectificacion ? ' — ' + escapar_(l.motivo_rectificacion) : '') + '</div>' : '') +
                    (puedeRectificar
                        ? '<div class="linea-gestion__rectificar">' +
                            '<label style="margin:0; font-size:0.78rem; color:var(--muted);">Cantidad a servir</label>' +
                            '<input type="number" min="0" step="any" class="input-cantidad-confirmada" value="' + (l.cantidad_confirmada !== null && l.cantidad_confirmada !== undefined ? l.cantidad_confirmada : l.cantidad) + '">' +
                            '<input type="text" class="input-motivo-rectificacion" placeholder="Motivo si se reduce (p. ej. sin stock)" value="' + escapar_(l.motivo_rectificacion || '') + '">' +
                          '</div>'
                        : '') +
                    (puedeEditarLineas
                        ? '<div class="linea-gestion__acciones-gestion">' +
                            '<button type="button" class="boton-fila boton-sustituir-linea" data-linea-id="' + l.id + '">Sustituir producto</button>' +
                            '<button type="button" class="boton-fila boton-peligro boton-quitar-linea" data-linea-id="' + l.id + '">Quitar del pedido</button>' +
                          '</div>' +
                          '<div class="linea-gestion__sustituir-contenedor" data-linea-id="' + l.id + '" style="display:none;"></div>'
                        : '') +
                '</div>'
            );
        }).join('');

        const anadirProductoHtml = !puedeEditarLineas ? '' : (
            '<div class="bloque-anadir-producto">' +
                '<div class="bloque-anadir-producto__titulo">Añadir producto al pedido</div>' +
                '<div id="contenedorAnadirProducto"></div>' +
            '</div>'
        );

        const puedeRectificarRol = rol === 'almacen';
        const avisoAyudaHtml = (!puedeRectificar && puedeRectificarRol && p.estado === 'recibida')
            ? '<div class="modal-pedido-gestion__aviso-ayuda">Para poder rectificar cantidades por falta de stock, primero hay que pasar el pedido a «En preparación».</div>'
            : '';

        let accionesHtml = '';
        if (puedeRectificar) {
            accionesHtml += '<button type="button" class="boton-secundario" id="botonGuardarRectificacion">Guardar rectificación</button>';
        }
        if (puedeEditarSeguimiento) {
            accionesHtml += '<button type="button" class="boton-secundario" id="botonGuardarSeguimiento">Guardar seguimiento</button>';
        }
        accionesHtml += '<button type="button" class="boton-secundario" id="botonDescargarPdf">Descargar PDF</button>';
        if (window.navigator && typeof window.navigator.share === 'function') {
            accionesHtml += '<button type="button" class="boton-secundario" id="botonCompartirPdf">Compartir</button>';
        }
        if (siguienteEstado) {
            accionesHtml += '<button type="button" class="boton-principal" id="botonAvanzarEstado" data-siguiente="' + siguienteEstado + '">Pasar a «' + ESTADOS_LABEL_[siguienteEstado] + '»</button>';
        }

        const seguimientoHtml = !mostrarSeguimiento ? '' : (
            '<div class="bloque-seguimiento">' +
                '<div class="bloque-seguimiento__titulo">Envío</div>' +
                (puedeEditarSeguimiento
                    ? '<div class="bloque-seguimiento__fila">' +
                        '<div class="bloque-seguimiento__campo">' +
                            '<label for="inputTransportista">Transportista</label>' +
                            '<input type="text" id="inputTransportista" value="' + escapar_(p.transportista) + '" placeholder="Reparto propio">' +
                        '</div>' +
                        '<div class="bloque-seguimiento__campo">' +
                            '<label for="inputSeguimiento">Nº de seguimiento (si aplica)</label>' +
                            '<input type="text" id="inputSeguimiento" value="' + escapar_(p.numero_seguimiento) + '" placeholder="Opcional — solo con transporte externo">' +
                        '</div>' +
                      '</div>' +
                      '<div class="bloque-seguimiento__fila">' +
                        '<div class="bloque-seguimiento__campo">' +
                            '<label for="inputAlbaran">Nº de albarán</label>' +
                            '<input type="text" id="inputAlbaran" value="' + escapar_(p.albaran) + '" placeholder="Opcional">' +
                        '</div>' +
                        '<div class="bloque-seguimiento__campo">' +
                            '<label for="inputFactura">Nº de factura</label>' +
                            '<input type="text" id="inputFactura" value="' + escapar_(p.factura) + '" placeholder="Opcional">' +
                        '</div>' +
                      '</div>'
                    : '<div class="bloque-seguimiento__solo-lectura"><strong>' + escapar_(p.transportista) + '</strong>' +
                        (p.numero_seguimiento ? ' — nº seguimiento: ' + escapar_(p.numero_seguimiento) : '') +
                        (p.albaran ? '<br>Albarán: ' + escapar_(p.albaran) : '') +
                        (p.factura ? '<br>Factura: ' + escapar_(p.factura) : '') +
                      '</div>')
            + '</div>'
        );

        contenido.innerHTML =
            '<button type="button" class="modal-pedido-gestion__cerrar-x" id="botonCerrarModalX" aria-label="Cerrar">✕</button>' +
            '<div class="modal-pedido-gestion__cabecera">' +
                '<div>' +
                    '<div class="modal-pedido-gestion__cliente">' + escapar_(p.clienteNombre) + (p.clienteEmpresa ? ' — ' + escapar_(p.clienteEmpresa) : '') + '</div>' +
                    '<div class="modal-pedido-gestion__meta">' +
                        '<span>Pedido ' + p.id.slice(0, 8) + '</span>' +
                        '<span>' + escapar_(p.clienteEmail) + '</span>' +
                        (p.clienteCrm ? '<span>CRM: ' + escapar_(p.clienteCrm) + '</span>' : '') +
                        '<span>Comercial: ' + escapar_(p.comercialNombre) + '</span>' +
                    '</div>' +
                    '<div class="modal-pedido-gestion__meta">' +
                        '<span>Enviado el ' + formatearFecha_(p.enviado_en || p.creado_en) + '</span>' +
                        '<span>' + textoDias_(p) + '</span>' +
                        '<span>Última edición: ' + escapar_(p.editorNombre) + '</span>' +
                    '</div>' +
                '</div>' +
                '<span class="insignia-estado-pedido insignia-estado-pedido--' + p.estado + '">' + ESTADOS_LABEL_[p.estado] + '</span>' +
            '</div>' +
            (p.notas ? '<div class="modal-pedido-gestion__notas-generales"><strong>Instrucciones generales:</strong> ' + escapar_(p.notas) + '</div>' : '') +
            lineasHtml +
            anadirProductoHtml +
            '<div class="modal-pedido-gestion__resumen"><span>Total</span><span>' + formatearEuros_(p.totalImporte) + '</span></div>' +
            seguimientoHtml +
            avisoAyudaHtml +
            '<div class="aviso aviso--error" id="modalAvisoError"></div>' +
            '<div class="aviso aviso--ok" id="modalAvisoOk"></div>' +
            '<div class="modal-pedido-gestion__acciones">' +
                accionesHtml +
            '</div>';

        document.getElementById('botonCerrarModalX').addEventListener('click', cerrarModal_);

        const modalAvisoError = document.getElementById('modalAvisoError');
        const modalAvisoOk = document.getElementById('modalAvisoOk');

        if (puedeEditarLineas) {
            contenido.querySelectorAll('.boton-sustituir-linea').forEach(function (boton) {
                boton.addEventListener('click', function () {
                    const lineaId = boton.dataset.lineaId;
                    const contenedor = contenido.querySelector('.linea-gestion__sustituir-contenedor[data-linea-id="' + lineaId + '"]');
                    const yaAbierto = contenedor.style.display !== 'none';
                    // Solo un buscador abierto a la vez, para no liar la
                    // modal con varios desplegados.
                    contenido.querySelectorAll('.linea-gestion__sustituir-contenedor').forEach(function (c) { c.style.display = 'none'; c.innerHTML = ''; });
                    if (yaAbierto) return;
                    contenedor.style.display = 'block';
                    pintarBuscadorProducto_(contenedor, async function (nuevoProducto) {
                        const lineaActual = p.lineas.find(function (l) { return l.id === lineaId; });
                        if (!lineaActual) return;
                        const precioNuevo = parsearPrecio_(nuevoProducto.precio_con);
                        const confirmado1 = await window.confirmarModal_(
                            'Sustituir producto',
                            'Vas a sustituir "' + lineaActual.nombre + '" (Ref. ' + lineaActual.ref + ') por "' + nuevoProducto.nombre + '" (Ref. ' + nuevoProducto.ref + '). Se mantiene la cantidad pedida (' + lineaActual.cantidad + ').',
                            'Continuar',
                            false
                        );
                        if (!confirmado1) return;
                        const confirmado2 = await window.confirmarModal_(
                            'Confirma la sustitución',
                            'Esta acción no se puede deshacer. ¿Confirmas definitivamente el cambio de producto?',
                            'Sustituir definitivamente',
                            true
                        );
                        if (!confirmado2) return;

                        const { error: errorSustituir } = await cliente
                            .from('propuesta_pedido_lineas')
                            .update({
                                ref: nuevoProducto.ref, nombre: nuevoProducto.nombre, precio_unitario: precioNuevo,
                                modo_compra: 'unidad', cantidad_envases: null, envase_cantidad: null, envase_unidad: null, envase_tipo: null,
                                cantidad_confirmada: null, motivo_rectificacion: null,
                            })
                            .eq('id', lineaId);
                        if (errorSustituir) {
                            modalAvisoError.textContent = 'No se ha podido sustituir el producto: ' + errorSustituir.message;
                            modalAvisoError.classList.add('activo');
                            return;
                        }
                        Object.assign(lineaActual, {
                            ref: nuevoProducto.ref, nombre: nuevoProducto.nombre, precio_unitario: precioNuevo,
                            modo_compra: 'unidad', cantidad_envases: null, envase_cantidad: null, envase_unidad: null, envase_tipo: null,
                            cantidad_confirmada: null, motivo_rectificacion: null,
                        });
                        recomputarTotal_(p);
                        marcarEditadoPorMi_(p);
                        modalAvisoOk.textContent = 'Producto sustituido.';
                        modalAvisoOk.classList.add('activo');
                        repintar_();
                        pintarModal_(p);
                    });
                });
            });

            contenido.querySelectorAll('.boton-quitar-linea').forEach(function (boton) {
                boton.addEventListener('click', async function () {
                    const lineaId = boton.dataset.lineaId;
                    const lineaActual = p.lineas.find(function (l) { return l.id === lineaId; });
                    if (!lineaActual) return;
                    const confirmado1 = await window.confirmarModal_(
                        'Quitar producto del pedido',
                        '¿Seguro que quieres quitar "' + lineaActual.nombre + '" (Ref. ' + lineaActual.ref + ') de este pedido?',
                        'Quitar',
                        true
                    );
                    if (!confirmado1) return;
                    const confirmado2 = await window.confirmarModal_(
                        'Confirma que quieres quitarlo',
                        'Esta acción no se puede deshacer. ¿Confirmas definitivamente que se quita del pedido?',
                        'Quitar definitivamente',
                        true
                    );
                    if (!confirmado2) return;

                    boton.disabled = true;
                    const { error: errorQuitar } = await cliente.from('propuesta_pedido_lineas').delete().eq('id', lineaId);
                    if (errorQuitar) {
                        boton.disabled = false;
                        modalAvisoError.textContent = 'No se ha podido quitar el producto: ' + errorQuitar.message;
                        modalAvisoError.classList.add('activo');
                        return;
                    }
                    p.lineas = p.lineas.filter(function (l) { return l.id !== lineaId; });
                    recomputarTotal_(p);
                    marcarEditadoPorMi_(p);
                    modalAvisoOk.textContent = 'Producto quitado del pedido.';
                    modalAvisoOk.classList.add('activo');
                    repintar_();
                    pintarModal_(p);
                });
            });

            const contenedorAnadir = document.getElementById('contenedorAnadirProducto');
            pintarBuscadorProducto_(contenedorAnadir, function (productoElegido) {
                const precioElegido = parsearPrecio_(productoElegido.precio_con);
                const bloqueSeleccionado = document.createElement('div');
                bloqueSeleccionado.className = 'bloque-anadir-producto__seleccionado';
                bloqueSeleccionado.innerHTML =
                    '<span><strong>' + escapar_(productoElegido.nombre) + '</strong> (Ref. ' + escapar_(productoElegido.ref) + ')</span>' +
                    '<label style="margin:0; font-size:0.78rem;">Cantidad</label>' +
                    '<input type="number" min="1" step="1" value="1" id="inputCantidadNuevoProducto">' +
                    '<button type="button" class="boton-principal" id="botonConfirmarAnadirProducto">Añadir al pedido</button>' +
                    '<button type="button" class="boton-secundario" id="botonCancelarAnadirProducto">Cancelar</button>';
                contenedorAnadir.innerHTML = '';
                contenedorAnadir.appendChild(bloqueSeleccionado);

                document.getElementById('botonCancelarAnadirProducto').addEventListener('click', function () {
                    pintarModal_(p);
                });
                document.getElementById('botonConfirmarAnadirProducto').addEventListener('click', async function () {
                    const boton = this;
                    const cantidad = Math.max(1, parseInt(document.getElementById('inputCantidadNuevoProducto').value, 10) || 1);
                    const confirmado1 = await window.confirmarModal_(
                        'Añadir producto',
                        '¿Añadir ' + cantidad + ' unidad(es) de "' + productoElegido.nombre + '" (Ref. ' + productoElegido.ref + ') a este pedido?',
                        'Continuar',
                        false
                    );
                    if (!confirmado1) return;
                    const confirmado2 = await window.confirmarModal_(
                        'Confirma que quieres añadirlo',
                        'Esta acción no se puede deshacer fácilmente (habría que volver a quitarlo a mano). ¿Confirmas definitivamente?',
                        'Añadir definitivamente',
                        false
                    );
                    if (!confirmado2) return;

                    boton.disabled = true;
                    const { data: insertada, error: errorInsertar } = await cliente
                        .from('propuesta_pedido_lineas')
                        .insert({
                            propuesta_id: p.id, ref: productoElegido.ref, nombre: productoElegido.nombre,
                            precio_unitario: precioElegido, cantidad: cantidad, modo_compra: 'unidad',
                        })
                        .select('id, ref, nombre, cantidad, precio_unitario, modo_compra, cantidad_envases, envase_cantidad, envase_unidad, envase_tipo, notas, cantidad_confirmada, motivo_rectificacion')
                        .single();
                    if (errorInsertar) {
                        boton.disabled = false;
                        modalAvisoError.textContent = 'No se ha podido añadir el producto: ' + errorInsertar.message;
                        modalAvisoError.classList.add('activo');
                        return;
                    }
                    p.lineas.push(insertada);
                    recomputarTotal_(p);
                    marcarEditadoPorMi_(p);
                    modalAvisoOk.textContent = 'Producto añadido al pedido.';
                    modalAvisoOk.classList.add('activo');
                    repintar_();
                    pintarModal_(p);
                });
            });
        }

        document.getElementById('botonDescargarPdf').addEventListener('click', async function () {
            const boton = this;
            boton.disabled = true;
            try {
                const doc = await window.generarPedidoPdf_(p, ESTADOS_LABEL_[p.estado]);
                doc.save('pedido-' + p.id.slice(0, 8) + '.pdf');
            } catch (e) {
                modalAvisoError.textContent = 'No se ha podido generar el PDF: ' + (e && e.message);
                modalAvisoError.classList.add('activo');
            }
            boton.disabled = false;
        });

        const botonCompartir = document.getElementById('botonCompartirPdf');
        if (botonCompartir) {
            botonCompartir.addEventListener('click', async function () {
                const boton = this;
                boton.disabled = true;
                try {
                    const doc = await window.generarPedidoPdf_(p, ESTADOS_LABEL_[p.estado]);
                    const blob = doc.output('blob');
                    const archivo = new File([blob], 'pedido-' + p.id.slice(0, 8) + '.pdf', { type: 'application/pdf' });
                    if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
                        await navigator.share({
                            files: [archivo],
                            title: 'Pedido ' + p.id.slice(0, 8),
                            text: 'Pedido de ' + (p.clienteEmpresa || p.clienteNombre),
                        });
                    } else {
                        doc.save('pedido-' + p.id.slice(0, 8) + '.pdf');
                        modalAvisoOk.textContent = 'Este dispositivo no permite compartir archivos directamente — se ha descargado el PDF para que lo adjuntes a mano.';
                        modalAvisoOk.classList.add('activo');
                    }
                } catch (e) {
                    // El usuario cancelando el diálogo de compartir también
                    // dispara un error ("AbortError") — no es un fallo real.
                    if (e && e.name !== 'AbortError') {
                        modalAvisoError.textContent = 'No se ha podido compartir el PDF: ' + (e && e.message);
                        modalAvisoError.classList.add('activo');
                    }
                }
                boton.disabled = false;
            });
        }

        if (puedeRectificar) {
            document.getElementById('botonGuardarRectificacion').addEventListener('click', async function () {
                const boton = this;
                boton.disabled = true;
                modalAvisoError.classList.remove('activo');
                const filas = contenido.querySelectorAll('.linea-gestion[data-linea-id]');
                let errorGuardado = null;
                for (const fila of filas) {
                    const inputCantidad = fila.querySelector('.input-cantidad-confirmada');
                    if (!inputCantidad) continue;
                    const lineaId = fila.dataset.lineaId;
                    const inputMotivo = fila.querySelector('.input-motivo-rectificacion');
                    const nuevaCantidad = inputCantidad.value === '' ? null : Number(inputCantidad.value);
                    const { error: errorUpd } = await cliente
                        .from('propuesta_pedido_lineas')
                        .update({ cantidad_confirmada: nuevaCantidad, motivo_rectificacion: (inputMotivo.value || '').trim() || null })
                        .eq('id', lineaId);
                    if (errorUpd) { errorGuardado = errorUpd.message; break; }
                    const lineaLocal = p.lineas.find(function (l) { return l.id === lineaId; });
                    if (lineaLocal) {
                        lineaLocal.cantidad_confirmada = nuevaCantidad;
                        lineaLocal.motivo_rectificacion = (inputMotivo.value || '').trim() || null;
                    }
                }
                boton.disabled = false;
                if (errorGuardado) {
                    modalAvisoError.textContent = 'No se ha podido guardar: ' + errorGuardado;
                    modalAvisoError.classList.add('activo');
                    return;
                }
                marcarEditadoPorMi_(p);
                modalAvisoOk.textContent = 'Rectificación guardada.';
                modalAvisoOk.classList.add('activo');
                pintarModal_(p);
            });
        }

        if (puedeEditarSeguimiento) {
            document.getElementById('botonGuardarSeguimiento').addEventListener('click', async function () {
                const boton = this;
                boton.disabled = true;
                modalAvisoError.classList.remove('activo');
                const nuevoTransportista = (document.getElementById('inputTransportista').value || '').trim() || 'Reparto propio';
                const nuevoSeguimiento = (document.getElementById('inputSeguimiento').value || '').trim() || null;
                const nuevoAlbaran = (document.getElementById('inputAlbaran').value || '').trim() || null;
                const nuevaFactura = (document.getElementById('inputFactura').value || '').trim() || null;
                const { error: errorSeguimiento } = await cliente
                    .from('propuestas_pedido')
                    .update({ transportista: nuevoTransportista, numero_seguimiento: nuevoSeguimiento, albaran: nuevoAlbaran, factura: nuevaFactura })
                    .eq('id', p.id);
                boton.disabled = false;
                if (errorSeguimiento) {
                    modalAvisoError.textContent = 'No se ha podido guardar el seguimiento: ' + errorSeguimiento.message;
                    modalAvisoError.classList.add('activo');
                    return;
                }
                p.transportista = nuevoTransportista;
                p.numero_seguimiento = nuevoSeguimiento || '';
                p.albaran = nuevoAlbaran || '';
                p.factura = nuevaFactura || '';
                marcarEditadoPorMi_(p);
                modalAvisoOk.textContent = 'Seguimiento guardado.';
                modalAvisoOk.classList.add('activo');
                repintar_();
                pintarModal_(p);
            });
        }

        const botonAvanzar = document.getElementById('botonAvanzarEstado');
        if (botonAvanzar) {
            botonAvanzar.addEventListener('click', async function () {
                const nuevoEstado = botonAvanzar.dataset.siguiente;
                botonAvanzar.disabled = true;
                modalAvisoError.classList.remove('activo');
                const { error: errorEstado } = await cliente.from('propuestas_pedido').update({ estado: nuevoEstado }).eq('id', p.id);
                botonAvanzar.disabled = false;
                if (errorEstado) {
                    modalAvisoError.textContent = 'No se ha podido cambiar el estado: ' + errorEstado.message;
                    modalAvisoError.classList.add('activo');
                    return;
                }
                const estadoAnterior = p.estado;
                p.estado = nuevoEstado;
                if (nuevoEstado === 'entregada') p.entregado_en = new Date().toISOString();
                p.dias = diasEntre_(p.enviado_en || p.creado_en, p.entregado_en || new Date());
                // Refleja también, igual que hace el trigger en la BBDD,
                // quién hizo ESTA transición concreta (no solo "última
                // edición").
                const miNombre_ = resultado.perfil.nombre ? [resultado.perfil.nombre, resultado.perfil.apellidos].filter(Boolean).join(' ') : null;
                if (miNombre_) {
                    if (estadoAnterior === 'recibida' && nuevoEstado === 'en_preparacion') p.confirmadoPorNombre = miNombre_;
                    else if (estadoAnterior === 'en_preparacion' && nuevoEstado === 'lista_para_enviar') p.preparadoPorNombre = miNombre_;
                    else if (estadoAnterior === 'lista_para_enviar' && nuevoEstado === 'en_reparto') p.cerradoPorNombre = miNombre_;
                    else if (estadoAnterior === 'en_reparto' && nuevoEstado === 'entregada') p.entregadoPorNombre = miNombre_;
                }
                marcarEditadoPorMi_(p);
                repintar_();
                pintarModal_(p);

                // Aviso por correo al cliente (Fase 6) — nunca bloquea
                // ni deshace el cambio de estado si falla, solo se
                // registra para depurar.
                if (nuevoEstado === 'en_reparto' || nuevoEstado === 'entregada') {
                    fetch(window.SUPABASE_URL + '/functions/v1/notificar-cambio-estado', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + resultado.sesion.access_token },
                        body: JSON.stringify({ propuesta_id: p.id, tipo: nuevoEstado }),
                    }).then(function (r) { return r.json(); }).then(function (json) {
                        if (!json.success) console.warn('Aviso de "' + nuevoEstado + '" no enviado:', json.error || json);
                    }).catch(function (e) { console.warn('Error de red al avisar de "' + nuevoEstado + '":', e); });
                }
            });
        }
    }
})();
</script>
</body>
</html>
