<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes — Panel de gestión · Orencio Matas</title>
<link rel="icon" type="image/x-icon" href="../../assets/logos/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/logos/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/logos/favicon-16x16.png">
<link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
<nav class="navbar-om">
    <div class="navbar-om__marca">
        <img src="../assets/logo-orencio.png" alt="Orencio Matas" class="navbar-om__logo">
        <span class="navbar-om__etiqueta">Panel de gestión</span>
    </div>
    <div class="navbar-om__usuario">
        <span class="insignia-rol" id="insigniaRol">…</span>
        <button class="boton-secundario" id="botonSalir" style="width:auto; margin:0; padding:8px 14px;">Cerrar sesión</button>
    </div>
</nav>
<div class="layout-panel">
    <aside class="panel-lateral">
        <div class="panel-lateral__titulo">Gestión</div>
        <a href="clientes.html" class="activo">Clientes</a>
        <a href="alta-cliente.html">Dar de alta</a>
        <a href="importar-clientes.html">Importar (CSV/XLSX)</a>
    </aside>
    <main class="panel-contenido">
        <div class="panel-tarjeta">
            <h1>Clientes</h1>
            <p class="ayuda" id="ayuda">Cargando…</p>

            <div id="bloqueTabla" style="display:none;">
                <div class="tabla-herramientas">
                    <input type="search" id="filtroClientes" placeholder="Buscar por nombre, email, empresa, dirección, CRM…" autocomplete="off">
                    <div class="tabla-herramientas__tamano">
                        <label for="tamanoPagina" style="margin:0;">Por página</label>
                        <select id="tamanoPagina">
                            <option value="10">10</option>
                            <option value="25" selected>25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                </div>

                <div id="tablaClientes" class="tabla-scroll tabla-adaptativa">
                <table>
                    <thead><tr>
                        <th data-campo="nombre">Nombre <span class="icono-orden">▾</span></th>
                        <th data-campo="email">Email <span class="icono-orden">▾</span></th>
                        <th data-campo="empresa">Empresa <span class="icono-orden">▾</span></th>
                        <th data-campo="direccion">Dirección <span class="icono-orden">▾</span></th>
                        <th data-campo="crm">CRM <span class="icono-orden">▾</span></th>
                        <th data-campo="ultimo_acceso">Último acceso <span class="icono-orden">▾</span></th>
                        <th data-campo="estado">Estado <span class="icono-orden">▾</span></th>
                        <th></th>
                    </tr></thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
                </div>

                <div class="paginacion" id="paginacion">
                    <span id="paginacionResumen"></span>
                    <div class="paginacion__botones">
                        <button type="button" id="botonPaginaPrimera" title="Primera página">«</button>
                        <button type="button" id="botonPaginaAnterior" title="Página anterior">‹ Anterior</button>
                        <span id="paginacionTexto"></span>
                        <button type="button" id="botonPaginaSiguiente" title="Página siguiente">Siguiente ›</button>
                        <button type="button" id="botonPaginaUltima" title="Última página">»</button>
                    </div>
                </div>
            </div>

            <div class="aviso aviso--error" id="avisoError"></div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/supabase-client.js"></script>
<script>
(async function () {
    const resultado = await window.exigirRolAreaClientes_(
        ['comercial', 'administrador'], '../index.html', '../app.html'
    );
    if (!resultado) return;
    document.getElementById('insigniaRol').textContent = resultado.perfil.rol;

    const cliente = window.obtenerClienteSupabase_();
    const ayuda = document.getElementById('ayuda');
    const avisoError = document.getElementById('avisoError');

    document.getElementById('botonSalir').addEventListener('click', async function () {
        await cliente.auth.signOut();
        window.location.href = '../index.html';
    });

    const { data: clientesBrutos, error } = await cliente
        .from('clientes')
        // "clientes" tiene DOS referencias a "profiles" (id y
        // comercial_id) — hay que decirle a PostgREST cuál de las dos
        // seguir aquí (la del propio cliente, no la del comercial).
        .select('id, crm_id, empresa, activo, ultimo_acceso, direccion_calle, direccion_cp, direccion_poblacion, profiles!clientes_id_fkey(nombre, apellidos, email)')
        .order('created_at', { ascending: false });

    if (error) {
        ayuda.textContent = '';
        avisoError.textContent = 'No se ha podido cargar el listado: ' + error.message;
        avisoError.classList.add('activo');
        return;
    }

    if (!clientesBrutos || clientesBrutos.length === 0) {
        ayuda.textContent = 'Todavía no hay clientes. Puedes dar de alta el primero desde el menú de la izquierda.';
        return;
    }

    function formatearUltimoAcceso_(valor) {
        if (!valor) return 'Nunca';
        const fecha = new Date(valor);
        return fecha.toLocaleDateString('es-ES') + ' ' + fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    function direccionTexto_(c) {
        const calle = (c.direccion_calle || '').trim();
        const cpPoblacion = [(c.direccion_cp || '').trim(), (c.direccion_poblacion || '').trim()].filter(Boolean).join(' ');
        return [calle, cpPoblacion].filter(Boolean).join(', ');
    }

    // Se precalcula una sola vez por cliente todo lo que hace falta
    // para buscar/ordenar/pintar — así el filtrado y la ordenación, que
    // se repiten en cada tecla del buscador, no tienen que rehacer
    // estos cálculos (join de nombre, formateo de fecha…) cada vez.
    function construirTextoBusqueda_(c) {
        return [c.nombre, c.email, c.empresa, c.direccion, c.crm, c.activo ? 'activo' : 'desactivado bloqueado', c.ultimoAccesoTexto]
            .join(' ').toLowerCase();
    }

    const clientesPreparados_ = clientesBrutos.map(function (c, indiceOriginal) {
        const datos = {
            id: c.id,
            nombre: [c.profiles.nombre, c.profiles.apellidos].filter(Boolean).join(' ') || '(sin nombre)',
            email: c.profiles.email || '',
            empresa: c.empresa || '',
            direccion: direccionTexto_(c),
            crm: c.crm_id || '',
            activo: c.activo !== false,
            ultimo_acceso: c.ultimo_acceso ? new Date(c.ultimo_acceso).getTime() : -1,
            ultimoAccesoTexto: formatearUltimoAcceso_(c.ultimo_acceso),
            indiceOriginal: indiceOriginal,
        };
        datos.textoBusqueda = construirTextoBusqueda_(datos);
        return datos;
    });

    let filtroTexto_ = '';
    let ordenCampo_ = null;
    let ordenAsc_ = true;
    let paginaActual_ = 1;
    let tamanoPagina_ = 25;

    const cuerpo = document.getElementById('cuerpoTabla');
    const filtroInput = document.getElementById('filtroClientes');
    const tamanoSelect = document.getElementById('tamanoPagina');
    const paginacionResumen = document.getElementById('paginacionResumen');
    const paginacionTexto = document.getElementById('paginacionTexto');
    const botonPrimera = document.getElementById('botonPaginaPrimera');
    const botonAnterior = document.getElementById('botonPaginaAnterior');
    const botonSiguiente = document.getElementById('botonPaginaSiguiente');
    const botonUltima = document.getElementById('botonPaginaUltima');

    function pintarFilaCliente_(c) {
        const fila = document.createElement('tr');
        fila.dataset.id = c.id;
        fila.innerHTML =
            '<td>' + c.nombre + '</td>' +
            '<td>' + c.email + '</td>' +
            '<td>' + (c.empresa || '—') + '</td>' +
            '<td>' + (c.direccion || '—') + '</td>' +
            '<td>' + (c.crm || '—') + '</td>' +
            '<td>' + c.ultimoAccesoTexto + '</td>' +
            '<td><span class="insignia-estado" style="font-size:0.75rem; font-weight:700; padding:3px 9px; border-radius:999px; ' +
                (c.activo ? 'color:var(--ok); background:var(--ok-soft);' : 'color:var(--danger); background:var(--danger-soft);') +
                '">' + (c.activo ? 'Activo' : 'Desactivado') + '</span></td>' +
            '<td style="white-space:nowrap;">' +
            '<a class="boton-fila" style="text-decoration:none; display:inline-block; margin-right:6px;" href="personalizar-cliente.html?id=' + c.id + '">Personalizar</a>' +
            '<button class="boton-fila" data-id="' + c.id + '" style="margin-right:6px;">Simular</button>' +
            '<button class="boton-fila boton-estado' + (c.activo ? ' boton-peligro' : '') + '" data-id="' + c.id + '" data-activo="' + c.activo + '">' + (c.activo ? 'Bloquear' : 'Reactivar') + '</button>' +
            '</td>';
        return fila;
    }

    // Comparador genérico: texto se compara sin mayúsculas/acentos
    // raros con localeCompare; "ultimo_acceso" ya viene como número
    // (timestamp, -1 = "nunca", así que "nunca" siempre queda al
    // final al ordenar ascendente) y "estado" como booleano.
    function comparar_(a, b, campo) {
        if (campo === 'ultimo_acceso') return a.ultimo_acceso - b.ultimo_acceso;
        if (campo === 'estado') return (a.activo === b.activo) ? 0 : (a.activo ? 1 : -1);
        return String(a[campo] || '').localeCompare(String(b[campo] || ''), 'es', { sensitivity: 'base' });
    }

    function listaFiltradaYOrdenada_() {
        let lista = clientesPreparados_;
        if (filtroTexto_) {
            lista = lista.filter(function (c) { return c.textoBusqueda.includes(filtroTexto_); });
        }
        lista = lista.slice().sort(function (a, b) {
            if (ordenCampo_) {
                const resultado = comparar_(a, b, ordenCampo_);
                if (resultado !== 0) return ordenAsc_ ? resultado : -resultado;
            }
            // Sin orden elegido (o empate): se respeta el orden original
            // de carga (más reciente primero).
            return a.indiceOriginal - b.indiceOriginal;
        });
        return lista;
    }

    function actualizarCabecerasOrden_() {
        document.querySelectorAll('.tabla-adaptativa th[data-campo]').forEach(function (th) {
            const activo = th.dataset.campo === ordenCampo_;
            th.toggleAttribute('data-orden-activo', activo);
            th.querySelector('.icono-orden').textContent = activo ? (ordenAsc_ ? '▲' : '▼') : '▾';
        });
    }

    function repintar_() {
        const filtrada = listaFiltradaYOrdenada_();
        const total = filtrada.length;
        const totalPaginas = Math.max(1, Math.ceil(total / tamanoPagina_));
        if (paginaActual_ > totalPaginas) paginaActual_ = totalPaginas;
        if (paginaActual_ < 1) paginaActual_ = 1;

        const inicio = (paginaActual_ - 1) * tamanoPagina_;
        const pagina = filtrada.slice(inicio, inicio + tamanoPagina_);

        cuerpo.innerHTML = '';
        pagina.forEach(function (c) { cuerpo.appendChild(pintarFilaCliente_(c)); });

        const haySinFiltrar = total !== clientesPreparados_.length;
        ayuda.textContent = total + ' cliente(s)' + (haySinFiltrar ? ' (de ' + clientesPreparados_.length + ' en total)' : '') + '.';

        if (total === 0) {
            paginacionResumen.textContent = 'Sin resultados.';
            paginacionTexto.textContent = '';
        } else {
            paginacionResumen.textContent = 'Mostrando ' + (inicio + 1) + '–' + Math.min(inicio + tamanoPagina_, total) + ' de ' + total;
            paginacionTexto.textContent = 'Página ' + paginaActual_ + ' de ' + totalPaginas;
        }
        botonPrimera.disabled = botonAnterior.disabled = paginaActual_ <= 1;
        botonUltima.disabled = botonSiguiente.disabled = paginaActual_ >= totalPaginas;

        actualizarCabecerasOrden_();
    }

    document.getElementById('bloqueTabla').style.display = 'block';
    repintar_();

    let temporizadorFiltro_ = null;
    filtroInput.addEventListener('input', function () {
        clearTimeout(temporizadorFiltro_);
        temporizadorFiltro_ = setTimeout(function () {
            filtroTexto_ = filtroInput.value.trim().toLowerCase();
            paginaActual_ = 1;
            repintar_();
        }, 150);
    });

    tamanoSelect.addEventListener('change', function () {
        tamanoPagina_ = parseInt(tamanoSelect.value, 10) || 25;
        paginaActual_ = 1;
        repintar_();
    });

    document.querySelectorAll('.tabla-adaptativa th[data-campo]').forEach(function (th) {
        th.addEventListener('click', function () {
            const campo = th.dataset.campo;
            if (ordenCampo_ === campo) {
                ordenAsc_ = !ordenAsc_;
            } else {
                ordenCampo_ = campo;
                ordenAsc_ = true;
            }
            repintar_();
        });
    });

    botonPrimera.addEventListener('click', function () { paginaActual_ = 1; repintar_(); });
    botonAnterior.addEventListener('click', function () { paginaActual_--; repintar_(); });
    botonSiguiente.addEventListener('click', function () { paginaActual_++; repintar_(); });
    botonUltima.addEventListener('click', function () { paginaActual_ = Infinity; repintar_(); });

    cuerpo.addEventListener('click', async function (ev) {
        const botonEstado = ev.target.closest('button.boton-estado');
        if (botonEstado) {
            const idCliente = botonEstado.dataset.id;
            const activoActual = botonEstado.dataset.activo === 'true';

            // Baja lógica únicamente — nunca se borra nada, solo se
            // marca "activo = false" en la ficha. Confirmación extra
            // al bloquear (no al reactivar) para evitar un clic
            // accidental que deje a un cliente sin acceso sin querer.
            if (activoActual) {
                const confirmado = await window.confirmarModal_(
                    'Bloquear acceso',
                    'Este cliente dejará de poder entrar al área de clientes de inmediato. Podrás reactivarlo cuando quieras — no se borra nada.',
                    'Bloquear acceso',
                    true
                );
                if (!confirmado) return;
            }

            botonEstado.disabled = true;
            const { error: errorEstado } = await cliente.from('clientes').update({ activo: !activoActual }).eq('id', idCliente);
            botonEstado.disabled = false;

            if (errorEstado) {
                avisoError.textContent = 'No se ha podido cambiar el estado: ' + errorEstado.message;
                avisoError.classList.add('activo');
                return;
            }

            const nuevoActivo = !activoActual;
            const preparado = clientesPreparados_.find(function (c) { return c.id === idCliente; });
            if (preparado) {
                preparado.activo = nuevoActivo;
                preparado.textoBusqueda = construirTextoBusqueda_(preparado);
            }
            repintar_();
            return;
        }

        const boton = ev.target.closest('button.boton-fila');
        if (!boton) return;
        const idCliente = boton.dataset.id;
        boton.disabled = true;
        boton.textContent = 'Generando…';

        try {
            const resp = await fetch(window.SUPABASE_URL + '/functions/v1/simular-acceso', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + resultado.sesion.access_token,
                },
                body: JSON.stringify({ cliente_id: idCliente }),
            });
            const json = await resp.json();

            if (!resp.ok) {
                avisoError.textContent = json.error || 'No se ha podido generar el acceso de simulación.';
                avisoError.classList.add('activo');
                boton.disabled = false;
                boton.textContent = 'Simular';
                return;
            }

            window.open('../simular.html?token=' + encodeURIComponent(json.token_hash), '_blank');
            boton.disabled = false;
            boton.textContent = 'Simular';
        } catch (e) {
            avisoError.textContent = 'Error de red al generar la simulación.';
            avisoError.classList.add('activo');
            boton.disabled = false;
            boton.textContent = 'Simular';
        }
    });
})();
</script>
</body>
</html>
