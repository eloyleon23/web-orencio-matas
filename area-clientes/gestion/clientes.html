<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes — Panel de gestión · Orencio Matas</title>
<link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
<nav class="navbar-om">
    <div class="navbar-om__marca">
        <img src="../assets/logo-orencio.png" alt="Orencio Matas" class="navbar-om__logo">
        <span class="navbar-om__etiqueta">Panel de gestión</span>
    </div>
    <div class="navbar-om__usuario">
        <span class="insignia-rol" id="insigniaRol">…</span>
        <button class="boton-secundario" id="botonSalir" style="width:auto; margin:0; padding:8px 14px;">Cerrar sesión</button>
    </div>
</nav>
<div class="layout-panel">
    <aside class="panel-lateral">
        <div class="panel-lateral__titulo">Gestión</div>
        <a href="clientes.html" class="activo">Clientes</a>
        <a href="alta-cliente.html">Dar de alta</a>
        <a href="importar-clientes.html">Importar (CSV/XLSX)</a>
    </aside>
    <main class="panel-contenido">
        <div class="panel-tarjeta">
            <h1>Clientes</h1>
            <p class="ayuda" id="ayuda">Cargando…</p>

            <div id="tablaClientes" class="tabla-scroll" style="display:none;">
            <table>
                <thead><tr><th>Nombre</th><th>Email</th><th>Empresa</th><th>CRM</th><th>Estado</th><th></th></tr></thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
            </div>

            <div class="aviso aviso--error" id="avisoError"></div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/supabase-client.js"></script>
<script>
(async function () {
    const resultado = await window.exigirRolAreaClientes_(
        ['comercial', 'administrador'], '../index.html', '../app.html'
    );
    if (!resultado) return;
    document.getElementById('insigniaRol').textContent = resultado.perfil.rol;

    const cliente = window.obtenerClienteSupabase_();
    const ayuda = document.getElementById('ayuda');
    const avisoError = document.getElementById('avisoError');

    document.getElementById('botonSalir').addEventListener('click', async function () {
        await cliente.auth.signOut();
        window.location.href = '../index.html';
    });

    const { data: clientes, error } = await cliente
        .from('clientes')
        // "clientes" tiene DOS referencias a "profiles" (id y
        // comercial_id) — hay que decirle a PostgREST cuál de las dos
        // seguir aquí (la del propio cliente, no la del comercial).
        .select('id, crm_id, empresa, activo, profiles!clientes_id_fkey(nombre, apellidos, email)')
        .order('created_at', { ascending: false });

    if (error) {
        ayuda.textContent = '';
        avisoError.textContent = 'No se ha podido cargar el listado: ' + error.message;
        avisoError.classList.add('activo');
        return;
    }

    if (!clientes || clientes.length === 0) {
        ayuda.textContent = 'Todavía no hay clientes. Puedes dar de alta el primero desde el menú de la izquierda.';
        return;
    }

    ayuda.textContent = clientes.length + ' cliente(s).';
    const cuerpo = document.getElementById('cuerpoTabla');

    clientes.forEach(function (c) {
        const fila = document.createElement('tr');
        const nombre = [c.profiles.nombre, c.profiles.apellidos].filter(Boolean).join(' ') || '(sin nombre)';
        const activo = c.activo !== false;
        fila.innerHTML =
            '<td>' + nombre + '</td>' +
            '<td>' + c.profiles.email + '</td>' +
            '<td>' + (c.empresa || '—') + '</td>' +
            '<td>' + (c.crm_id || '—') + '</td>' +
            '<td><span style="font-size:0.75rem; font-weight:700; padding:3px 9px; border-radius:999px; ' +
                (activo ? 'color:var(--ok); background:var(--ok-soft);' : 'color:var(--danger); background:var(--danger-soft);') +
                '">' + (activo ? 'Activo' : 'Desactivado') + '</span></td>' +
            '<td style="white-space:nowrap;">' +
            '<a class="boton-fila" style="text-decoration:none; display:inline-block; margin-right:6px;" href="personalizar-cliente.html?id=' + c.id + '">Personalizar</a>' +
            '<button class="boton-fila" data-id="' + c.id + '" style="margin-right:6px;">Simular</button>' +
            '<button class="boton-fila boton-estado' + (activo ? ' boton-peligro' : '') + '" data-id="' + c.id + '" data-activo="' + activo + '">' + (activo ? 'Bloquear' : 'Reactivar') + '</button>' +
            '</td>';
        cuerpo.appendChild(fila);
    });

    document.getElementById('tablaClientes').style.display = 'block';

    cuerpo.addEventListener('click', async function (ev) {
        const botonEstado = ev.target.closest('button.boton-estado');
        if (botonEstado) {
            const idCliente = botonEstado.dataset.id;
            const activoActual = botonEstado.dataset.activo === 'true';

            // Baja lógica únicamente — nunca se borra nada, solo se
            // marca "activo = false" en la ficha. Confirmación extra
            // al bloquear (no al reactivar) para evitar un clic
            // accidental que deje a un cliente sin acceso sin querer.
            if (activoActual) {
                const confirmado = await window.confirmarModal_(
                    'Bloquear acceso',
                    'Este cliente dejará de poder entrar al área de clientes de inmediato. Podrás reactivarlo cuando quieras — no se borra nada.',
                    'Bloquear acceso',
                    true
                );
                if (!confirmado) return;
            }

            botonEstado.disabled = true;
            const { error: errorEstado } = await cliente.from('clientes').update({ activo: !activoActual }).eq('id', idCliente);
            botonEstado.disabled = false;

            if (errorEstado) {
                avisoError.textContent = 'No se ha podido cambiar el estado: ' + errorEstado.message;
                avisoError.classList.add('activo');
                return;
            }

            const fila = botonEstado.closest('tr');
            const badge = fila.querySelector('td:nth-child(5) span');
            const nuevoActivo = !activoActual;
            badge.textContent = nuevoActivo ? 'Activo' : 'Desactivado';
            badge.style.color = nuevoActivo ? 'var(--ok)' : 'var(--danger)';
            badge.style.background = nuevoActivo ? 'var(--ok-soft)' : 'var(--danger-soft)';
            botonEstado.textContent = nuevoActivo ? 'Bloquear' : 'Reactivar';
            botonEstado.classList.toggle('boton-peligro', nuevoActivo);
            botonEstado.dataset.activo = String(nuevoActivo);
            return;
        }

        const boton = ev.target.closest('button.boton-fila');
        if (!boton) return;
        const idCliente = boton.dataset.id;
        boton.disabled = true;
        boton.textContent = 'Generando…';

        try {
            const resp = await fetch(window.SUPABASE_URL + '/functions/v1/simular-acceso', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + resultado.sesion.access_token,
                },
                body: JSON.stringify({ cliente_id: idCliente }),
            });
            const json = await resp.json();

            if (!resp.ok) {
                avisoError.textContent = json.error || 'No se ha podido generar el acceso de simulación.';
                avisoError.classList.add('activo');
                boton.disabled = false;
                boton.textContent = 'Simular';
                return;
            }

            window.open('../simular.html?token=' + encodeURIComponent(json.token_hash), '_blank');
            boton.disabled = false;
            boton.textContent = 'Simular';
        } catch (e) {
            avisoError.textContent = 'Error de red al generar la simulación.';
            avisoError.classList.add('activo');
            boton.disabled = false;
            boton.textContent = 'Simular';
        }
    });
})();
</script>
</body>
</html>
