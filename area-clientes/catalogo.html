<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi catálogo — Área de Clientes · Orencio Matas</title>
<link rel="icon" type="image/x-icon" href="../assets/logos/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logos/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/logos/favicon-16x16.png">
<link rel="stylesheet" href="assets/estilos.css">
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>
<style>
    body { display: block; }

    select {
        width: 100%; padding: 10px 12px; border: 1px solid var(--border);
        border-radius: 8px; font-size: 16px; font-family: inherit;
        background: var(--white); color: var(--dark);
    }

    .insignia-descuento {
        font-size: 0.72rem; font-weight: 800; color: white;
        background: var(--ok); border-radius: 999px; padding: 4px 10px;
        white-space: nowrap;
    }
    .catalogo-resumen { color: var(--muted); font-size: 0.82rem; margin: 14px 0 4px; }

    /* 1800px, no 1180: en monitores de escritorio se quedaba mucho
       hueco libre a los lados sin motivo. */
    .catalogo-cuerpo { max-width: 1800px; margin: 0 auto; padding: 22px 32px 60px; }

    /* A petición de Eloy (27/11/2026): "si haces scroll, los chips de
       filtros aplicados no se ven y te obliga a subir arriba del todo
       para poderlos quitar. En PC prefiero que sean accesibles en todo
       momento" — se hace sticky el CONTENEDOR conjunto (barra de
       filtros + chips activos), no solo la barra, para que ambos se
       queden pegados arriba juntos al hacer scroll. Solo en PC: en
       móvil, justo lo contrario ("que no ocupe espacio"), ver el
       @media de abajo donde se vuelve a position:static. */
    #contenedorFiltrosSuperior {
        position: sticky; top: 0; z-index: 5; background: var(--light);
    }
    .barra-filtros {
        display: flex; gap: 10px; align-items: center; margin: 0 0 10px;
        flex-wrap: wrap; padding: 10px 0 0;
    }
    .barra-filtros__toggle { display: none; }
    .barra-filtros__contenido { display: contents; }
    .barra-buscador { position: relative; flex: 1 1 220px; max-width: 280px; }
    .barra-buscador input { margin: 0; padding-left: 36px; font-size: 0.85rem; }
    .barra-buscador::before {
        content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
        font-size: 0.85rem; opacity: 0.5;
    }
    /* Desplegable de sugerencias (estilo Amazon) — mismo aspecto que
       #sugerencias-busqueda en la web pública. */
    .sugerencias-busqueda {
        display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
        background: #fff; border: 1px solid var(--border); border-radius: 10px;
        box-shadow: 0 10px 28px rgba(0,0,0,.14); z-index: 20; max-height: 320px; overflow-y: auto;
    }
    .sugerencias-busqueda.visible { display: block; }
    .sugerencia-item {
        padding: 10px 14px; font-size: 0.85rem; color: var(--dark); cursor: pointer;
        display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f1f1f1;
    }
    .sugerencia-item:last-child { border-bottom: none; }
    .sugerencia-item:hover { background: var(--light); }
    .sugerencia-item i { color: var(--muted); font-size: 0.8rem; flex-shrink: 0; }
    .sugerencia-item strong { font-weight: 700; }
    .barra-filtros select { width: auto; margin: 0; min-width: 150px; max-width: 220px; font-size: 0.85rem; }
    .chip-filtro {
        border: 1px solid var(--border); background: var(--white); color: var(--muted);
        border-radius: 999px; padding: 10px 16px; font-size: 0.8rem; font-weight: 600;
        cursor: pointer; white-space: nowrap; box-sizing: border-box;
    }
    .chip-filtro:hover { border-color: var(--blue); color: var(--blue); }
    .chip-filtro.activo { background: var(--dark); color: white; border-color: var(--dark); }
    .chip-filtro--limpiar { border-color: var(--blue); color: var(--blue); }
    .chip-filtro--limpiar:hover { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); }

    /* ── Selector múltiple con buscador interno (familia/subfamilia) ── */
    .multi-select { position: relative; }
    .multi-select__boton {
        display: flex; align-items: center; gap: 6px; width: auto; margin: 0;
        min-width: 150px; max-width: 220px; padding: 10px 12px;
        border: 1px solid var(--border); border-radius: 8px; background: var(--white);
        color: var(--dark); font-size: 0.85rem; font-family: inherit; cursor: pointer;
        white-space: nowrap;
    }
    .multi-select__boton-contador {
        background: var(--blue); color: white; border-radius: 999px;
        font-size: 0.68rem; font-weight: 800; padding: 1px 7px; margin-left: auto;
    }
    .multi-select__panel {
        display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 10;
        background: var(--white); border: 1px solid var(--border); border-radius: 10px;
        box-shadow: var(--sombra); width: 260px; max-width: 80vw; padding: 10px;
    }
    .multi-select.abierto .multi-select__panel { display: block; }
    .multi-select__buscador {
        width: 100%; margin: 0 0 8px; padding: 8px 10px; font-size: 0.85rem;
        border: 1px solid var(--border); border-radius: 6px; font-family: inherit;
    }
    .multi-select__lista { max-height: 220px; overflow-y: auto; }
    .multi-select__opcion {
        display: flex; align-items: center; gap: 8px; padding: 6px 4px;
        font-size: 0.85rem; cursor: pointer; border-radius: 6px;
    }
    .multi-select__opcion:hover { background: var(--light); }
    .multi-select__opcion input { margin: 0; width: auto; }
    .multi-select__sin-resultados { font-size: 0.8rem; color: var(--muted); padding: 6px 4px; }

    /* ── Chips de filtros activos (quitables de uno en uno) ──────────── */
    .filtros-activos { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding-bottom: 14px; }
    .filtros-activos:empty { display: none; margin: 0; }
    .chip-filtro-activo {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--blue-soft); color: var(--blue); border: none;
        border-radius: 999px; padding: 6px 8px 6px 14px; font-size: 0.78rem;
        font-weight: 600; cursor: pointer;
    }
    .chip-filtro-activo:hover { background: var(--danger-soft); color: var(--danger); }
    .chip-filtro-activo span.cerrar { font-weight: 800; }

    /* ── Bloques de descubrimiento (destacados, temporadas, novedades,
       sigue explorando, últimos vistos) — a petición de Eloy
       (27/11/2026): mismo aspecto y mismo tamaño que el grid principal
       (reutilizan .producto-tarjeta tal cual, igual que .mas-buscados__lista
       reutiliza .producto-card en la web pública), en una fila con
       scroll horizontal en vez de una rejilla, para no competir
       visualmente con el catálogo principal de debajo. ─────────────── */
    .modulo-descubrimiento { margin-bottom: 26px; }
    .modulo-descubrimiento__cabecera {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; margin: 0 0 10px; flex-wrap: wrap;
    }
    .modulo-descubrimiento__titulo {
        font-family: 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 800;
        color: var(--dark); margin: 0; display: flex; align-items: center; gap: 8px;
    }
    .modulo-descubrimiento__titulo-clicable { cursor: pointer; }
    .modulo-descubrimiento__titulo-clicable:hover { color: var(--blue); }
    .modulo-descubrimiento__flecha { font-size: 0.75rem; color: var(--muted); }
    .modulo-descubrimiento__icono { display: inline-flex; width: 1.3em; justify-content: center; }
    .modulo-descubrimiento__icono--rojo { color: #d32f2f; }
    .modulo-descubrimiento__icono--verde { color: #388e3c; }
    .modulo-descubrimiento__icono--azul { color: #1976d2; }
    .modulo-descubrimiento__icono--gris { color: var(--muted); }
    .modulo-descubrimiento__boton-cabecera {
        border: 1px solid var(--border); background: var(--white); color: var(--muted);
        border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; font-weight: 600;
        cursor: pointer; white-space: nowrap;
    }
    .modulo-descubrimiento__boton-cabecera:hover { border-color: var(--danger); color: var(--danger); }
    .modulo-descubrimiento__fila {
        display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px;
        scroll-snap-type: x proximity;
    }
    .modulo-descubrimiento__fila > .producto-tarjeta { flex: 0 0 200px; scroll-snap-align: start; }
    .producto-tarjeta--transicion { opacity: 0; transition: opacity 0.22s ease; }

    /* ── Sigue explorando: sub-bloques de color con rejilla 2x2 de solo
       imagen — igual que la web pública (.categoria-bloque). ────────── */
    .categorias-carrusel { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
    .categoria-bloque {
        position: relative; flex: 0 0 200px; scroll-snap-align: start;
        border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
    }
    .categoria-bloque--rojo { background: #fbebea; border: 1px solid rgba(211,47,47,0.22); }
    .categoria-bloque--verde { background: #eaf3ea; border: 1px solid rgba(56,142,60,0.22); }
    .categoria-bloque--amarillo { background: #fdf6e3; border: 1px solid rgba(251,192,45,0.35); }
    .categoria-bloque--azul { background: #e9f1fa; border: 1px solid rgba(25,118,210,0.22); }
    .categoria-bloque--rojo .categoria-bloque__titulo { color: #9a2626; }
    .categoria-bloque--verde .categoria-bloque__titulo { color: #2d6b31; }
    .categoria-bloque--amarillo .categoria-bloque__titulo { color: #8a6a09; }
    .categoria-bloque--azul .categoria-bloque__titulo { color: #14579e; }
    .categoria-bloque__titulo { font-weight: 800; font-size: 0.88rem; margin: 0; }
    .categoria-bloque__lupa { position: absolute; top: 10px; right: 10px; opacity: 0.55; pointer-events: none; }
    .categoria-bloque__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .categoria-bloque__item {
        border: none; border-radius: 8px; overflow: hidden; background: var(--white);
        padding: 0; cursor: pointer; aspect-ratio: 1; display: block;
    }
    .categoria-bloque__item img { width: 100%; height: 100%; object-fit: contain; padding: 6px; display: block; }

    /* ── Modal "ver todos" de una temporada ──────────────────────────── */
    .modal-temporada-overlay {
        display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.55);
        align-items: flex-start; justify-content: center; padding: 30px 20px; z-index: 55; overflow-y: auto;
    }
    .modal-temporada-overlay.activo { display: flex; }
    .modal-temporada {
        background: var(--white); border-radius: var(--radius); max-width: 1200px; width: 100%;
        padding: 24px; position: relative;
    }
    .modal-temporada__cabecera { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .modal-temporada__cabecera h2 { margin: 0; font-size: 1.2rem; }
    .modal-temporada__filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .modal-temporada__filtros .barra-buscador { max-width: 240px; }
    .modal-temporada__filtros select { width: auto; min-width: 150px; max-width: 220px; margin: 0; font-size: 0.85rem; }
    .modal-temporada__cuerpo { max-height: 65vh; overflow-y: auto; }

    @media (max-width: 600px) {
        .modal-temporada { padding: 16px; }
        .modal-temporada__filtros .barra-buscador { max-width: none; flex: 1 1 100%; }
    }

    .grupo-familia__titulo {
        font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 800;
        color: var(--dark); margin: 28px 0 14px; padding-bottom: 6px;
        border-bottom: 2px solid var(--blue-soft);
    }
    .grupo-familia__titulo:first-child { margin-top: 0; }

    .rejilla-productos {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
        gap: 18px;
    }
    .producto-tarjeta {
        background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 0 0 16px; text-align: center; overflow: hidden;
        transition: box-shadow 0.15s ease, transform 0.15s ease;
        display: flex; flex-direction: column; cursor: pointer;
    }
    .producto-tarjeta:hover { box-shadow: var(--sombra); transform: translateY(-2px); }
    .producto-tarjeta__img-envoltorio {
        position: relative; background: var(--light); padding: 18px;
        border-bottom: 1px solid var(--border);
    }
    .producto-tarjeta img { width: 100%; height: 120px; object-fit: contain; display: block; }
    /* Logo de reserva (sin foto propia) — mismo criterio que
       sin-imagen-fabricante-logo en la web pública: difuminado, nunca
       a toda opacidad, para que no se confunda con una foto real. */
    img[src*="logo_transparente.png"] { opacity: 0.4; }
    .insignia-oferta {
        position: absolute; top: 8px; left: 8px;
        background: var(--danger); color: white; font-size: 0.65rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.03em;
        border-radius: 5px; padding: 3px 7px;
    }
    .producto-tarjeta__cuerpo { padding: 14px 14px 0; flex: 1; display: flex; flex-direction: column; }
    .producto-tarjeta__nombre {
        font-size: 0.85rem; font-weight: 600; color: var(--dark); line-height: 1.3em;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; height: 2.6em; max-height: 2.6em; margin-bottom: 10px;
    }
    .producto-tarjeta__ref {
        display: flex; align-items: center; justify-content: center; gap: 6px;
        font-size: 0.72rem; color: var(--muted); margin-bottom: 8px;
        white-space: nowrap; overflow: hidden;
    }
    .producto-tarjeta__ref span { overflow: hidden; text-overflow: ellipsis; }
    .producto-tarjeta__ref-copiar {
        border: none; background: none; cursor: pointer; font-size: 0.8rem;
        line-height: 1; padding: 2px 4px; border-radius: 4px; opacity: 0.6;
    }
    .producto-tarjeta__ref-copiar:hover { opacity: 1; background: var(--light); }
    .producto-tarjeta__precios { margin-top: auto; }
    .producto-tarjeta__etiqueta-precio {
        font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
        color: var(--muted); margin-bottom: 2px;
    }
    .producto-tarjeta__precio-fila { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
    .producto-tarjeta__precio-original { font-size: 0.8rem; color: var(--muted); text-decoration: line-through; }
    .producto-tarjeta__precio { font-size: 1.1rem; font-weight: 800; color: var(--blue); }
    .producto-tarjeta__precio-sin { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
    .producto-tarjeta__precio-calculando { font-size: 0.78rem; color: var(--muted); }
    .insignia-ahorro {
        display: inline-block; margin-top: 4px; font-size: 0.68rem; font-weight: 800;
        color: var(--ok); background: var(--ok-soft); border-radius: 5px; padding: 2px 6px;
    }

    /* ── Destacados con descuento/promoción — mismo aspecto que la web
       pública (destacado-chip/destacado-precio-*), a petición de Eloy:
       "los productos que tienen ofertas... como los que aparecen en
       destacados no muestran nada... deben aparecer también en el
       grid de productos generales". ───────────────────────────────── */
    .destacado-chip {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 0.62rem; font-weight: 800; text-transform: uppercase;
        letter-spacing: .3px; padding: 3px 8px; border-radius: 6px; color: #fff;
        position: absolute; top: 8px; left: 8px; z-index: 2;
    }
    .destacado-chip--oferta { background: var(--ok); }
    .destacado-chip--oportunidad { background: var(--blue); }
    .destacado-chip--liquidacion { background: var(--danger); }
    .destacado-promo-texto {
        display: inline-block; background: #fef3c7; color: #78350f;
        font-size: 0.68rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; margin-top: 4px;
    }
    .destacado-precio-descuento { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .destacado-precio-original { color: var(--muted); text-decoration: line-through; font-size: 0.78rem; }
    .destacado-precio-promo { color: var(--danger); font-weight: 800; font-size: 1.1rem; }
    .destacado-precio-pct {
        background: var(--danger); color: #fff; font-size: 0.65rem; font-weight: 800;
        padding: 2px 6px; border-radius: 5px;
    }

    /* ── Modal de detalle de producto ──────────────────────────────── */
    .modal-detalle-overlay {
        display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.55);
        align-items: center; justify-content: center; padding: 20px; z-index: 50;
    }
    .modal-detalle-overlay.activo { display: flex; }
    .modal-detalle {
        background: var(--white); border-radius: var(--radius); max-width: 640px; width: 100%;
        max-height: 90vh; overflow-y: auto; padding: 28px; position: relative;
    }
    .modal-detalle__cerrar {
        position: absolute; top: 14px; right: 14px; border: none; background: var(--light);
        width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; color: var(--muted);
    }
    .modal-detalle__cuerpo { display: flex; gap: 24px; flex-wrap: wrap; }
    .modal-detalle__img { flex: 1 1 220px; background: var(--light); border-radius: 10px; padding: 20px; text-align: center; }
    .modal-detalle__img img { max-width: 100%; max-height: 220px; object-fit: contain; }
    .modal-detalle__info { flex: 1 1 260px; }
    .modal-detalle__ref { font-size: 0.75rem; color: var(--muted); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }

    /* ── Lightbox de imagen ampliada ──────────────────────────────── */
    .lightbox-imagen-overlay {
        display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.85);
        align-items: center; justify-content: center; padding: 20px; z-index: 60; cursor: zoom-out;
    }
    .lightbox-imagen-overlay.activo { display: flex; }
    .lightbox-imagen-overlay img { max-width: 100%; max-height: 90vh; object-fit: contain; }
    .modal-detalle__nombre { font-size: 1.15rem; font-weight: 800; margin: 0 0 10px; }
    .modal-detalle__meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 14px; }
    .modal-detalle__meta span { display: inline-block; background: var(--light); border-radius: 5px; padding: 3px 8px; margin: 0 6px 6px 0; }
    .modal-detalle__precio-bloque { background: var(--blue-soft); border-radius: 10px; padding: 14px 16px; margin-top: 10px; }

    @media (max-width: 480px) {
        .modal-detalle { padding: 20px; }
        .modal-detalle__cuerpo { gap: 16px; }
    }

    .spinner-pagina {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        padding: 60px 0; color: var(--muted); font-size: 0.9rem;
    }
    .spinner-pagina__giro {
        width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue);
        border-radius: 50%; animation: girar 0.7s linear infinite;
    }

    /* Botón flotante "subir arriba" — mismo estilo que #btn-subir-arriba
       en la web pública (index.html). */
    #btnSubirArriba {
        display: none; position: fixed; right: 22px; bottom: 22px; z-index: 40;
        width: 46px; height: 46px; border-radius: 50%; border: none;
        background: var(--dark); color: #fff; font-size: 1.1rem;
        align-items: center; justify-content: center; cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,.25);
        opacity: 0; transform: translateY(8px);
        transition: opacity .2s, transform .2s, background .15s;
    }
    #btnSubirArriba.visible { display: flex; opacity: 1; transform: translateY(0); }
    #btnSubirArriba:hover { background: var(--blue); }
    @media (max-width: 640px) {
        #btnSubirArriba { right: 14px; bottom: 14px; width: 36px; height: 36px; font-size: 0.9rem; }
    }

    @media (max-width: 600px) {
        .catalogo-cuerpo { padding-left: 16px; padding-right: 16px; }
        .rejilla-productos { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

        /* En móvil, lo contrario que en PC: los chips de filtros
           activos NO se quedan fijos (ocuparían demasiada pantalla) —
           solo la barra de filtros/buscador se queda pegada arriba,
           igual que antes. */
        #contenedorFiltrosSuperior { position: static; }
        .barra-filtros { position: sticky; top: 0; z-index: 5; background: var(--light); padding-top: 10px; }

        /* estilos.css oculta .navbar-om__etiqueta en móvil (ahí era solo
           la marca "Mi catálogo", redundante con el logo) — pero aquí
           esta misma clase también muestra el saludo "Hola, {nombre}",
           lo único que lo decía ahora que se quitó la cabecera propia.
           Selector con #id para ganar en especificidad y no perderlo. */
        .navbar-om__etiqueta#saludo {
            display: block; font-size: 0.78rem; max-width: 150px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* En móvil, filtros y buscador recogidos detrás de un botón —
           antes ocupaban buena parte de la pantalla nada más entrar.
           La búsqueda (lo que más se usa) se queda siempre visible. */
        .barra-filtros { flex-direction: column; align-items: stretch; gap: 8px; }
        .barra-filtros__toggle {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; background: var(--white); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; font-weight: 700;

<script>
// URL del mismo Apps Script que usa el sitio público — ver index.html
// (PRODUCTOS_REMOTO_URL_BASE). Solo reutilizamos la capa de datos, no
// el HTML del buscador. Sin PIN, el servidor ya filtra por su cuenta
// los productos marcados como no-visibles para "usuario normal" (ver
// ocultarPorVisibilidad_ en apps_script_trigger.js) — aquí encima se
// aplica la personalización propia del cliente.
const CATALOGO_URL_ = 'https://script.google.com/macros/s/AKfycbwqJOASK7XTqZ_XH2wt512Es5DlItsjIQn24JYGuuNMcuolzvi5P8L-m0N5Sf0oHzQ7/exec?accion=obtener_productos';
// JSON estático que ya genera scripts/generar_productos_json.py en
// cada despliegue — no lleva precio de mayor (eso solo lo da el
// Apps Script en vivo, y solo con el token validado), pero sí nombre,
// imagen, área/familia — de sobra para pintar la rejilla al instante
// en vez de esperar varios segundos a la respuesta en vivo, igual que
// hace index.html con el buscador público.
const CATALOGO_ESTATICO_URL_ = '../data/productos.json';

// Nuestro propio logo como imagen de reserva — a petición de Eloy,
// igual que hace el sitio público (sin-imagen-fabricante en
// index.html): nunca dejar un hueco en blanco, siempre algo de marca.
// Logo SIN texto (igual que LOGO_EMPRESA en index.html) — a petición
// de Eloy, no el logo con el nombre de la empresa que se usaba antes.
// Se pinta difuminado vía CSS (img[src*="logo_transparente.png"]).
const PLACEHOLDER_IMG_ = '../assets/logos/logo_transparente.png';

function urlImagenProducto_(p) {
    if (!p.img) return PLACEHOLDER_IMG_;
    return 'https://lh3.googleusercontent.com/d/' + p.img + '=w300';
}

// Igual que ya le pasaba a escaparate.html con catálogos grandes:
// googleusercontent.com devuelve algún 429 (demasiadas peticiones
// seguidas) cuando se piden de golpe las imágenes de una rejilla
// entera. Un solo reintento tras una breve espera soluciona la
// mayoría — si tampoco entonces, se cae al hueco gris de "sin imagen"
// en vez de dejar un icono de imagen rota.
window.reintentarImagenProducto_ = function (img) {
    if (img.dataset.reintentado) { img.onerror = null; img.src = PLACEHOLDER_IMG_; return; }
    img.dataset.reintentado = '1';
    const srcOriginal = img.src;
    // Nada de "cache-buster" en la URL (?_r=... o &_r=...): la de
    // googleusercontent.com no lleva "?", es "=w300" al final como
    // parte de la sintaxis propia de Google — añadirle algo detrás
    // puede romperla y hacer que el reintento falle siempre. Vaciar el
    // src y volver a ponerlo fuerza una carga nueva de todas formas.
    // La espera lleva un margen aleatorio para no concentrar todos los
    // reintentos de la rejilla en el mismo instante (si no, el segundo
    // intento puede volver a toparse con el límite de peticiones).
    const espera = 900 + Math.random() * 1300;
    setTimeout(function () {
        img.src = '';
        img.src = srcOriginal;
    }, espera);
};

function numeroDesdePrecio_(texto) {
    if (!texto) return null;
    return parseFloat(String(texto).replace(',', '.'));
}

function productoVisibleParaCliente_(p, personalizacion) {
    const { familias, areas, productos, modoProductos } = personalizacion;
    // Área y familia se acotan entre sí (intersección): si rellenas
    // las dos, el producto tiene que cumplir ambas a la vez (bug
    // reportado por Eloy, 27/11/2026 — antes era un OR puro e
    // independiente entre las tres listas).
    const cumpleAreaFamilia = function () {
        if (areas.length && !areas.includes(p.area)) return false;
        if (familias.length && !familias.includes(p.familia)) return false;
        return true;
    };

    // "Referencias concretas" ahora tiene tres modos distintos (a
    // petición de Eloy, 27/11/2026 — antes solo existía "incluir"):
    //   'solo'    — ignora área/familia por completo: ve ÚNICAMENTE
    //               las referencias listadas.
    //   'excluir' — lo contrario de "incluir": esas referencias se
    //               OCULTAN aunque cumplan área/familia.
    //   'incluir' (por defecto) — además de lo que ya entra por área/
    //               familia, esas referencias se ven sí o sí.
    if (modoProductos === 'solo') return productos.includes(p.ref);
    if (modoProductos === 'excluir') {
        if (productos.includes(p.ref)) return false;
        if (!areas.length && !familias.length) return true;
        return cumpleAreaFamilia();
    }
    if (productos.includes(p.ref)) return true;
    if (!areas.length && !familias.length) return productos.length === 0;
    return cumpleAreaFamilia();
}

// Vista de detalle — se abre al pulsar cualquier tarjeta. Misma lógica
// de precio de mayor + descuento que la rejilla, así que si cambia una
// cosa, cambia la otra (no hay dos sitios distintos calculando precios).
window.abrirDetalleProducto_ = function (p, descuentoPct) {
    registrarProductoVisto_(p.ref);
    repintarUltimosVistos_();
    const imgModal = document.getElementById('modalDetalleImg');
    delete imgModal.dataset.reintentado; // es un <img> compartido entre aperturas — sin esto, el segundo producto que falle no reintentaría
    imgModal.src = urlImagenProducto_(p);
    imgModal.onerror = function () { window.reintentarImagenProducto_(this); };
    document.getElementById('modalDetalleRef').textContent = 'Ref. ' + p.ref;
    document.getElementById('modalDetalleRefCopiar').onclick = function () { window.copiarReferencia_(p.ref, this); };
    document.getElementById('modalDetalleNombre').textContent = p.nombre;

    const meta = [];
    if (p.area) meta.push('<span>' + p.area + '</span>');
    if (p.familia) meta.push('<span>' + p.familia + '</span>');
    if (p.subfamilia) meta.push('<span>' + p.subfamilia + '</span>');
    // Bug real reportado (27/11/2026): en algunos productos la columna
    // "marca" del Sheet lleva por error el nombre completo del
    // producto en vez de la marca real — se veía como el nombre
    // repetido justo debajo del propio título. No se toca el dato en
    // el Sheet (no es cosa de esta pantalla); simplemente no se pinta
    // el chip cuando coincide con el nombre, venga de donde venga.
    if (p.fabricante && p.fabricante.trim().toLowerCase() !== (p.nombre || '').trim().toLowerCase()) {
        meta.push('<span>' + p.fabricante + '</span>');
    }
    if (p.oferta) meta.push('<span style="background:var(--danger-soft); color:var(--danger); font-weight:700;">Oferta</span>');
    document.getElementById('modalDetalleMeta').innerHTML = meta.join(' ');

    const bloquePrecio = document.getElementById('modalDetallePrecio');
    const hayPrecioMayor = p.precio_mayor_con !== undefined && p.precio_mayor_con !== null && p.precio_mayor_con !== '';
    if (p._precioProvisional) {
        bloquePrecio.innerHTML = '<span style="color:var(--muted);">Calculando precio de mayor…</span>';
    } else if (p.mostrar_precio === false) {
        bloquePrecio.innerHTML = '<strong>Consultar precio</strong>';
    } else if (!hayPrecioMayor) {
        bloquePrecio.innerHTML = '<span style="color:var(--muted);">Precio de mayor no disponible</span>';
    } else {
        const conBase = numeroDesdePrecio_(p.precio_mayor_con);
        const sinBase = numeroDesdePrecio_(p.precio_mayor_sin);
        const conFinal = descuentoPct > 0 ? conBase * (1 - descuentoPct / 100) : conBase;
        const sinFinal = (sinBase !== null && descuentoPct > 0) ? sinBase * (1 - descuentoPct / 100) : sinBase;
        bloquePrecio.innerHTML =
            '<div style="font-size:0.72rem; font-weight:700; text-transform:uppercase; color:var(--muted); margin-bottom:4px;">Precio de mayor' + (descuentoPct > 0 ? ' (con tu ' + descuentoPct + '% de descuento)' : '') + '</div>' +
            '<div style="font-size:1.4rem; font-weight:800; color:var(--blue);">' + conFinal.toFixed(2).replace('.', ',') + ' € <span style="font-size:0.8rem; font-weight:600; color:var(--muted);">con IVA</span></div>' +
            (sinFinal !== null ? '<div style="font-size:0.85rem; color:var(--muted);">' + sinFinal.toFixed(2).replace('.', ',') + ' € sin IVA</div>' : '') +
            (descuentoPct > 0 ? '<div style="font-size:0.78rem; color:var(--muted); text-decoration:line-through; margin-top:4px;">' + p.precio_mayor_con + ' € antes del descuento</div>' : '');
    }

    document.getElementById('modalDetalleOverlay').classList.add('activo');
};

document.getElementById('modalDetalleCerrar').addEventListener('click', function () {
    document.getElementById('modalDetalleOverlay').classList.remove('activo');
});
document.getElementById('modalDetalleOverlay').addEventListener('click', function (ev) {
    if (ev.target === this) this.classList.remove('activo');
});

// Imagen ampliada (lightbox) — solo si es una foto real del producto,
// no el logo de reserva (que no tiene nada que ampliar).
document.getElementById('modalDetalleImg').addEventListener('click', function () {
    if (!this.src || this.src.indexOf(PLACEHOLDER_IMG_) !== -1) return;
    document.getElementById('lightboxImagenImg').src = this.src;
    document.getElementById('lightboxImagenOverlay').classList.add('activo');
});
document.getElementById('lightboxImagenOverlay').addEventListener('click', function () {
    this.classList.remove('activo');
});

// Copiar referencia al portapapeles — reutilizado por la tarjeta del
// grid y por el modal de detalle. Feedback visual breve en el propio
// botón (cambia el icono un instante) en vez de un aviso aparte.
window.copiarReferencia_ = function (ref, boton) {
    const marcarCopiado_ = function () {
        if (!boton) return;
        const original = boton.textContent;
        boton.textContent = '✓';
        setTimeout(function () { boton.textContent = original; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ref).then(marcarCopiado_).catch(function () {});
    } else {
        const areaTemporal = document.createElement('textarea');
        areaTemporal.value = ref;
        areaTemporal.style.position = 'fixed';
        areaTemporal.style.opacity = '0';
        document.body.appendChild(areaTemporal);
        areaTemporal.select();
        try { document.execCommand('copy'); marcarCopiado_(); } catch (e) { /* nada que hacer */ }
        document.body.removeChild(areaTemporal);
    }
};

// Botón flotante "subir arriba" — mismo umbral y comportamiento que la
// web pública (ver #btn-subir-arriba en index.html): aparece a partir
// de 400px de scroll, throttle con requestAnimationFrame.
(function () {
    const btn = document.getElementById('btnSubirArriba');
    let ticking = false;
    function actualizar() {
        btn.classList.toggle('visible', window.scrollY > 400);
        ticking = false;
    }
    window.addEventListener('scroll', function () {
        if (!ticking) { requestAnimationFrame(actualizar); ticking = true; }
    }, { passive: true });
    btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
})();

(async function () {
    // ?simulacion=1 — abierto desde simular.html: usamos la sesión
    // CON ALMACENAMIENTO PROPIO (ver supabase-client.js), que ya quedó
    // establecida allí vía verifyOtp. Nunca tocamos la sesión normal
    // de quien está simulando.
    const enSimulacion = new URLSearchParams(window.location.search).get('simulacion') === '1';
    const cliente = window.obtenerClienteSupabase_(enSimulacion);
    const avisoError = document.getElementById('avisoError');

    let sesion;
    if (enSimulacion) {
        const banda = document.createElement('div');
        banda.className = 'banda-simulacion';
        banda.textContent = 'MODO SIMULACIÓN — solo visualización, no se puede actuar en nombre del cliente';
        document.body.prepend(banda);
        document.body.style.paddingTop = '34px';
        // La banda es position:fixed y el padding-top de arriba la
        // compensa para el contenido normal del flujo — pero el
        // contenedor sticky (#contenedorFiltrosSuperior en PC,
        // .barra-filtros directamente en móvil — ver el @media) se
        // quedaba pegado bajo la banda, tapada por ella (z-index más
        // alto). Hay que desplazar también su punto de anclaje del
        // sticky, no solo el padding inicial — en los dos posibles
        // elementos, da igual cuál sea el realmente sticky ahora mismo.
        ['#contenedorFiltrosSuperior', '.barra-filtros'].forEach(function (sel) {
            const el = document.querySelector(sel);
            if (el) el.style.top = '34px';
        });

        const { data } = await cliente.auth.getSession();
        if (!data.session) {
            document.getElementById('cargando').style.display = 'none';
            avisoError.textContent = 'La simulación ha caducado. Vuelve a generarla desde el listado de clientes.';
            avisoError.classList.add('activo');
            document.getElementById('botonSalir').style.display = 'none';
            return;
        }
        sesion = data.session;
        document.getElementById('botonSalir').textContent = 'Salir de la simulación';
        document.getElementById('botonSalir').addEventListener('click', async function () {
            await cliente.auth.signOut();
            window.close();
        });
    } else {
        sesion = await window.exigirSesionAreaClientes_();
        if (!sesion) return;
        document.getElementById('botonSalir').addEventListener('click', async function () {
            await cliente.auth.signOut();
            window.location.href = 'index.html';
        });
    }

    const { data: perfil } = await cliente.from('profiles').select('nombre, apellidos, rol').eq('id', sesion.user.id).single();
    if (!enSimulacion && perfil && perfil.rol !== 'cliente') {
        // Comercial/administrador viendo esta URL directamente (no es
        // su pantalla) — al panel de gestión.
        window.location.href = 'gestion/clientes.html';
        return;
    }
    if (perfil && perfil.nombre) {
        document.getElementById('saludo').textContent = 'Hola, ' + perfil.nombre;
    }

    // Registro de "último acceso" para que comercial/administrador lo
    // vean en el panel de gestión — nunca durante una simulación (eso
    // no es una visita real del cliente). No bloquea nada si falla.
    if (!enSimulacion) {
        try { await cliente.rpc('registrar_ultimo_acceso_'); } catch (e) { /* no crítico */ }
    }

    const { data: datosCliente, error: errorCliente } = await cliente
        .from('clientes')
        .select('familias_visibles, areas_visibles, productos_visibles, modo_productos_visibles, descuento_pct, activo')
        .eq('id', sesion.user.id)
        .single();

    if (errorCliente || !datosCliente) {
        document.getElementById('cargando').style.display = 'none';
        avisoError.textContent = 'No se ha podido cargar tu ficha de cliente. Contacta con tu comercial.';
        avisoError.classList.add('activo');
        return;
    }

    // Baja lógica: si se desactiva mientras hay una sesión ya abierta
    // (no solo al iniciar sesión), se cierra aquí también.
    if (datosCliente.activo === false) {
        document.getElementById('cargando').style.display = 'none';
        avisoError.textContent = 'Tu acceso está desactivado. Contacta con tu comercial.';
        avisoError.classList.add('activo');
        if (!enSimulacion) await cliente.auth.signOut();
        document.getElementById('botonSalir').style.display = 'none';
        return;
    }

    const personalizacion = {
        familias: datosCliente.familias_visibles || [],
        areas: datosCliente.areas_visibles || [],
        productos: datosCliente.productos_visibles || [],
        modoProductos: datosCliente.modo_productos_visibles || 'incluir',
    };
    const descuentoPct = Number(datosCliente.descuento_pct || 0);

    let productos = [];
    let familiasOrden = {};
    let huboPintadoInicial = false;

    const rejilla = document.getElementById('rejilla');
    const sinResultados = document.getElementById('sinResultados');
    // Multiselección (a petición de Eloy, 27/11/2026): antes solo se
    // podía elegir una sola área a la vez (o ninguna). familia y
    // subfamilia usan el mismo criterio (ver construirMultiSelect_).
    let areasActivas = new Set();
    let familiasActivas = new Set();
    let subfamiliasActivas = new Set();
    // Filtro "Solo ofertas/promociones" (a petición de Eloy, 27/11/2026).
    let soloOfertasActivo_ = false;

    function debounce_(fn, ms) {
        let temporizador;
        return function () {
            const args = arguments;
            clearTimeout(temporizador);
            temporizador = setTimeout(function () { fn.apply(null, args); }, ms);
        };
    }

    function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
    }

    // ══════════════════════════════════════════════════════════════
    // MOTOR DE BÚSQUEDA — a petición de Eloy (27/11/2026): "sigue sin
    // mostrar sugerencias... y no tiene el diccionario cargado... estos
    // detalles del buscador tienen que estar igual en la modal de ver
    // la temporada". Mismo motor, mismo diccionario de abreviaturas y
    // sinónimos, y las mismas sugerencias tipo Amazon que ya tiene la
    // web pública (index.html) — portado tal cual, sin reinventar
    // nada: ABREVIATURAS_CATALOGO/SINONIMOS_CATALOGO/normalizar/
    // levenshtein/coincide/coincideReferencia son el mismo código.
    const ABREVIATURAS_CATALOGO = {
        imp: 'imprimacion', esm: 'esmalte', limp: 'limpiador', desinf: 'desinfectante',
        protec: 'proteccion', deterg: 'detergente', suaviz: 'suavizante', sint: 'sintetico',
        incol: 'incoloro', elect: 'electrico', perf: 'perfumado', revest: 'revestimiento',
        efect: 'efecto', prof: 'profesional', concent: 'concentrado', acond: 'acondicionador',
        est: 'estuche', vap: 'vaporizador', desod: 'desodorante', desmaq: 'desmaquillante',
        antisept: 'antiseptico', pest: 'pestañas', afeit: 'afeitado', dosif: 'dosificador',
        hidrat: 'hidratante', hid: 'hidratante', corp: 'corporal', reaf: 'reafirmante',
        cep: 'cepillo', liq: 'liquido', poliuret: 'poliuretano', acril: 'acrilico al agua',
        sat: 'satinado',
    };
    const SINONIMOS_CATALOGO = {
        antioxidante: ['anticorrosion', 'antioxido'],
        bombilla: ['lampara'], friegaplatos: ['lavavajillas'], bateria: ['pila'],
        dentifrico: ['dental'], carrocero: ['enmascarar'], cuchilla: ['hojas'],
        veneno: ['raticida', 'insecticida'], rimel: ['mascara'], pintalabios: ['labios'],
        kleenex: ['panuelos'], coche: ['vehiculo'], vehiculo: ['coche'],
        colutorio: ['bucal'], hilo: ['seda'], antitranspirante: ['desodorante'],
        alguicida: ['antialgas'], algicida: ['antialgas'], mechero: ['encendedor'],
        naftalina: ['polilla'], edc: ['colonia'],
    };
    const normalizarCache_ = new Map();
    function normalizarBusqueda_(txt) {
        const clave = txt == null ? '' : String(txt);
        const cacheado = normalizarCache_.get(clave);
        if (cacheado !== undefined) return cacheado;
        const base = clave.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
        const palabras = base.split(/[^a-z0-9áéíóúñ]+/i).filter(Boolean);
        const extra = [];
        palabras.forEach(function (p) {
            const expandida = ABREVIATURAS_CATALOGO[p];
            if (expandida && palabras.indexOf(expandida) === -1) extra.push(expandida);
        });
        const resultado = extra.length ? base + ' ' + extra.join(' ') : base;
        if (normalizarCache_.size > 20000) normalizarCache_.clear();
        normalizarCache_.set(clave, resultado);
        return resultado;
    }
    const levenshteinCache_ = new Map();
    function levenshtein_(a, b) {
        const clave = a + '\u0001' + b;
        const cacheado = levenshteinCache_.get(clave);
        if (cacheado !== undefined) return cacheado;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                matrix[i][j] = b.charAt(i - 1) === a.charAt(j - 1)
                    ? matrix[i - 1][j - 1]
                    : Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
            }
        }
        const resultado = matrix[b.length][a.length];
        if (levenshteinCache_.size > 20000) levenshteinCache_.clear();
        levenshteinCache_.set(clave, resultado);
        return resultado;
    }
    function maxErroresPermitidos_(longitud) {
        if (longitud <= 3) return 0;
        if (longitud <= 6) return 1;
        if (longitud <= 9) return 2;
        return 3;
    }
    function coincideUnaPalabra_(pBusqueda, palabrasTexto) {
        if (palabrasTexto.some(function (pTexto) { return pTexto.includes(pBusqueda); })) return true;
        if (pBusqueda.length <= 3) return false;
        const maxErr = maxErroresPermitidos_(pBusqueda.length);
        return palabrasTexto.some(function (pTexto) {
            if (Math.abs(pTexto.length - pBusqueda.length) > maxErr) return false;
            return levenshtein_(pTexto, pBusqueda) <= maxErr;
        });
    }
    function palabraCoincide_(pBusqueda, palabrasTexto) {
        if (coincideUnaPalabra_(pBusqueda, palabrasTexto)) return true;
        const sinonimos = SINONIMOS_CATALOGO[pBusqueda];
        if (sinonimos) return sinonimos.some(function (s) { return coincideUnaPalabra_(s, palabrasTexto); });
        return false;
    }
    function coincide_(texto, busqueda) {
        if (!busqueda) return true;
        const t = normalizarBusqueda_(texto);
        const b = normalizarBusqueda_(busqueda);
        if (t.includes(b)) return true;
        const bSinSep = b.replace(/[^a-z0-9]/g, '');
        if (bSinSep.length >= 3) {
            const tSinSep = t.replace(/[^a-z0-9]/g, '');
            const i = tSinSep.indexOf(bSinSep);
            if (i !== -1 && !/\d/.test(tSinSep.charAt(i + bSinSep.length) || '')) return true;
        }
        const palabrasBusqueda = b.split(/\s+/).filter(Boolean);
        if (!palabrasBusqueda.length) return true;
        const palabrasTexto = t.split(/\s+/).filter(Boolean);
        return palabrasBusqueda.every(function (p) { return palabraCoincide_(p, palabrasTexto); });
    }
    function esBusquedaNumerica_(busqueda) {
        const limpio = busqueda.replace(/\s+/g, '');
        if (!limpio) return false;
        const digitos = (limpio.match(/\d/g) || []).length;
        return digitos / limpio.length >= 0.7;
    }
    function coincideReferencia_(referencia, busqueda) {
        if (!busqueda) return true;
        const r = normalizarBusqueda_(referencia).replace(/[^a-z0-9]/g, '');
        const b = normalizarBusqueda_(busqueda).replace(/[^a-z0-9]/g, '');
        if (!b) return true;
        return r.includes(b);
    }

    // Bug real reportado (27/11/2026): "he copiado una referencia y la
    // he pegado en el buscador y no filtra por ese producto" — el
    // buscador solo comparaba contra el nombre con un simple
    // .includes(), nunca de forma difusa ni contra la referencia,
    // familia o subfamilia. Ahora usa el mismo motor que la web
    // pública (coincide_/coincideReferencia_): un término
    // predominantemente numérico se trata como código, el resto como
    // texto libre con tolerancia a erratas, abreviaturas y sinónimos.
    function coincideBusqueda_(p, termino) {
        if (esBusquedaNumerica_(termino)) return coincideReferencia_(p.ref, termino) || coincide_(p.nombre, termino);
        return coincide_(p.nombre, termino) || coincide_(p.ref, termino) || coincide_(p.familia, termino) || coincide_(p.subfamilia, termino);
    }

    // ── Sugerencias de búsqueda (autocompletar estilo Amazon) ────────
    const PALABRAS_IGNORADAS_SUGERENCIA_ = new Set([
        'ml', 'l', 'kg', 'g', 'gr', 'cm', 'mm', 'uds', 'ud',
        'de', 'del', 'la', 'el', 'los', 'las', 'y', 'con', 'para', 'sin', 'al', 'en',
    ]);
    let sugerenciasIndice_ = [];
    function construirIndiceSugerencias_() {
        const frecuencia = new Map();
        const sumar = function (texto) { if (texto) frecuencia.set(texto, (frecuencia.get(texto) || 0) + 1); };
        productos.forEach(function (p) {
            if (p.familia) sumar(normalizarBusqueda_(p.familia));
            if (p.subfamilia) sumar(normalizarBusqueda_(p.subfamilia));
            const palabras = normalizarBusqueda_(p.nombre)
                .split(/[^a-z0-9ñ]+/i)
                .filter(function (w) { return w.length >= 3 && !/^\d+$/.test(w) && !PALABRAS_IGNORADAS_SUGERENCIA_.has(w); });
            for (let i = 0; i < palabras.length; i++) {
                sumar(palabras[i]);
                if (i + 1 < palabras.length) sumar(palabras[i] + ' ' + palabras[i + 1]);
                if (i + 2 < palabras.length) sumar(palabras[i] + ' ' + palabras[i + 1] + ' ' + palabras[i + 2]);
            }
        });
        sugerenciasIndice_ = Array.from(frecuencia.entries())
            .filter(function (e) { return e[1] >= 3; })
            .sort(function (a, b) { return b[1] - a[1]; })
            .map(function (e) { return { texto: e[0], frecuencia: e[1] }; });
    }
    function obtenerSugerencias_(textoInput) {
        const q = normalizarBusqueda_(textoInput.trim());
        if (!q) return [];
        return sugerenciasIndice_.filter(function (s) { return s.texto.startsWith(q) && s.texto !== q; }).slice(0, 8);
    }

    // Conecta un <input> de búsqueda con su propio desplegable de
    // sugerencias — reutilizable tanto para el buscador principal como
    // para el de la modal "ver todos" de temporada, a petición expresa
    // de Eloy ("estos detalles del buscador tienen que estar igual en
    // la modal de ver la temporada").
    function activarSugerencias_(input, idContenedor, alSeleccionar) {
        const cont = document.getElementById(idContenedor);
        function render_(lista, textoInput) {
            if (!lista.length) { cont.classList.remove('visible'); cont.innerHTML = ''; return; }
            const q = normalizarBusqueda_(textoInput.trim());
            cont.innerHTML = lista.map(function (s) {
                const resto = s.texto.slice(q.length);
                return '<div class="sugerencia-item" data-texto="' + escapeHtml(s.texto) + '">' +
                    '<i class="fa-solid fa-magnifying-glass"></i>' +
                    '<span>' + escapeHtml(q) + '<strong>' + escapeHtml(resto) + '</strong></span>' +
                '</div>';
            }).join('');
            cont.classList.add('visible');
        }
        function ocultar_() { cont.classList.remove('visible'); }
        input.addEventListener('input', debounce_(function () {
            const valor = input.value;
            if (valor.trim().length >= 2) render_(obtenerSugerencias_(valor), valor); else ocultar_();
        }, 120));
        cont.addEventListener('click', function (e) {
            const item = e.target.closest('.sugerencia-item');
            if (!item) return;
            input.value = item.dataset.texto;
            ocultar_();
            alSeleccionar();
        });
        document.addEventListener('click', function (e) {
            if (!e.target.closest('.barra-buscador')) ocultar_();
        });
    }

    function precioOrdenable_(p) {
        const base = numeroDesdePrecio_(p.precio_mayor_con);
        return base === null ? Infinity : base; // sin precio de mayor, al final al ordenar por precio
    }

    function ordenFamilia_(familia) {
        return familiasOrden[familia] !== undefined ? familiasOrden[familia] : 9999;
    }

    // Constructor de tarjeta de producto — a petición de Eloy
    // (27/11/2026): "todos los bloques de productos tienen diferente
    // tamaño que los del grid principal... no incluye precio, oferta,
    // etc.". Extraída del grid principal para que CUALQUIER bloque
    // (destacados, temporadas, novedades, sigue explorando, últimos
    // vistos) use exactamente la misma tarjeta, con el mismo aspecto y
    // la misma información — igual que en la web pública, donde
    // .mas-buscados__lista reutiliza el mismo .producto-card del grid
    // principal, solo que en una fila con scroll horizontal en vez de
    // una rejilla.
    function crearTarjetaProducto_(p) {
        // El catálogo de clientes siempre parte del precio de mayor (a
        // petición de Eloy) — nunca del precio normal. Si todavía no ha
        // llegado la respuesta en vivo (p._precioProvisional) se
        // muestra "calculando…" en vez de un precio equivocado; si ya
        // llegó y de verdad no hay precio de mayor para ese producto,
        // se avisa.
        const hayPrecioMayor = p.precio_mayor_con !== undefined && p.precio_mayor_con !== null && p.precio_mayor_con !== '';
        let precioConBase = numeroDesdePrecio_(p.precio_mayor_con);
        let precioSinBase = numeroDesdePrecio_(p.precio_mayor_sin);
        const tarjeta = document.createElement('div');
        tarjeta.className = 'producto-tarjeta';
        tarjeta.dataset.ref = p.ref;

        // Destacado vigente con descuento/promoción real (igual que la
        // web pública) — si lo hay, el precio de partida para el
        // descuento del cliente ya no es el de mayor normal, sino el
        // rebajado: los dos descuentos se acumulan (primero el de la
        // promoción, después el propio del cliente), igual que ya
        // ocurría entre precio normal y precio de mayor.
        const destacado = destacadoVigentePara_(p.ref);
        const precioDestacado = destacado ? calcularPrecioMayorDestacado_(p, destacado) : null;
        const hayPromoDestacado = !!(precioDestacado && precioDestacado.promoMayor !== null);
        // Bug real reportado (27/11/2026): "hay productos que se indica
        // que tienen un 3x2 y eso no aparece" — un destacado tipo "3x2"
        // normalmente NO cambia el precio (no hay descuentoPorcentaje ni
        // precioAlternativo), solo lleva texto de promoción o tipo. Antes
        // el chip y el texto de promoción solo se pintaban si ADEMÁS
        // había un descuento de precio real calculado — exactamente al
        // revés de lo que pasa con un 3x2. Igual que en la web pública:
        // basta con que el destacado tenga tipo O texto de promoción O
        // descuento real para considerarse "una oferta real" (ver el
        // "continue" de destacadosProductosVigentes_ en index.html).
        const hayAlgoDestacado = !!(destacado && (destacado.tipoDestacado || destacado.textoPromocion || hayPromoDestacado));
        let chipsEsquina = '';
        let promoTextoHtml = '';
        if (hayAlgoDestacado) {
            chipsEsquina = etiquetaDestacadoHtml_(destacado.tipoDestacado);
            if (destacado.textoPromocion) promoTextoHtml = '<span class="destacado-promo-texto">' + destacado.textoPromocion.replace(/</g, '&lt;') + '</span>';
            if (hayPromoDestacado) {
                precioConBase = precioDestacado.promoMayor;
                precioSinBase = precioDestacado.promoMayorSin;
            }
        } else if (p.oferta) {
            chipsEsquina = '<span class="insignia-oferta">Oferta</span>';
        }

        let htmlPrecio;
        if (p._precioProvisional) {
            htmlPrecio = '<div class="producto-tarjeta__precio-calculando"><span class="cargando-spinner" style="border-top-color:var(--blue); width:12px; height:12px; border-width:2px;"></span>Calculando precio…</div>';
        } else if (p.mostrar_precio === false) {
            htmlPrecio = '<div class="producto-tarjeta__precio" style="font-size:0.85rem;">Consultar precio</div>';
        } else if (!hayPrecioMayor || precioConBase === null) {
            htmlPrecio = '<div class="producto-tarjeta__precio" style="font-size:0.8rem; color:var(--muted);">Precio de mayor no disponible</div>';
        } else {
            const precioConFinal = descuentoPct > 0 ? (precioConBase * (1 - descuentoPct / 100)) : precioConBase;
            const precioSinFinal = (precioSinBase !== null && descuentoPct > 0) ? (precioSinBase * (1 - descuentoPct / 100)) : precioSinBase;
            // Precio tachado: el de mayor normal si hay promoción de
            // destacado (prioridad) o, si no, el de antes del descuento
            // propio del cliente — nunca los dos acumulados en el
            // tachado, solo el precio final sí lleva ambos aplicados.
            const precioTachadoTxt = hayPromoDestacado
                ? precioDestacado.originalMayor.toFixed(2).replace('.', ',')
                : (descuentoPct > 0 ? p.precio_mayor_con : null);
            htmlPrecio =
                '<div class="producto-tarjeta__etiqueta-precio">Precio de mayor</div>' +
                promoTextoHtml +
                '<div class="producto-tarjeta__precio-fila">' +
                    (precioTachadoTxt !== null ? '<span class="producto-tarjeta__precio-original">' + precioTachadoTxt + ' €</span>' : '') +
                    '<span class="producto-tarjeta__precio">' + precioConFinal.toFixed(2).replace('.', ',') + ' €</span>' +
                '</div>' +
                (precioSinFinal !== null ? '<div class="producto-tarjeta__precio-sin">' + precioSinFinal.toFixed(2).replace('.', ',') + ' € sin IVA</div>' : '') +
                (hayPromoDestacado && precioDestacado.pct ? '<span class="destacado-precio-pct">-' + precioDestacado.pct + '%</span>' : '') +
                (descuentoPct > 0 ? '<span class="insignia-ahorro">-' + descuentoPct + '% adicional</span>' : '');
        }

        tarjeta.innerHTML =
            '<div class="producto-tarjeta__img-envoltorio">' +
                chipsEsquina +
                '<img src="' + urlImagenProducto_(p) + '" alt="" loading="lazy" onerror="window.reintentarImagenProducto_(this)">' +
            '</div>' +
            '<div class="producto-tarjeta__cuerpo">' +
                '<div class="producto-tarjeta__nombre" title="' + p.nombre.replace(/"/g, '&quot;') + '">' + p.nombre + '</div>' +
                '<div class="producto-tarjeta__ref">' +
                    '<span>Ref. ' + p.ref + '</span>' +
                    '<button type="button" class="producto-tarjeta__ref-copiar" title="Copiar referencia" aria-label="Copiar referencia">📋</button>' +
                '</div>' +
                '<div class="producto-tarjeta__precios">' + htmlPrecio + '</div>' +
            '</div>';
        tarjeta.querySelector('.producto-tarjeta__ref-copiar').addEventListener('click', function (ev) {
            ev.stopPropagation(); // no abrir el detalle al copiar
            window.copiarReferencia_(p.ref, this);
        });
        tarjeta.addEventListener('click', function () { window.abrirDetalleProducto_ && window.abrirDetalleProducto_(p, descuentoPct); });
        return tarjeta;
    }

    // Pinta una lista de productos dentro de CUALQUIER contenedor
    // (por defecto, la rejilla principal) — generalizada para poder
    // reutilizarla también en la modal "ver todos" de cada temporada.
    function pintar_(lista, orden, contenedorDestino) {
        const destino = contenedorDestino || rejilla;
        destino.innerHTML = '';
        if (destino === rejilla) {
            sinResultados.style.display = lista.length ? 'none' : 'block';
            if (!lista.length) {
                document.getElementById('sinResultadosCargando').style.display = catalogoProvisional_ ? 'block' : 'none';
                document.getElementById('sinResultadosTexto').style.display = catalogoProvisional_ ? 'none' : 'block';
            }
        }

        if (orden === 'familia') {
            const familias = Array.from(new Set(lista.map(function (p) { return p.familia || '(sin familia)'; })))
                .sort(function (a, b) { return ordenFamilia_(a) - ordenFamilia_(b); });
            familias.forEach(function (familia) {
                const titulo = document.createElement('div');
                titulo.className = 'grupo-familia__titulo';
                titulo.textContent = familia;
                destino.appendChild(titulo);
                const fila = document.createElement('div');
                fila.className = 'rejilla-productos';
                fila.style.marginBottom = '6px';
                lista.filter(function (p) { return (p.familia || '(sin familia)') === familia; })
                    .sort(function (a, b) { return a.nombre.localeCompare(b.nombre); })
                    .forEach(function (p) { fila.appendChild(crearTarjetaProducto_(p)); });
                destino.appendChild(fila);
            });
            destino.classList.remove('rejilla-productos');
        } else {
            if (!destino.classList.contains('rejilla-productos')) destino.classList.add('rejilla-productos');
            lista.forEach(function (p) { destino.appendChild(crearTarjetaProducto_(p)); });
        }
    }

    // ── Selector múltiple con buscador interno, reutilizado para
    // familia y subfamilia — a petición de Eloy (27/11/2026): antes
    // eran <select> de una sola opción, sin forma de filtrar por texto
    // ni de combinar varias a la vez.
    function construirMultiSelect_(idContenedor, opciones, seleccionSet, etiqueta, alCambiar) {
        const contenedor = document.getElementById(idContenedor);
        const estabaAbierto = contenedor.classList.contains('abierto');
        contenedor.innerHTML =
            '<button type="button" class="multi-select__boton">' +
                '<span>' + etiqueta + '</span>' +
                (seleccionSet.size ? '<span class="multi-select__boton-contador">' + seleccionSet.size + '</span>' : '') +
            '</button>' +
            '<div class="multi-select__panel">' +
                '<input type="search" class="multi-select__buscador" placeholder="Buscar ' + etiqueta.toLowerCase() + '…">' +
                '<div class="multi-select__lista"></div>' +
            '</div>';

        const boton = contenedor.querySelector('.multi-select__boton');
        const buscadorPanel = contenedor.querySelector('.multi-select__buscador');
        const lista = contenedor.querySelector('.multi-select__lista');

        function pintarLista_() {
            const termino = buscadorPanel.value.trim().toLowerCase();
            const filtradas = termino ? opciones.filter(function (o) { return o.toLowerCase().includes(termino); }) : opciones;
            if (!filtradas.length) {
                lista.innerHTML = '<div class="multi-select__sin-resultados">Sin resultados</div>';
                return;
            }
            lista.innerHTML = filtradas.map(function (o) {
                const seguro = o.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return '<label class="multi-select__opcion"><input type="checkbox" data-valor="' + o.replace(/"/g, '&quot;') + '"' +
                    (seleccionSet.has(o) ? ' checked' : '') + '>' + seguro + '</label>';
            }).join('');
            lista.querySelectorAll('input[type="checkbox"]').forEach(function (chk) {
                chk.addEventListener('change', function () {
                    if (this.checked) seleccionSet.add(this.dataset.valor); else seleccionSet.delete(this.dataset.valor);
                    const contador = boton.querySelector('.multi-select__boton-contador');
                    if (seleccionSet.size) {
                        if (contador) contador.textContent = seleccionSet.size;
                        else boton.insertAdjacentHTML('beforeend', '<span class="multi-select__boton-contador">' + seleccionSet.size + '</span>');
                    } else if (contador) {
                        contador.remove();
                    }
                    alCambiar();
                });
            });
        }
        pintarLista_();
        buscadorPanel.addEventListener('input', pintarLista_);

        boton.addEventListener('click', function (ev) {
            ev.stopPropagation();
            document.querySelectorAll('.multi-select.abierto').forEach(function (el) { if (el !== contenedor) el.classList.remove('abierto'); });
            contenedor.classList.toggle('abierto');
        });
        contenedor.querySelector('.multi-select__panel').addEventListener('click', function (ev) { ev.stopPropagation(); });

        if (estabaAbierto) contenedor.classList.add('abierto');
    }

    // Cierra cualquier panel de selector múltiple abierto al clicar
    // fuera — una sola vez, no en cada reconstrucción.
    document.addEventListener('click', function () {
        document.querySelectorAll('.multi-select.abierto').forEach(function (el) { el.classList.remove('abierto'); });
    });

    function actualizarSelectorFamilia_() {
        const base = areasActivas.size ? productos.filter(function (p) { return areasActivas.has(p.area); }) : productos;
        const familias = Array.from(new Set(base.map(function (p) { return p.familia; }).filter(Boolean)))
            .sort(function (a, b) { return ordenFamilia_(a) - ordenFamilia_(b); });
        Array.from(familiasActivas).forEach(function (f) { if (!familias.includes(f)) familiasActivas.delete(f); });
        construirMultiSelect_('multiFamilia', familias, familiasActivas, 'Familia', function () {
            actualizarSelectorSubfamilia_();
            aplicarFiltros_();
        });
    }

    function actualizarSelectorSubfamilia_() {
        let base = areasActivas.size ? productos.filter(function (p) { return areasActivas.has(p.area); }) : productos;
        if (familiasActivas.size) base = base.filter(function (p) { return familiasActivas.has(p.familia); });
        const subfamilias = Array.from(new Set(base.map(function (p) { return p.subfamilia; }).filter(Boolean))).sort();
        Array.from(subfamiliasActivas).forEach(function (s) { if (!subfamilias.includes(s)) subfamiliasActivas.delete(s); });
        construirMultiSelect_('multiSubfamilia', subfamilias, subfamiliasActivas, 'Subfamilia', aplicarFiltros_);
    }

    // Chips de área — multiselección (antes era "una o todas"), a
    // petición explícita de Eloy. Solo se muestran si el catálogo del
    // cliente abarca más de una área.
    let areasPresentes = [];
    function pintarChipsArea_() {
        const contenedorChips = document.getElementById('chipsAreas');
        if (areasPresentes.length <= 1) { contenedorChips.innerHTML = ''; return; }
        contenedorChips.innerHTML = '';
        areasPresentes.forEach(function (area) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip-filtro' + (areasActivas.has(area) ? ' activo' : '');
            chip.textContent = area;
            chip.addEventListener('click', function () {
                if (areasActivas.has(area)) areasActivas.delete(area); else areasActivas.add(area);
                pintarChipsArea_();
                actualizarSelectorFamilia_();
                aplicarFiltros_();
            });
            contenedorChips.appendChild(chip);
        });
    }

    // Chips de filtros ya aplicados (área/familia/subfamilia/búsqueda),
    // quitables de uno en uno sin tener que reabrir cada selector — y
    // botón para limpiarlos todos de golpe y volver al estado por
    // defecto, a petición de Eloy.
    function pintarFiltrosActivos_() {
        const contenedor = document.getElementById('filtrosActivos');
        const termino = document.getElementById('buscador').value.trim();
        const chips = [];
        areasActivas.forEach(function (a) { chips.push({ texto: a, quitar: function () { areasActivas.delete(a); } }); });
        familiasActivas.forEach(function (f) { chips.push({ texto: f, quitar: function () { familiasActivas.delete(f); } }); });
        subfamiliasActivas.forEach(function (s) { chips.push({ texto: s, quitar: function () { subfamiliasActivas.delete(s); } }); });
        if (termino) chips.push({ texto: '“' + termino + '”', quitar: function () { document.getElementById('buscador').value = ''; } });
        if (soloOfertasActivo_) chips.push({ texto: 'Solo ofertas y promociones', quitar: function () { soloOfertasActivo_ = false; } });

        document.getElementById('botonFiltroOferta').classList.toggle('activo', soloOfertasActivo_);
        contenedor.innerHTML = '';
        chips.forEach(function (c) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip-filtro-activo';
            chip.innerHTML = c.texto.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + ' <span class="cerrar">✕</span>';
            chip.addEventListener('click', function () {
                c.quitar();
                pintarChipsArea_();
                actualizarSelectorFamilia_();
                actualizarSelectorSubfamilia_();
                aplicarFiltros_();
            });
            contenedor.appendChild(chip);
        });
        document.getElementById('botonLimpiarFiltros').style.display = chips.length ? 'inline-flex' : 'none';
    }

    function limpiarFiltros_() {
        areasActivas.clear();
        familiasActivas.clear();
        subfamiliasActivas.clear();
        soloOfertasActivo_ = false;
        document.getElementById('botonFiltroOferta').classList.remove('activo');
        document.getElementById('buscador').value = '';
        document.getElementById('orden').value = 'familia';
        pintarChipsArea_();
        actualizarSelectorFamilia_();
        actualizarSelectorSubfamilia_();
        aplicarFiltros_();
    }

    function aplicarFiltros_() {
        const termino = document.getElementById('buscador').value.trim().toLowerCase();
        const orden = document.getElementById('orden').value;
        let lista = productos.slice();
        if (areasActivas.size) lista = lista.filter(function (p) { return areasActivas.has(p.area); });
        if (familiasActivas.size) lista = lista.filter(function (p) { return familiasActivas.has(p.familia); });
        if (subfamiliasActivas.size) lista = lista.filter(function (p) { return subfamiliasActivas.has(p.subfamilia); });
        if (termino) lista = lista.filter(function (p) { return coincideBusqueda_(p, termino); });
        if (soloOfertasActivo_) lista = lista.filter(tieneOfertaOPromocion_);

        if (orden === 'nombre_desc') lista.sort(function (a, b) { return b.nombre.localeCompare(a.nombre); });
        else if (orden === 'precio_asc') lista.sort(function (a, b) { return precioOrdenable_(a) - precioOrdenable_(b); });
        else if (orden === 'precio_desc') lista.sort(function (a, b) { return precioOrdenable_(b) - precioOrdenable_(a); });
        else if (orden === 'familia_orden') {
            // Igual que "Agrupar por familia" pero en lista continua,
            // sin títulos de sección — mismo orden de familia (y de
            // nombre dentro de cada una).
            lista.sort(function (a, b) {
                const diferenciaFamilia = ordenFamilia_(a.familia || '(sin familia)') - ordenFamilia_(b.familia || '(sin familia)');
                return diferenciaFamilia !== 0 ? diferenciaFamilia : a.nombre.localeCompare(b.nombre);
            });
        }
        else if (orden !== 'familia') lista.sort(function (a, b) { return a.nombre.localeCompare(b.nombre); }); // nombre_asc, por defecto

        pintar_(lista, orden);
        pintarFiltrosActivos_();
        // Bug real reportado (27/11/2026): "si aplico un filtro no se
        // aplica a ningún bloque" — los bloques de descubrimiento
        // partían siempre del catálogo completo, nunca del filtrado.
        // cargarModulosDescubrimiento_ ya no vuelve a pedir nada si los
        // datos en vivo ya están descargados, solo repinta con el
        // filtro actual (ver poolFiltradoActual_).
        if (typeof cargarModulosDescubrimiento_ === 'function') cargarModulosDescubrimiento_();
    }

    // Bug real reportado (27/11/2026): "si por detrás se está
    // procesando hay que incluir un spinner antes de indicar que no
    // hay productos" — con el catálogo completo todavía sin llegar
    // (fase 1, solo el JSON estático reducido), un filtro o búsqueda
    // podía dar "0 resultados" con datos parciales y un instante
    // después mostrar los resultados reales de golpe al llegar la
    // fase 2 — un parpadeo real, no un error de filtrado.
    let catalogoProvisional_ = true;

    function mostrarContenidoInicial_(listaProductos, provisional) {
        productos = listaProductos;
        catalogoProvisional_ = !!provisional;
        document.getElementById('cargando').style.display = 'none';
        document.getElementById('contenido').style.display = 'block';
        document.getElementById('aviso').textContent = productos.length + ' producto(s) en tu catálogo.' + (provisional ? ' Calculando precios…' : '');

        areasPresentes = Array.from(new Set(productos.map(function (p) { return p.area; }).filter(Boolean)));
        construirIndiceSugerencias_();

        if (!huboPintadoInicial) {
            // Bug real reportado (27/11/2026): llamaba a aplicarFiltros_
            // (que repinta toda la rejilla, cientos/miles de tarjetas)
            // en CADA pulsación, sin ningún retraso — a diferencia del
            // buscador público (index.html), que sí usa un debounce.
            // Con catálogos grandes esto se notaba como lag real al
            // escribir y, sobre todo, al borrar varios caracteres
            // seguidos (cada borrado repintaba la rejilla entera).
            document.getElementById('buscador').addEventListener('input', debounce_(aplicarFiltros_, 200));
            activarSugerencias_(document.getElementById('buscador'), 'sugerenciasBuscador', aplicarFiltros_);
            document.getElementById('orden').addEventListener('change', aplicarFiltros_);
            document.getElementById('botonLimpiarFiltros').addEventListener('click', limpiarFiltros_);
            document.getElementById('botonFiltroOferta').addEventListener('click', function () {
                soloOfertasActivo_ = !soloOfertasActivo_;
                aplicarFiltros_();
            });

            // Solo tiene efecto visual en móvil (ver @media en el
            // <style>) — en escritorio el botón ni se muestra.
            document.getElementById('botonToggleFiltros').addEventListener('click', function () {
                document.getElementById('barraFiltros').classList.toggle('filtros-abiertos');
            });

            huboPintadoInicial = true;
        }

        pintarChipsArea_();
        actualizarSelectorFamilia_();
        actualizarSelectorSubfamilia_();
        aplicarFiltros_();
        cargarModulosDescubrimiento_();
    }

    // ══════════════════════════════════════════════════════════════
    // BLOQUES DE DESCUBRIMIENTO (destacados, temporadas, novedades,
    // sigue explorando, últimos vistos) — a petición de Eloy
    // (27/11/2026). Mismos módulos, mismo aspecto (misma tarjeta que
    // el grid principal) y misma funcionalidad que la web pública
    // (index.html: cargarDestacados_, cargarTemporadas_,
    // cargarNovedades_, cargarBloquesCategorias_, cargarUltimosVistos_)
    // — se reutilizan las MISMAS acciones de Apps Script, sin tocar
    // nada del servidor. Todos los bloques parten siempre de
    // poolFiltradoActual_(), que aplica los mismos filtros activos
    // (área/familia/subfamilia/búsqueda) que ya usa el grid principal
    // — así "se aplican a todos los bloques", igual que en la web
    // pública (ver refsFiltroActivoSet_ en index.html).
    function normalizarSimple_(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    }

    function construirMatchDesdePalabrasClave_(palabrasClave) {
        const alternativas = (palabrasClave || '')
            .split(',')
            .map(function (alt) { return alt.split('+').map(function (p) { return normalizarSimple_(p.trim()); }).filter(Boolean); })
            .filter(function (grupo) { return grupo.length; });
        return function (textoNormalizado) {
            return alternativas.some(function (grupo) { return grupo.every(function (palabra) { return textoNormalizado.indexOf(palabra) !== -1; }); });
        };
    }

    function derivarTerminoBusqueda_(palabrasClave) {
        const primeraAlternativa = (palabrasClave || '').split(',')[0] || '';
        return primeraAlternativa.split('+').map(function (p) { return p.trim(); }).filter(Boolean).join(' ').trim();
    }

    function estacionActual_() {
        const mes = new Date().getMonth();
        if ([10, 11, 0, 1].indexOf(mes) !== -1) return 'frio';
        if ([4, 5, 6, 7, 8].indexOf(mes) !== -1) return 'calor';
        return null;
    }

    function campanaActivaHoy_(c) {
        if (c.activa === false) return false;
        if (c.permanente) return true;
        if (!c.fechaInicio || !c.fechaFin) return false;
        const hoy = new Date();
        return hoy >= new Date(c.fechaInicio + 'T00:00:00') && hoy <= new Date(c.fechaFin + 'T23:59:59');
    }

    function fechaVigente_(fechaTexto) {
        if (!fechaTexto) return true;
        const fecha = new Date(fechaTexto);
        if (isNaN(fecha.getTime())) return true;
        return fecha.getTime() > Date.now();
    }

    // Parsea el formato 'dd/MM/yyyy HH:mm:ss' que usa apps_script_trigger.js
    // para fecha_alta/fecha_registro — ver valorCelda_ en ese archivo.
    function parseFechaSheet_(texto) {
        if (!texto) return null;
        const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(texto);
        if (!m) return null;
        return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getTime();
    }

    function barajar_(array) {
        const copia = array.slice();
        for (let i = copia.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = copia[i]; copia[i] = copia[j]; copia[j] = tmp;
        }
        return copia;
    }

    // Mismo criterio de filtrado que aplicarFiltros_ (área/familia/
    // subfamilia/búsqueda), pero SIN ordenar — es la base que comparten
    // todos los bloques de descubrimiento, para que un filtro activo
    // también se note ahí (antes solo afectaba al grid principal).
    function poolFiltradoActual_() {
        const termino = document.getElementById('buscador').value.trim().toLowerCase();
        let lista = productos;
        if (areasActivas.size) lista = lista.filter(function (p) { return areasActivas.has(p.area); });
        if (familiasActivas.size) lista = lista.filter(function (p) { return familiasActivas.has(p.familia); });
        if (subfamiliasActivas.size) lista = lista.filter(function (p) { return subfamiliasActivas.has(p.subfamilia); });
        if (termino) lista = lista.filter(function (p) { return coincideBusqueda_(p, termino); });
        if (soloOfertasActivo_) lista = lista.filter(tieneOfertaOPromocion_);
        return lista;
    }

    // Los 4 bloques "simples" (destacados/novedades/sigue explorando/
    // últimos vistos) viven ya en el HTML, en el orden fijo pedido por
    // Eloy — aquí solo se rellenan o se ocultan, nunca se crean ni se
    // reordenan (así el orden entre ellos nunca depende del orden en
    // que terminan sus peticiones de red).
    function renderFilaHorizontal_(idBloque, tituloHtml, listaProductos, opciones) {
        opciones = opciones || {};
        const bloque = document.getElementById(idBloque);
        if (!bloque) return null;
        if (!listaProductos.length) { bloque.style.display = 'none'; return null; }
        bloque.style.display = '';
        bloque.innerHTML =
            '<div class="modulo-descubrimiento__cabecera">' +
                '<p class="modulo-descubrimiento__titulo' + (opciones.alClicarTitulo ? ' modulo-descubrimiento__titulo-clicable' : '') + '">' + tituloHtml + '</p>' +
                (opciones.botonCabecera || '') +
            '</div>' +
            '<div class="modulo-descubrimiento__fila"></div>';
        if (opciones.alClicarTitulo) bloque.querySelector('.modulo-descubrimiento__titulo').addEventListener('click', opciones.alClicarTitulo);
        if (opciones.alClicarBoton) {
            const boton = bloque.querySelector('.modulo-descubrimiento__boton-cabecera');
            if (boton) boton.addEventListener('click', opciones.alClicarBoton);
        }
        const fila = bloque.querySelector('.modulo-descubrimiento__fila');
        listaProductos.forEach(function (p) { fila.appendChild(crearTarjetaProducto_(p)); });
        return bloque;
    }

    // Caché de las respuestas EN VIVO (se piden una sola vez por visita;
    // reaplicar un filtro solo tiene que volver a pintar con lo ya
    // descargado, nunca volver a pedir nada al servidor).
    let destacadosRaw_ = null;
    let temporadasRaw_ = null;
    let bloquesCategoriasDefs_ = null;

    function cargarModulosDescubrimiento_() {
        if (!productos.length) return;
        const peticiones = [];
        if (!destacadosRaw_) {
            peticiones.push(
                fetch(CATALOGO_URL_.replace('accion=obtener_productos', 'accion=obtener_destacados'), { cache: 'no-store' })
                    .then(function (r) { return r.json(); })
                    .then(function (d) { destacadosRaw_ = d; })
