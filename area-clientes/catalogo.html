                    .catch(function (e) { console.warn('obtener_destacados: no se pudo cargar', e); destacadosRaw_ = { activo: false, productos: [] }; })
            );
        }
        if (!temporadasRaw_) {
            peticiones.push(
                fetch(CATALOGO_URL_.replace('accion=obtener_productos', 'accion=obtener_temporadas'), { cache: 'no-store' })
                    .then(function (r) { return r.json(); })
                    .then(function (d) { temporadasRaw_ = Array.isArray(d.temporadas) ? d.temporadas : []; })
                    .catch(function (e) { console.warn('obtener_temporadas: no se pudo cargar', e); temporadasRaw_ = []; })
            );
        }
        if (!bloquesCategoriasDefs_) {
            peticiones.push(
                fetch(CATALOGO_URL_.replace('accion=obtener_productos', 'accion=obtener_bloques_categorias'), { cache: 'no-store' })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        const filas = (Array.isArray(d) ? d : (d.bloques || [])).filter(function (f) { return f.activo; });
                        bloquesCategoriasDefs_ = barajar_(filas.map(function (fila) {
                            return {
                                id: fila.id,
                                titulo: fila.titulo,
                                match: construirMatchDesdePalabrasClave_(fila.palabrasClave),
                                terminoBusqueda: derivarTerminoBusqueda_(fila.palabrasClave),
                                area: fila.area || undefined,
                                estacion: fila.estacion || undefined,
                            };
                        }));
                    })
                    .catch(function (e) { console.warn('obtener_bloques_categorias: no se pudo cargar', e); bloquesCategoriasDefs_ = []; })
            );
        }
        Promise.all(peticiones).then(repintarModulosDescubrimiento_);
        // Si ya estaba todo descargado de antes (p. ej. al cambiar un
        // filtro), repinta ya mismo sin esperar a ninguna petición.
        if (!peticiones.length) repintarModulosDescubrimiento_();
    }

    // Repinta TODOS los bloques con los datos ya descargados — se llama
    // tanto tras la carga inicial como cada vez que cambia un filtro
    // (ver aplicarFiltros_), para que los bloques respeten el filtro
    // activo igual que el grid principal.
    function repintarModulosDescubrimiento_() {
        repintarDestacados_();
        repintarTemporadas_();
        repintarNovedades_();
        repintarBloquesCategorias_();
        repintarUltimosVistos_();
    }

    // Resuelve si un producto está destacado y vigente AHORA MISMO,
    // independientemente de cualquier filtro — usado tanto por el
    // bloque de Destacados como por CUALQUIER tarjeta del grid general
    // (a petición de Eloy: "esos detalles deben aparecer también en el
    // grid de productos generales", no solo dentro del propio bloque).
    function destacadoVigentePara_(ref) {
        if (!destacadosRaw_ || !destacadosRaw_.activo || !fechaVigente_(destacadosRaw_.fechaFin)) return null;
        const d = (destacadosRaw_.productos || []).find(function (x) {
            return String(x.referencia) === String(ref) && x.activo && fechaVigente_(x.fechaFin);
        });
        return d || null;
    }

    function etiquetaDestacadoHtml_(tipo) {
        const mapa = {
            oferta: ['Oferta', 'destacado-chip--oferta'],
            oportunidad: ['Oportunidad', 'destacado-chip--oportunidad'],
            liquidacion: ['Liquidación', 'destacado-chip--liquidacion'],
        };
        const entrada = mapa[tipo];
        return entrada ? '<span class="destacado-chip ' + entrada[1] + '">' + entrada[0] + '</span>' : '';
    }

    // Mismo criterio que calcularPrecioDestacado_ en index.html, pero
    // resuelto directamente sobre el precio AL POR MAYOR (aquí no hay
    // perfil público/profesional distinto: el área de clientes siempre
    // parte del precio de mayor) — precioAlternativo se define contra
    // el precio público (precio_con), así que la fracción de descuento
    // que representa se deriva de ahí y LUEGO se aplica también al
    // mayorista, igual que "promoMayor" en la web pública.
    function calcularPrecioMayorDestacado_(p, d) {
        const vacio = { originalMayor: null, promoMayor: null, promoMayorSin: null, pct: null };
        const originalMayor = numeroDesdePrecio_(p.precio_mayor_con);
        if (originalMayor === null) return vacio;

        let fraccionDescuento = null;
        if (d.precioAlternativo !== null && d.precioAlternativo !== undefined && d.precioAlternativo !== '') {
            const original = numeroDesdePrecio_(p.precio_con);
            const alt = parseFloat(d.precioAlternativo);
            if (original !== null && isFinite(alt) && alt >= 0 && alt < original) fraccionDescuento = 1 - (alt / original);
        } else if (d.descuentoPorcentaje !== null && d.descuentoPorcentaje !== undefined && d.descuentoPorcentaje !== '') {
            const pct = parseFloat(d.descuentoPorcentaje);
            if (isFinite(pct) && pct > 0 && pct <= 100) fraccionDescuento = pct / 100;
        }
        if (fraccionDescuento === null) return vacio;

        const promoMayor = originalMayor * (1 - fraccionDescuento);
        const sinBase = numeroDesdePrecio_(p.precio_mayor_sin);
        const promoMayorSin = sinBase !== null ? sinBase * (1 - fraccionDescuento) : null;
        return { originalMayor: originalMayor, promoMayor: promoMayor, promoMayorSin: promoMayorSin, pct: Math.round(fraccionDescuento * 100) };
    }

    // "¿Tiene oferta o promoción?" — oferta genérica del producto O
    // destacado vigente con descuento real (usado por el filtro "Solo
    // ofertas/promociones").
    function tieneOfertaOPromocion_(p) {
        if (p.oferta) return true;
        const d = destacadoVigentePara_(p.ref);
        if (!d) return false;
        return !!(d.tipoDestacado || d.textoPromocion || calcularPrecioMayorDestacado_(p, d).promoMayor !== null);
    }

    // ── Destacados y ofertas ──────────────────────────────────────────
    function repintarDestacados_() {
        if (!destacadosRaw_ || !destacadosRaw_.activo || !fechaVigente_(destacadosRaw_.fechaFin)) {
            renderFilaHorizontal_('bloqueDestacados', '', []);
            return;
        }
        const pool = poolFiltradoActual_();
        const porRef = {};
        pool.forEach(function (p) { porRef[p.ref] = p; });
        const lista = (destacadosRaw_.productos || [])
            .filter(function (d) { return d.activo && fechaVigente_(d.fechaFin) && porRef[d.referencia]; })
            .sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); })
            .map(function (d) { return porRef[d.referencia]; });
        renderFilaHorizontal_(
            'bloqueDestacados',
            '<span class="modulo-descubrimiento__icono modulo-descubrimiento__icono--rojo"><i class="fa-solid fa-fire"></i></span> Destacados',
            lista
        );
    }

    // ── Temporadas (un bloque independiente por cada temporada vigente,
    // con un número limitado de tarjetas — el título abre la modal "ver
    // todos" con el catálogo completo de esa temporada) ──────────────
    const MAX_TARJETAS_TEMPORADA_INLINE_ = 15;

    function productosDeTemporada_(temporada, pool) {
        const familiasSet = new Set((temporada.familias || []).map(function (f) { return f.toLowerCase(); }));
        const refsVistas = new Set();
        const lista = [];
        if (familiasSet.size) {
            pool.forEach(function (p) {
                if (p.familia && familiasSet.has(p.familia.toLowerCase()) && !refsVistas.has(p.ref)) { refsVistas.add(p.ref); lista.push(p); }
            });
        }
        (temporada.referencias || []).forEach(function (ref) {
            if (refsVistas.has(ref)) return;
            const p = pool.find(function (x) { return String(x.ref) === String(ref); });
            if (p) { refsVistas.add(ref); lista.push(p); }
        });
        const excluidas = new Set((temporada.excluidas || []).map(function (r) { return String(r); }));
        return excluidas.size ? lista.filter(function (p) { return !excluidas.has(String(p.ref)); }) : lista;
    }

    function repintarTemporadas_() {
        const contenedor = document.getElementById('contenedorTemporadas');
        if (!temporadasRaw_) return;
        const pool = poolFiltradoActual_();
        const vigentes = temporadasRaw_.filter(campanaActivaHoy_).sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
        contenedor.innerHTML = '';
        vigentes.forEach(function (temporada) {
            const lista = productosDeTemporada_(temporada, pool);
            if (!lista.length) return;
            const bloque = document.createElement('div');
            bloque.className = 'modulo-descubrimiento';
            bloque.innerHTML =
                '<div class="modulo-descubrimiento__cabecera">' +
                    '<p class="modulo-descubrimiento__titulo modulo-descubrimiento__titulo-clicable">' +
                        '<span class="modulo-descubrimiento__icono modulo-descubrimiento__icono--azul">' + (temporada.emoji ? temporada.emoji.replace(/</g, '&lt;') : '<i class="fa-solid fa-snowflake"></i>') + '</span> ' +
                        temporada.nombre.replace(/</g, '&lt;') +
                        ' <i class="fa-solid fa-chevron-right modulo-descubrimiento__flecha"></i>' +
                    '</p>' +
                '</div>' +
                '<div class="modulo-descubrimiento__fila"></div>';
            bloque.querySelector('.modulo-descubrimiento__titulo').addEventListener('click', function () { abrirModalTemporada_(temporada, lista); });
            const fila = bloque.querySelector('.modulo-descubrimiento__fila');
            barajar_(lista).slice(0, MAX_TARJETAS_TEMPORADA_INLINE_).forEach(function (p) { fila.appendChild(crearTarjetaProducto_(p)); });
            contenedor.appendChild(bloque);
        });
    }

    // Modal "ver todos" de una temporada — con búsqueda, familia
    // (multiselección) y orden, igual que el grid principal, a
    // petición de Eloy ("con filtros arriba, exactamente igual que
    // está en la web pública").
    function abrirModalTemporada_(temporada, listaCompleta) {
        document.getElementById('modalTemporadaTitulo').textContent = temporada.nombre;
        const familiasTemporada = new Set();
        let familiasSeleccion = new Set();
        let terminoActual = '';
        let ordenActual = 'nombre_asc';

        function listaFiltrada_() {
            let lista = listaCompleta;
            if (familiasSeleccion.size) lista = lista.filter(function (p) { return familiasSeleccion.has(p.familia); });
            if (terminoActual) lista = lista.filter(function (p) { return coincideBusqueda_(p, terminoActual); });
            lista = lista.slice();
            if (ordenActual === 'precio_asc') lista.sort(function (a, b) { return precioOrdenable_(a) - precioOrdenable_(b); });
            else if (ordenActual === 'precio_desc') lista.sort(function (a, b) { return precioOrdenable_(b) - precioOrdenable_(a); });
            else lista.sort(function (a, b) { return a.nombre.localeCompare(b.nombre); });
            return lista;
        }
        function repintar_() {
            pintar_(listaFiltrada_(), 'nombre_asc', document.getElementById('modalTemporadaGrid'));
        }

        listaCompleta.forEach(function (p) { if (p.familia) familiasTemporada.add(p.familia); });
        construirMultiSelect_('modalTemporadaFamilia', Array.from(familiasTemporada).sort(function (a, b) { return ordenFamilia_(a) - ordenFamilia_(b); }), familiasSeleccion, 'Familia', repintar_);

        const buscador = document.getElementById('modalTemporadaBuscador');
        buscador.value = '';
        buscador.oninput = debounce_(function () { terminoActual = buscador.value.trim().toLowerCase(); repintar_(); }, 200);
        // activarSugerencias_ se conecta UNA sola vez (más abajo, fuera de
        // esta función) para no acumular listeners en cada apertura de la
        // modal — esta variable es la indirección que le dice, en todo
        // momento, qué hacer al elegir una sugerencia PARA LA TEMPORADA
        // QUE ESTÉ ABIERTA AHORA MISMO.
        manejarSeleccionSugerenciaTemporada_ = function () {
            terminoActual = buscador.value.trim().toLowerCase();
            repintar_();
        };

        const orden = document.getElementById('modalTemporadaOrden');
        orden.value = 'nombre_asc';
        orden.onchange = function () { ordenActual = orden.value; repintar_(); };

        repintar_();
        document.getElementById('modalTemporadaOverlay').classList.add('activo');
    }
    // Indirección para las sugerencias de la modal de temporada — ver el
    // porqué junto a donde se reasigna, dentro de abrirModalTemporada_.
    let manejarSeleccionSugerenciaTemporada_ = function () {};
    activarSugerencias_(document.getElementById('modalTemporadaBuscador'), 'sugerenciasModalTemporada', function () {
        manejarSeleccionSugerenciaTemporada_();
    });
    document.getElementById('modalTemporadaCerrar').addEventListener('click', function () {
        document.getElementById('modalTemporadaOverlay').classList.remove('activo');
    });
    document.getElementById('modalTemporadaOverlay').addEventListener('click', function (ev) {
        if (ev.target === this) this.classList.remove('activo');
    });

    // ── Novedades (lo más reciente dado de alta) — con rotación
    // aleatoria periódica, igual que en la web pública ("se mostrarán
    // de manera aleatoria esos productos... van rotando"). ───────────
    let novedadesCandidatos_ = [];
    let novedadesTimer_ = null;
    const MAX_TARJETAS_NOVEDADES_ = 15;
    const INTERVALO_ROTACION_NOVEDADES_MS = 6000;

    function repintarNovedades_() {
        const pool = poolFiltradoActual_();
        novedadesCandidatos_ = pool
            .map(function (p) { return { p: p, t: parseFechaSheet_(p.fecha_alta) || parseFechaSheet_(p.fecha) }; })
            .filter(function (x) { return x.t !== null; })
            .sort(function (a, b) { return b.t - a.t; })
            .slice(0, 60)
            .map(function (x) { return x.p; });

        if (novedadesTimer_) { clearInterval(novedadesTimer_); novedadesTimer_ = null; }
        if (!novedadesCandidatos_.length) { renderFilaHorizontal_('bloqueNovedades', '', []); return; }

        const visibles = barajar_(novedadesCandidatos_).slice(0, MAX_TARJETAS_NOVEDADES_);
        renderFilaHorizontal_(
            'bloqueNovedades',
            '<span class="modulo-descubrimiento__icono modulo-descubrimiento__icono--verde"><i class="fa-solid fa-box-open"></i></span> Novedades',
            visibles
        );
        if (novedadesCandidatos_.length > MAX_TARJETAS_NOVEDADES_) {
            novedadesTimer_ = setInterval(function () { rotarUnaNovedad_(visibles); }, INTERVALO_ROTACION_NOVEDADES_MS);
        }
    }

    // Bug real reportado (27/11/2026): "al hacer scroll en algunos
    // momentos da trompicones". La única tarea que se repite sola en
    // esta página es esta rotación (cada 6s) — sustituye una tarjeta
    // entera del DOM (con sus propios listeners), lo que fuerza un
    // reflow de toda la fila; si eso coincide justo con el momento en
    // que el usuario está desplazándose, se nota como un tirón. Se
    // evita saltándose el turno mientras hay scroll activo (y hasta
    // 400ms después de que pare) — no hace falta más: el siguiente
    // intervalo ya lo retoma.
    let ultimoScrollTs_ = 0;
    window.addEventListener('scroll', function () { ultimoScrollTs_ = Date.now(); }, { passive: true });

    function rotarUnaNovedad_(visibles) {
        if (Date.now() - ultimoScrollTs_ < 400) return;
        const fila = document.querySelector('#bloqueNovedades .modulo-descubrimiento__fila');
        if (!fila) { if (novedadesTimer_) clearInterval(novedadesTimer_); return; }
        const refsVisibles = new Set(visibles.map(function (p) { return p.ref; }));
        const disponibles = novedadesCandidatos_.filter(function (p) { return !refsVisibles.has(p.ref); });
        if (!disponibles.length) return;
        const nuevo = disponibles[Math.floor(Math.random() * disponibles.length)];
        const idx = Math.floor(Math.random() * visibles.length);
        const tarjetaVieja = fila.children[idx];
        if (!tarjetaVieja) return;
        tarjetaVieja.classList.add('producto-tarjeta--transicion');
        setTimeout(function () {
            const tarjetaNueva = crearTarjetaProducto_(nuevo);
            tarjetaNueva.classList.add('producto-tarjeta--transicion');
            fila.replaceChild(tarjetaNueva, tarjetaVieja);
            visibles[idx] = nuevo;
            requestAnimationFrame(function () { tarjetaNueva.classList.remove('producto-tarjeta--transicion'); });
        }, 220);
    }

    // ── Sigue explorando (bloques de categoría por palabras clave) —
    // un único bloque contenedor con varios sub-bloques en carrusel,
    // cada uno una rejilla 2x2 de solo imagen (igual que en la web
    // pública: aquí no se repite nombre/precio, es un atajo visual,
    // no otra rejilla de productos). ──────────────────────────────────
    const COLORES_CATEGORIA_ = ['rojo', 'verde', 'amarillo', 'azul'];
    const MAX_BLOQUES_CATEGORIA_ = 25;
    const PRODUCTOS_POR_BLOQUE_CATEGORIA_ = 4;

    function crearItemBloqueCategoria_(p) {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'categoria-bloque__item';
        item.title = p.nombre;
        item.innerHTML = '<img src="' + urlImagenProducto_(p) + '" alt="" loading="lazy" onerror="window.reintentarImagenProducto_(this)">';
        item.addEventListener('click', function (ev) {
            ev.stopPropagation();
            window.abrirDetalleProducto_ && window.abrirDetalleProducto_(p, descuentoPct);
        });
        return item;
    }

    function aplicarFiltroCategoria_(def) {
        document.getElementById('buscador').value = def.terminoBusqueda;
        if (def.area) { areasActivas.clear(); areasActivas.add(def.area); pintarChipsArea_(); actualizarSelectorFamilia_(); }
        aplicarFiltros_();
        document.getElementById('rejilla').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function repintarBloquesCategorias_() {
        const contenedorSeccion = document.getElementById('bloqueSigueExplorando');
        const carrusel = document.getElementById('categoriasCarrusel');
        if (!bloquesCategoriasDefs_ || !bloquesCategoriasDefs_.length) { contenedorSeccion.style.display = 'none'; return; }
        const pool = poolFiltradoActual_();
        const estacion = estacionActual_();
        carrusel.innerHTML = '';
        let n = 0;
        bloquesCategoriasDefs_.forEach(function (def) {
            if (n >= MAX_BLOQUES_CATEGORIA_) return;
            if (def.estacion && def.estacion !== estacion) return;
            const candidatos = pool.filter(function (p) {
                return (!def.area || p.area === def.area) && def.match(normalizarSimple_([p.nombre, p.familia, p.subfamilia, p.fabricante].filter(Boolean).join(' ')));
            });
            if (candidatos.length < PRODUCTOS_POR_BLOQUE_CATEGORIA_) return;
            const color = COLORES_CATEGORIA_[n % COLORES_CATEGORIA_.length];
            const bloque = document.createElement('div');
            bloque.className = 'categoria-bloque categoria-bloque--' + color;
            bloque.setAttribute('role', 'button');
            bloque.setAttribute('tabindex', '0');
            bloque.setAttribute('aria-label', 'Ver todos los productos de ' + def.titulo);
            bloque.addEventListener('click', function () { aplicarFiltroCategoria_(def); });
            bloque.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); aplicarFiltroCategoria_(def); } });
            const titulo = document.createElement('p');
            titulo.className = 'categoria-bloque__titulo';
            titulo.textContent = def.titulo;
            const grid = document.createElement('div');
            grid.className = 'categoria-bloque__grid';
            barajar_(candidatos).slice(0, PRODUCTOS_POR_BLOQUE_CATEGORIA_).forEach(function (p) { grid.appendChild(crearItemBloqueCategoria_(p)); });
            bloque.innerHTML = '<span class="categoria-bloque__lupa"><i class="fa-solid fa-magnifying-glass"></i></span>';
            bloque.appendChild(titulo);
            bloque.appendChild(grid);
            carrusel.appendChild(bloque);
            n++;
        });
        contenedorSeccion.style.display = n > 0 ? '' : 'none';
    }

    // ── Últimos productos vistos (solo en este navegador) — un único
    // botón "Borrar historial" para todo el bloque, no uno por
    // producto, a petición explícita de Eloy ("que el borrar el
    // historial sea general para ese bloque y no por producto"). ─────
    const CLAVE_ULTIMOS_VISTOS_ = 'om_area_clientes_ultimos_vistos';
    const MAX_ULTIMOS_VISTOS_ = 15;

    function leerUltimosVistos_() {
        try { return JSON.parse(localStorage.getItem(CLAVE_ULTIMOS_VISTOS_) || '[]'); } catch (e) { return []; }
    }
    function guardarUltimosVistos_(refs) {
        try { localStorage.setItem(CLAVE_ULTIMOS_VISTOS_, JSON.stringify(refs)); } catch (e) { /* almacenamiento no disponible — no es crítico */ }
    }
    window.registrarProductoVisto_ = function (ref) {
        let refs = leerUltimosVistos_().filter(function (r) { return r !== ref; });
        refs.unshift(ref);
        refs = refs.slice(0, MAX_ULTIMOS_VISTOS_);
        guardarUltimosVistos_(refs);
    };
    window.repintarUltimosVistos_ = function repintarUltimosVistos_() {
        const pool = poolFiltradoActual_();
        const refs = leerUltimosVistos_();
        const lista = refs.map(function (ref) { return pool.find(function (p) { return p.ref === ref; }); }).filter(Boolean);
        renderFilaHorizontal_(
            'bloqueUltimosVistos',
            '<span class="modulo-descubrimiento__icono modulo-descubrimiento__icono--gris"><i class="fa-solid fa-clock-rotate-left"></i></span> Últimos productos vistos',
            lista,
            {
                botonCabecera: lista.length ? '<button type="button" class="modulo-descubrimiento__boton-cabecera" title="Borrar historial" aria-label="Borrar historial"><i class="fa-solid fa-trash"></i> Borrar historial</button>' : '',
                alClicarBoton: function () {
                    guardarUltimosVistos_([]);
                    repintarUltimosVistos_();
                }
            }
        );
    };

    // ── Fase 1: pintado instantáneo con el JSON estático ──────────────
    // Sin precio de mayor todavía (ese dato nunca viaja por aquí) — se
    // marca cada producto como "_precioProvisional" para que la
    // tarjeta muestre "calculando precio…" en vez de un precio
    // equivocado, hasta que llegue la fase 2.
    try {
        const respEstatico = await fetch(CATALOGO_ESTATICO_URL_, { cache: 'default' });
        if (respEstatico.ok) {
            const datosEstaticos = await respEstatico.json();
            familiasOrden = datosEstaticos.familias_orden || {};
            const productosEstaticos = (datosEstaticos.productos || [])
                .filter(function (p) { return !p.fecha_baja && productoVisibleParaCliente_(p, personalizacion); })
                .map(function (p) { return Object.assign({ _precioProvisional: true }, p); });
            if (productosEstaticos.length) mostrarContenidoInicial_(productosEstaticos, true);
        }
    } catch (e) { /* si falla, no pasa nada — la fase 2 (en vivo) es la que de verdad importa */ }

    // ── Fase 2: reconciliar con la respuesta en vivo (con precio de
    //    mayor real, ya validado contra Supabase) ─────────────────────
    try {
        const resp = await fetch(CATALOGO_URL_ + '&token_cliente=' + encodeURIComponent(sesion.access_token), { cache: 'no-store' });
        const datos = await resp.json();
        const productosEnVivo = (datos.productos || []).filter(function (p) {
            return !p.fecha_baja && productoVisibleParaCliente_(p, personalizacion);
        });
        mostrarContenidoInicial_(productosEnVivo);
    } catch (e) {
        if (!huboPintadoInicial) {
            document.getElementById('cargando').style.display = 'none';
            avisoError.textContent = 'No se ha podido cargar el catálogo ahora mismo. Inténtalo de nuevo en unos minutos.';
            avisoError.classList.add('activo');
            return;
        }
        // Si ya había pintado estático y solo falla la reconciliación
        // en vivo, se queda con el precio "calculando…" — mejor eso
        // que esconder todo el catálogo por un fallo de red puntual.
    }

    if (descuentoPct > 0) {
        const insignia = document.getElementById('insigniaDescuento');
        insignia.textContent = '-' + descuentoPct + '% en todo tu catálogo';
        insignia.style.display = 'inline-block';
    }
})();
</script>
