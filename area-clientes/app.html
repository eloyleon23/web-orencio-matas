<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área de Clientes · Orencio Matas</title>
<link rel="stylesheet" href="assets/estilos.css">
</head>
<body>
<nav class="navbar-om">
    <div class="navbar-om__marca">
        <img src="assets/logo-orencio.png" alt="Orencio Matas" class="navbar-om__logo">
        <span class="navbar-om__etiqueta">Área de Clientes</span>
    </div>
    <div class="navbar-om__usuario">
        <span class="insignia-rol" id="insigniaRol">…</span>
        <button class="boton-secundario" id="botonSalir" style="width:auto; margin:0; padding:8px 14px;">Cerrar sesión</button>
    </div>
</nav>
<div class="envoltorio-centrado">
<div class="tarjeta tarjeta--ancha">
    <h1 id="saludo">Hola</h1>
    <p class="ayuda" id="aviso">
        En construcción: el catálogo personalizado y las propuestas de
        pedido llegan en las fases siguientes del plan.
    </p>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
(async function () {
    const sesion = await window.exigirSesionAreaClientes_();
    if (!sesion) return;

    const cliente = window.obtenerClienteSupabase_();
    document.getElementById('saludo').textContent = 'Hola, ' + sesion.user.email;

    const { data: perfil, error } = await cliente
        .from('profiles')
        .select('rol, nombre, apellidos')
        .eq('id', sesion.user.id)
        .single();

    const insignia = document.getElementById('insigniaRol');
    if (error || !perfil) {
        insignia.textContent = 'rol desconocido';
    } else {
        // Comercial/administrador no tienen nada que hacer en esta
        // pantalla (pensada para el cliente) — van directos al panel
        // de gestión.
        if (['comercial', 'administrador'].includes(perfil.rol)) {
            window.location.href = 'gestion/clientes.html';
            return;
        }
        insignia.textContent = perfil.rol;
        if (perfil.nombre) {
            document.getElementById('saludo').textContent =
                'Hola, ' + perfil.nombre + (perfil.apellidos ? ' ' + perfil.apellidos : '');
        }
    }

    document.getElementById('botonSalir').addEventListener('click', async function () {
        await cliente.auth.signOut();
        window.location.href = 'index.html';
    });
})();
</script>
</body>
</html>
